<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>译制台 · 真实项目控制台</title><link rel="stylesheet" href="/console/styles.css"><script src="/console/app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#sessions"><span class="brand-mark">译</span><span>译制台<small>LOCALIZATION OS</small></span></a><div class="project"><span class="project-icon">V</span><div>广告视频本地化<small>video-translation</small></div></div><div class="nav-label">工作空间</div><nav aria-label="主导航"><button class="nav active" data-nav="sessions"><span>▦</span> 会话总览</button><button class="nav" data-nav="automations"><span>◷</span> 自动任务</button><button class="nav" data-nav="knowledge"><span>◇</span> 经验与知识</button><button class="nav" data-nav="system"><span>⌘</span> 运行与接入</button></nav><div class="nav-label">快捷操作</div><button class="quick" data-action="intake">＋ 按需求号接单</button><button class="quick" data-action="summarize">↗ 总结新增经验</button><div class="sidebar-bottom"><span class="status-dot"></span> 本机真实项目记录<small>本地产物每5秒刷新<br>宿主指令按分钟派发</small><a class="text-btn" href="/" target="_blank" rel="noopener">原工作台 ↗</a></div></aside>
<div class="workspace"><header class="topbar"><div class="breadcrumb">广告视频本地化 <span>/</span><strong id="page-name">会话总览</strong></div><div class="top-actions"><span id="connection" class="badge">正在连接</span><button class="btn" data-action="refresh">刷新</button></div></header><main id="main"><div class="empty">正在读取真实项目…</div></main><footer class="footer"><span id="read-time">尚未同步</span><span>输出、质量、平台提交分别记录 · 未记录内容保持未知</span></footer></div>
<dialog id="artifact-dialog" class="artifact-dialog"><div class="dialog-head"><h2 id="artifact-title">节点产物</h2><button class="icon-btn" data-close="artifact-dialog" aria-label="关闭产物">×</button></div><div id="artifact-body"></div></dialog>
<dialog id="intake-dialog"><form id="intake-form"><div class="dialog-head"><h2>按需求号接单</h2><button type="button" class="icon-btn" data-close="intake-dialog" aria-label="关闭接单">×</button></div><p class="muted">交给原 Fireplay 负责会话核查并接入。已有编号会话将复用。</p><label for="code">需求编号</label><input id="code" required placeholder="APC-20261103-014" pattern="[A-Za-z]{2,8}-[0-9]{8}-[0-9]{3}" maxlength="24"><label for="note">补充要求</label><textarea id="note" maxlength="3000" placeholder="可选：范围、保留内容或优先语种"></textarea><p class="notice">保存后显示待派发；收到宿主回执仅代表已交办。真实原片、语种、预算与编号会话建立后，才会显示对应制作进度。</p><button class="btn primary full" type="submit">交办这个需求 →</button></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
