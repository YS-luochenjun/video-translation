<dialog id="artifact-dialog" class="artifact-dialog" aria-labelledby="artifact-title"><div class="dialog-head"><h2 id="artifact-title">节点产物</h2><button type="button" class="btn" data-close="artifact-dialog" autofocus>关闭</button></div><div id="artifact-body"></div></dialog>
<dialog id="intake-dialog"><form id="intake-form"><div class="dialog-head"><h2>按需求号接单</h2><button type="button" class="icon-btn" data-close="intake-dialog" aria-label="关闭接单">×</button></div><p class="muted">交给原 Fireplay 负责会话核查并接入。已有编号会话将复用。</p><label for="code">需求编号</label><input id="code" required placeholder="APC-20261103-014" pattern="[A-Za-z]{2,8}-[0-9]{8}-[0-9]{3}" maxlength="24"><label for="note">补充要求</label><textarea id="note" maxlength="3000" placeholder="可选：范围、保留内容或优先语种"></textarea><p class="notice">保存后显示待派发；收到宿主回执仅代表已交办。真实原片、语种、预算与编号会话建立后，才会显示对应制作进度。</p><button class="btn primary full" type="submit">交办这个需求 →</button></form></dialog>
<dialog id="handoff-dialog"><div class="dialog-head"><h2>这一次交办</h2><button class="icon-btn" data-close="handoff-dialog" aria-label="关闭交办">×</button></div><p>复制下面的单次指令，粘贴到本项目的宿主聊天。也可在「译制工作台」宿主插件中直接交办。</p><p id="handoff-id" class="tiny-hash"></p><textarea id="handoff-prompt" readonly rows="9" aria-label="单次交办指令"></textarea><button class="btn primary" data-action="copy-handoff">复制交办指令</button><p class="notice">已受理和业务完成分别记录。每条指令只交办一次。</p></dialog>
<div id="toast" role="status" aria-live="polite"></div>
