           elif action == 'status':\n                    value = fireplay.status(code)\n                elif action == 'source':\n                    value = fireplay.source(code, spec_path, index, execute)\n                elif action == 'chat':\n                    value = fireplay.chat(code, spec_path, index, execute)\n                elif action == 'start':\n                    value = fireplay.start(code, spec_path, index)\n                elif action == 'publication_review':\n                    from video_localizer.fireplay_publication import review\n                    value = review(code, spec_path)\n                elif action == 'youtube_route':\n                    from video_localizer.fireplay_youtube import record_route\n                    value = record_route(code, spec_path, index)\n                elif action == 'youtube_handoff':\n                    from video_localizer.fireplay_youtube_handoff import record_receipt\n                    value = record_receipt(code, spec_path)\n                elif action == 'return':\n                    value = fireplay.prepare_return(code, spec_path)\n                elif action == 'dispatch':\n                    value = fireplay.dispatch(code, execute, index=index)\n                elif action == 'retry_upload':\n                    from video_localizer.fireplay_retry import retry_upload\n                    value = retry_upload(code, arguments['locale'], spec_path, execute, ROOT, index)\n                elif action == 'completion_check':\n                    from video_localizer.fireplay_submission import verify_completion\n                    value = verify_completion(code, spec_path, ROOT)\n                elif action == 'close':\n                    from video_localizer.fireplay_submission import close_delivery\n                    value = close_delivery(code, ROOT)\n                elif action == 'receipt':\n                    value = fireplay.receipt(code, arguments['operation'], spec_path, index=index)\n                else:\n                    raise WorkflowError('Invalid Fireplay action')\n            elif name == 'localizer_model_routing':\n                from video_localizer.model_routing import policy\n                value = policy()\n            elif name == 'localizer_codex_packet':\n                from video_localizer.codex_visual import packet\n                value = packet(get_run(arguments['run']), arguments.get('stage', 'recognize'), arguments.get('spec'))\n            elif name == 'localizer_codex_result':\n                from video_localizer.codex_visual import record\n                value = record(get_run(arguments['run']), arguments['packet'], arguments['report'])\n            elif name == 'localizer_local_tts':\n                from video_localizer.local_tts import generate\n                value = generate(get_run(arguments['run']), arguments['spec'])\n            elif name == 'localizer_close_failure':\n                from video_localizer.failure_closure import close\n                value = close(get_run(arguments['run']), arguments['spec'])\n            elif name == 'localizer_maintain':\n                from video_localizer.maintenance import maintain\n                value = maintain(get_run(arguments['run']), close=arguments.get('close', False))\n            elif name == 'localizer_work_packet':\n                from video_localizer.work_packet import build\n                value = build(get_run(arguments['run']), arguments.get('stage'))\n            elif name == 'localizer_production':\n                from video_localizer.production import advance\n                value = advance(get_run(arguments['run']))\n            elif name == 'localizer_compose_best':\n                from video_localizer.finalization import compose\n                value = compose(get_run(arguments['run']))\n            elif name == 'localizer_finalize':\n                from video_localizer.finalization import finish\n                value = finish(get_run(arguments['run']), arguments.get('spec', 'review/finalization.json'))\n            elif name == 'localizer_repair_preflight':\n                from video_localizer.repair import preflight\n                value = preflight(get_run(arguments['run']), detect_cuts=True)\n            elif name == 'localizer_repair_recipe':\n                from video_localizer.repair import execute\n                mode=arguments.get('mode','probe')\n                if mode not in ('probe','full'): raise WorkflowError('Invalid repair mode')\n                value=execute(get_run(arguments['run']),arguments['recipe'],mode=='probe',arguments.get('extension_reason'))\n            elif name == \"localizer_knowledge_queue\":\n                from video_localizer.knowledge_review import queue\n                value = {\"items\": [{k: v for k, v in row.items() if k not in {\"record\", \"decision\"}} for row in queue(ROOT)]}\n            elif name == \"localizer_knowledge_use\":\n                from video_localizer.knowledge_usage import record\n                run = get_run(arguments[\"run\"])\n                value = record(run, read_json(inside(run, arguments[\"spec\"])), ROOT)\n            elif name in {\"localizer_knowledge\", \"localizer_knowledge_advisories\"}:\n                features = [v.strip() for v in arguments.get(\"features\", \"\").split(\",\") if v.strip()]\n                from video_localizer.knowledge_advisories import retrieve as retrieve_advisories\n                reader = retrieve if name == \"localizer_knowledge\" else retrieve_advisories\n                value = reader({\"workflow\": \"video-localization\", **arguments, \"features\": features,\n                                  \"tags\": [\"text\", \"timing\", \"ads\", *features]})\n            elif name.startswith('localizer_visual_'):\n                from video_localizer import visual_audit\n                run = get_run(arguments['run'])\n                if name == 'localizer_visual_evidence':\n                    value = visual_audit.generate(run, arguments.get('stage', 'final'), arguments.get('shot'))\n                elif name == 'localizer_visual_review':\n                    value = visual_audit.review(run, arguments['manifest'], arguments['observation'])\n                elif name == 'localizer_visual_notes':\n                    from video_localizer.visual_notes import submit\n                    value = submit(run, arguments['manifest'], arguments['notes'])\n                elif name == 'localizer_visual_pages':\n                    from video_localizer.visual_notes import pages\n                    value = pages(run, arguments['manifest'], arguments['instance'], layer=arguments.get('layer','all'),\n                                  after_frame=int(arguments['after_frame']) if 'after_frame' in arguments else None,\n                                  limit=int(arguments.get('limit','2')), columns=arguments.get('columns',1))\n                else:\n                    value = visual_audit.release_neutral(run, arguments['shot'])\n            else:\n                run = get_run(arguments[\"run\"])\n                functions = {\"localizer_analyze\": workflow.analyze, \"localizer_plan\": workflow.build_plan,\n                             \"localizer_render\": workflow.render, \"localizer_capture\": capture, \"localizer_quality\": workflow.quality}\n                value = functions[name](run)\n            response[\"result\"] = {\"content\": [{\"type\": \"text\", \"text\": json.dumps(value, ensure_ascii=False)}], \"isError\": False}\n        else:\n            response[\"error\"] = {\"code\": -32601, \"message\": \"Method not found\"}\n    except (WorkflowError, KeyError, ValueError, TypeError, OSError) as exc:\n        response[\"result\"] = {\"content\": [{\"type\": \"text\", \"text\": str(exc)}], \"isError\": True}\n    return response\n\n\nif __name__ == \"__main__\":\n    sys.stdout.reconfigure(encoding=\"utf-8\")\n    sys.stderr.reconfigure(encoding=\"utf-8\")\n    for line in sys.stdin:\n        try:\n            result = handle(json.loads(line))\n        except ValueError:\n            result = {\"jsonrpc\": \"2.0\", \"id\": None, \"error\": {\"code\": -32700, \"message\": \"Parse error\"}}\n        if result is not None:\n            print(json.dumps(result, ensure_ascii=False), flush=True)\n\n","lines":226,"sha256":"305ff9438fa58fabeb63653675c989a2d57b0f6a9f4f275a11f21ee9d50bf1cd"},{"path":"config/content-features.json","text":"{\n  \"schema_version\": 1,\n  \"aliases\": {\n    \"moving_text\": \"animated_text\",\n    \"artistic_text\": \"artistic_typography\",\n    \"multi_shot\": \"multiple_shots\",\n    \"voiceover\": \"speech\",\n    \"human_speech\": \"speech\",\n    \"caption_audio_sync\": \"speech_captions\",\n    \"music_with_singing\": \"sung_background_music\",\n    \"same_source_multilingual\": \"multilingual_batch\",\n    \"multi_language_reuse\": \"multilingual_batch\",\n    \"multi_speaker\": \"multi_character_dialogue\",\n    \"multiple_speakers\": \"multi_character_dialogue\",\n    \"multi_character\": \"multi_character_dialogue\"\n  },\n  \"note\": \"Normalize synonymous observed features only. Story settings are descriptions, not algorithm triggers. Unknown features remain available and require explanation; aliases do not infer identity, gender or unobserved motion.\",\n  \"definitions\": {\n    \"speech\": \"Actual identifiable dialogue, monologue, narration or spoken CTA; ASR blank alone is not absence.\",\n    \"multi_character_dialogue\": \"At least two actual speaking roles supported by source audio/context; shot count or ASR segments is not speaker count.\",\n    \"short_drama\": \"Observed dramatic dialogue/narrative, not inferred only from family/hospital/school labels.\",\n    \"short_utterance\": \"A brief actual reply/interjection requiring independent coverage; no universal duration threshold.\",\n    \"long_speech\": \"An actual turn whose translated duration strains its observed source window.\",\n    \"overlapping_speech\": \"Audible simultaneous turns, not merely adjacent ASR segments.\",\n    \"static_text_surface\": \"Stable observed surface/container, separately protect dynamic fingers/numbers/icons.\",\n    \"animated_text\": \"Text itself changes position/scale/rotation/opacity/shape, not camera motion alone.\",\n    \"foreground_occlusion\": \"Actual object passes in front of text/repair area and needs time-dependent layering.\",\n    \"publisher_watermark\": \"Observed publisher watermark or a confirmed matching endcard wordmark/logo; static or moving. Identity is an Agent observation, not a filename guess.\",\n    \"moving_watermark\": \"Observed publisher mark changes position/rotation or enters/leaves frame.\",\n    \"speech_captions\": \"Text actually representing spoken content, distinct from independent title/UI.\",\n    \"artistic_typography\": \"Observed decorative, textured, outlined or expressive letterforms requiring style judgment, not any large font.\",\n    \"filmed_phone_ui\": \"A physical phone screen seen in the source scene, including its perspective and foreground interaction.\",\n    \"surface_typography\": \"Target text must follow an observed surface's geometry, texture, transparency or motion instead of a plain screen overlay.\",\n    \"multiple_shots\": \"Observed cuts or scene changes; this alone does not prove animated text or multiple speakers.\",\n    \"sung_background_music\": \"Actual sung musical material whose retention/replacement needs a role decision, separate from spoken dialogue.\",\n    \"multilingual_batch\": \"The real user request contains multiple target locales; never increases source count or request credit allowance.\",\n    \"repeated_character\": \"Evidence links the same speaking role across turns/shots; keep its identity and voice stable.\",\n    \"onscreen_text\": \"Actual non-preserved onscreen text instances; includes captions, does not establish text-led type.\",\n    \"audio_led\": \"Agent observed core information is carried primarily by intelligible speech; all onscreen copy still covered.\",\n    \"onscreen_text_led\": \"Agent observed core information in independent onscreen copy; all narration/dialogue still translated.\",\n    \"mixed\": \"Agent observed speech and independent onscreen copy each carry essential information; subtitles alone do not establish mixed type.\"\n  }\n}\n","lines":43,"sha256":"8e36a31a02503ffb0d161cef129c325806a54026286231edf1c51ccaa0b9d1f5"},{"path":"config/hooks.json","text":"{\n  \"schema_version\": 1,\n  \"knowledge_daily\": {\n    \"enabled\": true,\n    \"time\": \"18:00\",\n    \"timezone\": \"Asia/Shanghai\",\n    \"max_records\": 24,\n    \"max_packet_bytes\": 180000,\n    \"engine\": \"codex_cli\",\n    \"timeout_seconds\": 240,\n    \"prompt\": \"config/hooks/knowledge-curation/prompt.md\"\n  }\n}\n","lines":13,"sha256":"02e62ff6bfaeb3424254b61b24291f955475abcf4c2fb06ec2955198736b193d"},{"path":"config/language-aliases.json","text":"{\n  \"schema_version\": 1,\n  \"groups\": {\n    \"en\": [\"en\", \"us\", \"us2\"],\n    \"pt\": [\"pt\", \"por\", \"portuguese\", \"portugal\", \"br\", \"bra\", \"brazil\", \"brasil\", \"ptbr\", \"pt-br\"],\n    \"es\": [\"es\", \"esp\", \"spanish\", \"spain\", \"mx\", \"mexico\", \"cl\", \"co\", \"pe\"],\n    \"ja\": [\"ja\", \"jp\", \"jpn\", \"japanese\", \"japan\"],\n    \"de\": [\"de\", \"deu\", \"ger\", \"german\", \"germany\"],\n    \"fr\": [\"fr\", \"fra\", \"fre\", \"french\", \"france\"],\n    \"it\": [\"it\", \"ita\", \"italian\", \"italy\"],\n    \"id\": [\"id\", \"ind\", \"indonesian\", \"indonesia\"],\n    \"th\": [\"th\", \"tha\", \"thai\", \"thailand\"],\n    \"vi\": [\"vi\", \"vie\", \"vietnamese\", \"vietnam\", \"vn\"],\n    \"ko\": [\"ko\", \"kor\", \"korean\", \"kr\", \"korea\"],\n    \"zh\": [\"zh\", \"cn\", \"chs\", \"chinese\", \"china\", \"hk\"],\n    \"zh-TW\": [\"zh-tw\", \"zhtw\", \"cht\", \"traditionalchinese\", \"tw\", \"taiwan\"],\n    \"ru\": [\"ru\", \"rus\", \"russian\", \"russia\"],\n    \"tr\": [\"tr\", \"tur\", \"turkish\", \"turkey\"],\n    \"ar\": [\"ar\", \"ara\", \"arabic\"],\n    \"hi\": [\"hi\", \"hin\", \"hindi\", \"in\", \"india\"],\n    \"pl\": [\"pl\", \"pol\", \"polish\", \"poland\"],\n    \"nl\": [\"nl\", \"dut\", \"dutch\", \"netherlands\"],\n    \"fi\": [\"fi\", \"fin\", \"finnish\", \"finland\"],\n    \"sv\": [\"sv\", \"swe\", \"swedish\", \"sweden\", \"se\"],\n    \"da\": [\"da\", \"dan\", \"danish\", \"denmark\", \"dk\"],\n    \"ms\": [\"ms\", \"may\", \"malay\", \"malaysia\"],\n    \"ro\": [\"ro\", \"ron\", \"romanian\", \"romania\"],\n    \"bn\": [\"bn\", \"ben\", \"bengali\", \"bd\", \"bangladesh\"],\n    \"fil\": [\"fil\", \"tl\", \"tgl\", \"tagalog\", \"filipino\", \"ph\", \"philippines\"],\n    \"hu\": [\"hu\", \"hun\", \"hungarian\", \"hungary\"]\n  },\n  \"names_zh\": {\n    \"en\": \"英语\", \"pt\": \"葡萄牙语\", \"es\": \"西班牙语\", \"ja\": \"日语\",\n    \"de\": \"德语\", \"fr\": \"法语\", \"it\": \"意大利语\", \"id\": \"印度尼西亚语\",\n    \"th\": \"泰语\", \"vi\": \"越南语\", \"ko\": \"韩语\", \"zh\": \"中文\",\n    \"zh-TW\": \"繁体中文\", \"ru\": \"俄语\", \"tr\": \"土耳其语\", \"ar\": \"阿拉伯语\",\n    \"hi\": \"印地语\", \"pl\": \"波兰语\", \"nl\": \"荷兰语\", \"fi\": \"芬兰语\",\n    \"sv\": \"瑞典语\", \"da\": \"丹麦语\", \"ms\": \"马来语\", \"ro\": \"罗马尼亚语\",\n    \"bn\": \"孟加拉语\", \"fil\": \"菲律宾语\", \"hu\": \"匈牙利语\"\n  }\n}\n","lines":41,"sha256":"c2018239246f5c5f7d235ded93f77f05b8d2e02352a766c6deef564e7d7d3027"},{"path":"config/local-models.json","text":"{\n  \"schema_version\": 1,\n  \"models\": [\n    {\n      \"id\": \"uvr-inst-hq3\",\n      \"path\": \".runtime/models/separation/UVR-MDX-NET-Inst_HQ_3.onnx\",\n      \"url\": \"https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/UVR-MDX-NET-Inst_HQ_3.onnx\",\n      \"sha256\": \"c207b845d51dc1303c543503f6f5a8b596da5d7de97bead77b3e16ec38e8d5b3\",\n      \"source\": \"https://k2-fsa.github.io/sherpa/onnx/source-separation/models.html\"\n    }\n  ]\n}\n","lines":12,"sha256":"e725b25c9da68deb89efdfaad9ce3307408ef0510fc6821362b22ee48533364f"},{"path":"config/mcp.json","text":"{\n  \"schema_version\": 1,\n  \"description\": \"Capability contracts, not a live connection-state cache. Host connectors and permissions must be inspected at use.\",\n  \"groups\": {\n    \"local_execution\": {\n      \"transport\": \"stdio\",\n      \"command\": \".venv/Scripts/python.exe\",\n      \"args\": [\n        \"bin/mcp_server.py\"\n      ],\n      \"host_installation\": \"Resolve the installed project Python and register the stdio entry on the target host; verify initialize/tools/list live.\"\n    },\n    \"video_models\": {\n      \"provider\": \"kie\",\n      \"credential_env\": \"KIE_API_KEY\",\n      \"transport\": \"https\",\n      \"adapter\": \"src/video_localizer/kie.py\"\n    },\n    \"material_source\": {\n      \"provider\": \"fireplay\",\n      \"page\": \"https://fireplay.ai/materials/market\",\n      \"status\": \"host_connector_capabilities_must_be_checked_at_use\",\n      \"required_capabilities\": [\n        \"search_materials\",\n        \"get_material\",\n        \"get_download_url\"\n      ],\n      \"available_logging_mcp_is_material_reader\": false,\n      \"fallback\": \"Import an actual downloaded file or an observed HTTPS video URL through va init/ingest\"\n    }\n  }\n}\n","lines":32,"sha256":"88b92d6d7bc7a93e2091c7ad664b20422bee3d75632d2f53cfd7d9abefcc54fb"},{"path":"config/model-policy.json","text":"{\n  \"schema_version\": 1,\n  \"source\": \"User feedback on 2026-10-19: avoid expensive models; Seedance 2.0 and above billed per second are too expensive.\",\n  \"block_seedance_major_at_least\": 2,\n  \"max_new_video_task_estimated_credits\": null,\n  \"cap_origin\": \"2026-10-26 direct user instruction: 60 credits per distinct target language; aggregate shared request pool. Historical ledgers and unknown reservations retained. Researching alternatives does not authorize changing current model routing.\",\n  \"preferred_video_trials\": [\n    \"wan/2-7-videoedit\"\n  ],\n  \"note\": \"This blocks new submissions only. Poll, download and review already submitted tasks without recreating them. Credit estimates are reservations, not provider billing guarantees.\"\n}\n","lines":11,"sha256":"40e6425ecdedbdc36d3b6ccbd74a52ddef62629f42806a0f0fb93e6b9362f863"},{"path":"config/ocr.example.json","text":"{\n  \"enabled\": false,\n  \"retired\": true,\n  \"replacement\": \"codex-packet RUN --stage recognize\",\n  \"note\": \"Legacy OCR configuration is ignored. Codex reads actual frames under project knowledge and quality constraints.\"\n}\n","lines":6,"sha256":"40a89eb5293136004e5c69c281f82c0eb3922838353e06b1e944ed8a18309f5b"},{"path":"config/quality.json","text":"{\n  \"version\": \"2026-10-23.3\",\n  \"authorization\": \"Project owner 2026-10-23: relax minor visual imperfections; preserve basic content, motion and audio quality. Historical results are not reapproved.\",\n  \"caption_sync\": {\n    \"max_start_error_seconds\": 0.2,\n    \"max_end_error_seconds\": 0.25,\n    \"max_visual_plan_error_seconds\": 0.034\n  },\n  \"minimum_score\": 80,\n  \"weights\": {\n    \"translation\": 0.3,\n    \"visual_fidelity\": 0.25,\n    \"temporal_alignment\": 0.2,\n    \"audio\": 0.15,\n    \"ad_style\": 0.1\n  },\n  \"critical_defects\": [\n    \"untranslated_required_instance\",\n    \"incorrect_claim_or_brand\",\n    \"premature_or_late_translation\",\n    \"unreadable_or_flickering_text\",\n    \"foreign_speech_remaining\",\n    \"caption_speech_copy_mismatch\",\n    \"caption_audio_out_of_sync\",\n    \"caption_sync_unverified\",\n    \"unintended_product_or_action_change\"\n  ]\n}\n","lines":28,"sha256":"9ca56ae48f0f2579d155852fd0e5f5f07eaf1206ccd6297bbf29cebc06ebb475"},{"path":"config/storage-policy.json","text":"{\n  \"schema_version\": 1,\n  \"mode\": \"preview_only\",\n  \"minimum_free_gib\": 5,\n  \"runs\": {\n    \"max_count\": 20,\n    \"max_gib\": 8\n  },\n  \"outputs\": {\n    \"max_count\": 100,\n    \"max_gib\": 20\n  },\n  \"media\": {\n    \"max_count\": 50,\n    \"max_gib\": 5\n  },\n  \"pinned_runs\": [],\n  \"pinned_sources\": [],\n  \"note\": \"Advisory limits, never automatic deletion. 0 disables that limit. Runs count per language task; outputs count indexed delivery/reuse packages; media counts source hashes. Knowledge, accounting and active work are protected. Review unindexed ZIPs and loose exports separately.\"\n}\n","lines":20,"sha256":"31c12724a49a72fe874242ffad755d5bc3cb341635d5200eb9526dfe21a10398"},{"path":"config/workspace.json","text":"{\n  \"schema_version\": 1,\n  \"default_workflow\": \"video-localization\",\n  \"default_profile\": \"company-default\",\n  \"default_delivery_mode\": \"fast\",\n  \"output_policy\": \"best_available_required\",\n  \"sampling_seconds\": 1.0,\n  \"max_segment_seconds\": 8.0,\n  \"max_paid_jobs_per_run\": 2,\n  \"request_budget_policy\": \"per_target_language\",\n  \"require_target_audio_for_speech\": true,\n  \"max_revision_rounds\": 2,\n  \"note\": \"New first/reuse request allowance is 60 credits per distinct normalized target language in config/budget-policy.json. The allowance is a flexible shared pool for all declared languages, shared preparation, models and retries. Historical ledgers retain their limits, spending and unknown reservations. Clips and duplicate aliases do not create allowance. Finite task slots follow original source segments/known roles and two repair rounds per unit.\"\n}\n","lines":14,"sha256":"6f0dcbee7cc432182ccc0bb4e9eabe9d71b4733e3081bbb288ca621b40dcf5f9"},{"path":"agent/contracts/audio.md","text":"# 音频本地化\n\n当前新任务模型以 [模型分工](model-routing.md) 和 `config/model-routing.json` 为准：音频理解仅 Gemini Flash、配音仅 Gemini TTS、视频仅 Wan 2.7。旧供应商与具体素材试验已归入 [维护历史](../../docs/history.md)，不构成新提交入口。\n\n\n用户确认的默认要求（2026-10-19）：每次保留原背景音乐与音效，翻译对白等语言内容。不因当前 AI 不能听音而删去声音或忽略这项要求；无音轨的源文件保持无声，另有明确授权时才补配乐。当前来源是本项目用户的直接要求，不是模型自评分推导的偏好。\n\n## 解析与选路\n\n多人对白/短剧先读 [固定角色声线](../../knowledge/rules/short-drama-character-voices-v2.md) 与 [声音事件及时间处理](../../knowledge/rules/short-drama-audio-scenes-v2.md)；单人口播读 [实际混音与分歧](../../knowledge/rules/method-spoken-caption-verification-v4.md)。源轮次和画面事件约束时间，静音处理→确认空隙→有限变速→精简定稿及同声线补录；每步以实际清晰度和完整发音决定，不能截句跨人。\n\n用户明确必需目标语音频时，音频不可用须直接报告，完整字幕不替代配音交付。身份疑点、漏句、临时供应商故障与真实能力边界分别处理，按角色方法记录降级范围；最少男女声并不免除同角色一致检查。\n\n`analyze` 保存音轨、信号强度、静音比例与时间窗口到 `analysis/audio-source.json`。音轨存在不等于有声，信号有声不等于已识别人声。来源没有音轨时明确记录；不能从字幕推断已经听到对白。\n\n`audio-analyze RUN --execute` 将真实 WAV 交给 KIE Gemini Flash，区分背景音乐、非语言音效和对白，保存带时间戳的转写与模型归因。调用有任务账本和预算；API 返回不明时保留状态，不能自动重复请求。它是外部模型的音频理解，报告不能写成 Codex 亲耳听过。\n\n- `preserve`：已有证据确认没有需翻译的人声，交付时从原视频重取完整音轨，保留音乐与音效；视频模型产生的声音不替换原混音。\n- `model`：由 Wan 2.7 原片编辑同时翻译对白，使用 `audio_setting: auto`，从模型原始结果提取音轨后拼接、混回成片。模型音轨缺失时阻止渲染，不回退到静音或原外语对白。该参数允许生成音频，不保证翻译或分轨保真，必须检查结果。\n- `replace`：导入已审完整译后混音，保留背景音乐和音效；配音、背景与音效的混合由音轨提供方负责，文件与计划绑定哈希。\n- `mute`：源片有音轨时须有明确静音授权，不是故障回退路线。\n\n人声用时间戳、原文、译文和证据记录。控制 AI 无法听音时，仍向模型发送保留音乐/音效、翻译对白、保持说话角色与时序的要求。可以将未知人声标为 pending，进行明确的模型试验；pending 不构成交付通过。实际音频转写/听审尚未完成时保留未验收状态。\n\n口播与对应字幕共用 `speech_segments[].target_text`；TTS 请求填写有序 `speech_ids`，执行器在付费提交前核对稿件。独立混音程序也核对每句定稿与覆盖。实际字幕时轴使用裁切/变速/偏移之后的完整混音，操作与成片同步门禁见 [agent/contracts/captions.md](captions.md)。\n\n## 执行与核验\n\n所有模型提示词都包含声音约定；`packet` 同时显示音频策略与供应商实际参数。仅写提示词不能替代音轨执行。视觉处理中间文件允许无声，最终 `render` 明确选择音轨并保存 `outputs/audio-selection-*.json`，包含原片、模型任务、选中音轨和哈希。\n\n模型返回音频若仅末尾短缺不足0.3秒，可补齐时间轴尾部以防后续片段整体提前，保留每段 `model-audio.json` 的实际短缺量；不改变音乐速度，也不声称补回了缺失的音乐/音效。明显短缺或实际可听断点仍须打回。\n\n`capture` 导出成片 WAV 与 `audio-report.json`。`quality` 重新测量实际视频：音轨有无、近静音、音频时长、严重削波、明显降音量；原音保留路线还比对波形、时移与掉音。保留项失败会打回，不能因总分高而放行。\n\n`audio-analyze RUN --candidate --execute` 将原音和实际成片音频一起送审，要求先原样转写成片，再检查原配乐/音效、译文完整性和同步，保存到该视频哈希对应的 `audio-model-review.json`。重新 `capture` 将报告纳入证据。已存在的音频模型报告若指出配乐改变、音效丢失、漏译、外语残留或不确定，机器门禁会拦截；不能用主控的高评分覆盖。\n\n这里的音频同步只涉及声音时间轴和衔接。该请求没有提供画面，不能证明字幕与口播一致；字幕另用 `caption-sync.json` 同时审声音和画面。粗粒度 ASR 的一句时间范围也不能直接当作逐词字幕对齐。\n\n译后或模型音轨另需 `review.audio_checks` 对音乐、音效、对白翻译和同步逐项给出方法、成片音频证据与结论。对白未知/未核对、外语残留、音乐或音效丢失均不能通过。ASR/听审负责语义，波形检测只证明信号与保留关系；配音不等于口型已对齐。\n\n## 独立配音与转写\n\n`tts-packet` 从已定稿的有序 `speech_ids` 准备请求；`model-task` 预览后才按已有授权提交。配音、音频理解和视频任务共享请求预算；远端状态未知时先恢复原任务。原始响应与计费回执先保存，再解析业务内容。\n\n`bin/asr.py RUN` 转写实际音轨，`--audio` 可检查指定运行音轨；记录语种、分句、模型和音频哈希，不将预期译稿当作已听到的内容。ASR 可以辅助核对对白覆盖，发音、音乐音色、音效和口型仍需实际审核。\n\n配音裁切、变速、偏移和回混记录在实际产物的 provenance 中。字幕按最终混音重新对齐；不同模型产生的时长、分轨延迟和旧素材参数不能直接沿用。\n\n## 全部语言内容与长音轨\n\n音频主导、画面文案主导和混合型都翻译可辨对白、旁白/解说、独白及片尾口播；语音职责用 speech_role 记录，音乐/非语言音效默认保留。画面人数不等于说话人数，预设名称不证明音色/性别。视觉任务仅修画面时，声音交给独立链路，目标语言从请求读取。\n\n技术测量完整解码单声道16kHz音轨，报告 measurement_scope=complete_decoded_audio；所有半秒窗口、时长、削波/掉音和保留波形比较覆盖全音轨，不再停在181秒。解码失败/超时须报告，不能给部分测量填全片通过。语义、旁白/对白完整度、音色和字幕同步仍需真实审核，完整波形不是完整翻译证明。旧源解析版本不自动复用其可能截短的测量；旧费用与质量结论保持历史。\n","lines":53,"sha256":"47476096a2f45a6f1ec0ad786ae59701d7795bd778b6511d33fe064842e2875a"},{"path":"agent/contracts/captions.md","text":"# 口播与字幕同步\n\n来源：用户于2026-10-19指出当前中日样片音频与字幕不统一，并要求加入 Agent 项目。典型失败是口播“手势翻转棱镜特效怎么做……跟我一起学”，字幕另译为“如何制作……跟我学”；配音约4.1秒结束，字幕仍沿英文节奏显示到5.6秒。先锁定共同译稿，再按实际译后声音排字幕。\n\n## 定稿与分类\n\n有人声的清单中，每条文字填写 `text_role`：\n\n- `speech_caption`：对应口播的字幕，填写 `speech_id`。\n- `scene_text`：标题、按钮、UI、商品标语，保持画面含义与布局，不强行复述口播。\n- `preserve`：品牌等明确保留项，配合 `action: preserve`。\n\n`speech_segments[].target_text` 是最终说出的唯一稿件。每句设置 `caption_policy: verbatim` 和有序 `caption_ids`，这些字幕拼起来须等于该句；只容许句末标点/空白差异，数字、单位、顺序、用词须一致。若原片确实没有对应字幕，设 `caption_policy: none`、空 `caption_ids` 并填写 `caption_reason`，成片仍审查分类是否完整。把字幕误标为标题会造成遗漏，Agent 应对照原片逐实例判断。\n\nTTS 的 `model-task` 请求填写有序 `speech_ids`，其文本来自上述定稿。`bin/mix_localized_narration.py` 在混音前检查同一稿件及完整人声覆盖。改变译稿应同时重建配音、字幕和评审。\n\n## 实际音频对齐\n\n独立配音路线使用已经裁切、变速、偏移并回混的完整音轨，以成片时间轴的秒数表示字词或短语。可用强制对齐工具、经核对的 ASR 或实际听审取得时间；保留提供者、方法和审核人。均匀按字数分配、套用源英文时间、从粗 ASR 句长猜逐词时间，都不能算已对齐。\n\nAgent 参照 `agent/templates/caption-alignment-example.json` 填写 `analysis/caption-alignment.json`。`audio.path` 指向清单中选用的完整 `replacement_path`；音轨/原片/语种绑定哈希。每个 `units` 元素是一段实际听到的字词或短语，全文拼接须与定稿相同，并在字幕实例的分界处分开。\n\n```powershell\n# 先预览，再应用；均为本地操作，不提交模型任务\n.\\bin\\va.ps1 captions RUN --alignment analysis/caption-alignment.json\n.\\bin\\va.ps1 captions RUN --alignment analysis/caption-alignment.json --apply\n.\\bin\\va.ps1 plan RUN\n.\\bin\\va.ps1 render RUN\n```\n\n命令生成 `display.timed_fragments`，本地排版器按该片段显示整词或短语。原文擦除范围另存 `source_interval`，避免中文提前结束后原英文重新露出。模型去字底片覆盖完整原字及进出场；透明艺术字层需重建，且包含新的片段时间绑定。只修改 JSON 不会自动重绘已有 alpha 视频。\n\n对齐数据和混音都进入 `caption_assets`；文件变化使计划失效。换语种、换译文或换音轨，应重做相应对齐；无字底片和原音乐/音效仍按既有资产合同复用。此命令不自动运行强制对齐引擎；没有实际时间证据时保留 pending。\n\n直接由视频模型同时生成口播和字幕时，可以先用定稿和暂定源区间建立实验计划，随后从实际成片取得时间证据。若返工为本地排版，先使用已审完整混音和上述对齐合同，不能把暂定区间当成已核验结果。\n\n## 成片核验与打回\n\n`capture` 在实际视频哈希目录导出 WAV，并对每个字幕片段的进场前、进场、中间、结束前和结束处抽帧，创建待填写的 `caption-sync.json`。根据真实音频与画面填写：\n\n- 顶层 `reviewer`、`method`、`decision`、成片音频和画面 `evidence`。\n- 每实例的 `audio_units`：实际说出的内容和起止时间。\n- 每实例的 `visual_units`：实际显示的内容和起止时间。\n- 每实例的方法、结论和对应 `caption-tNNN-…` 边界帧与 WAV 证据。\n\n`planned_units` 仅是计划，不是实际观测。必要时加密逐帧检查、使用视听模型或实际播放，不能因为模板给出时间就填 pass。没有听音或识字证据时保持 pending；同一 Agent 自审要如实署名。\n\n完成审查后重新 `capture`，把修改后的报告纳入哈希清单，再运行：\n\n```powershell\n.\\bin\\va.ps1 caption-check RUN\n.\\bin\\va.ps1 quality RUN\n```\n\n`caption-check` 只读检查，方便诊断旧候选；`quality` 同时检查字幕门禁、声音保留和其余画面要求。同步报告绑定实际视频、源片、清单、计划、字幕轨和成片 WAV。逐片段比较内容及实际视听时间，并与计划时间比较；阈值集中在 `config/quality.json`。音乐/音效保留、对白译文质量、字幕同步和口型同步是分别核验的事项。\n\n脚本负责一致性、覆盖与证据绑定，实际声音和像素内容仍依赖有署名的审查。合成回归只能证明执行和拦截行为，不能代替真实广告视听验收。\n\n## 历史迁移\n\n质量配置2026-10-19.2开始启用本门禁。旧视频、账单和旧评审保留，重用旧视频前需补分类、共同稿件、对齐及新评审；不能把旧音频报告的 sync 字段补写成字幕通过。质量配置升级会让旧计划提示“标准已变化”，由 Agent 新建后续运行/明确有界迁移，不消耗旧任务的剩余返工次数来伪造新通过。\n","lines":61,"sha256":"2b321a981d92ad282c155040ef0c6b81e6a76976467f60f0a3ef068e25b7b0c3"},{"path":"agent/contracts/knowledge.md","text":"# 知识、案例与交付素材\n\n## 三种生命周期\n\n- `knowledge/rules/`、`knowledge/examples/` 和 `knowledge/candidates/` 保存项目开发所得的方法、训练案例和未启用经验，可进入Git。源/语种限定是适用范围，不等于个人私有；通用技术经验与素材限定经验都应按原scope保存，不因搬目录扩大结论。\n- `knowledge/local/` 留存私有客户数据、原始证据和个人偏好；不把所有技术学习都归到local。项目案例用经过整理的实际观察、哈希、必要对照与原文方法；manifest中的文件就是完整依赖，旧路径仅为历史来源标签。正文及公开案例不依赖local、run或交付素材，私有原始证据另行独立留档。\n- `outputs/<源>/<语种>/<版本>/` 是可到期的交付/复用包，`runs/` 为工作过程。交付包包含源片、实际成品、语言资产、准备依赖和原有技术状态，可以离开原run恢复。删除交付包会丢失视频与素材，知识仍独立存在。\n\n项目知识可版本管理；原始私有案例、outputs、runs、本地索引和密钥留在本地。私有迁移原文/旧索引存 `knowledge/local/history/`；公开的已替代正文集中在 `knowledge/history/`，两套正式索引保留替代关系。历史失败评审保持原决定，当前正文只有一份。目录导航见 `knowledge/README.md`。\n\n## 记录、提纯、启用\n\n`deliver` 自动生成交付包、候选案例和持久inbox；已有候选及实际评审的失败结案使用 `reflect`。尚未形成候选时，按 `agent/templates/preproduction-failure.json` 用 `close-failure RUN SPEC` 保存有证据的失败观察，不补造质量报告。技术复盘另存项目candidate，原始媒体证据留私有案例；个人/客户保密复盘在review标注knowledge_class后保持私有。重复收尾不重复生成候选、不重发付费任务。自动记录不是自动证明新结论，也不代表已配置后台定时服务。\n\n每次结案保存简短结果；有新原因、有效修正、反例、成本改善或用户纠正时提纯。相同含义且范围一致的知识合并证据，保留来源、反例与版本；同一素材多次返工不算多个独立复验。正文不得引用可删除的run/output/work文件作为使用前提；资产可用性由交付库单独查询。\n\n`reflect` 只产生candidate，不被正式检索加载。候选包含真实结果、假设、失败签名、有效范围、限制与下一次反证。新反馈生成新记录，不把整体认可改写为分轨无损、独立评审或所有细节通过。\n\n候选可以通过独立的 `knowledge_advisories` 通道按需参考：`context`、`codex-packet`、`work-packet` 与新 `plan` 最多返回3条，按同源/语种或显式内容特征匹配；源和语种约束不放宽。候选不是正式方法，只能提出风险、试验或补证方向，不覆盖当前规则、不放行质量、不授权模型或费用。原始stage仍是历史适用条件，不能因出现在其他阶段的工作包就扩大范围。使用前读取原文和限制；计划保存召回内容与原文哈希。没有匹配、已结清或不具备明确匹配条件时不填充无关条目。\n\n## 从提纯到采纳，再回到制作\n\n1. `hooks` 提纯新增来源，建议合并目标、限定案例、新方法或缺证据项；这些建议保持candidate。`knowledge-queue` 汇总原始候选、当前提纯版本和使用反馈，显示历史采纳表、当前审查与具体下一步。不要为已处理来源换个标题再次生成候选。\n2. 主控按 `agent/templates/knowledge-review.json` 审查。`knowledge-review SPEC` 记录原文哈希、审查者、来源、采纳部分、保留部分、目标版本和下一步。`adopted/partial/duplicate` 必须指向已启用且哈希匹配的方法/案例；新方法或修订先走 `knowledge-promote`，可用 `candidate_sources` 绑定候选来源，再登记采纳。公司偏好和质量标准变化仍遵守原有授权范围。\n3. 方法的使用效果用 `agent/templates/knowledge-use.json` 记录，执行 `knowledge-use RUN SPEC`（SPEC相对run）。只能绑定冻结计划中实际选中的正式知识、同源参考或候选，分别报告 `helpful/ineffective/counterexample/not_used`。实际使用需要真实证据；未使用需要解释，不能从检索命中推断使用或成功。当前计划、输入和视频哈希必须匹配，证据复制到独立本地反馈包。\n4. `reflect` 与 `work-packet` 的 `knowledge_followup` 列出尚未记录使用状态的条目。结案时主控补齐反馈，随后处理 `knowledge-queue`；知识收尾不替代或伪造视频验收。负面反馈在同源同语种检索原方法版本时以 `review_alerts` 返回，并进入修订队列。它不是直接改写规则；审查后发布带 `supersedes` 的新版本或说明无需修改，再关闭反馈。\n\n全部为 `not_used` 的回执只记账，退出未反馈清单；不作为新经验进入召回、提纯或待审队列。部分实际使用的报告保留整体来源，按实际结果审查。\n5. 原记录不覆盖；审查修订通过 `previous_review` 链接上一份决定。采纳目标正文快照、来源和失败判断保留。每日Hook不自动发布方法，主控负责完成审查、发布与使用反馈；缺证据时保留明确待办。\n\n## 候选退出队列与归档\n\nMCP 对应入口为 `localizer_knowledge_advisories`、`localizer_knowledge_queue`、`localizer_knowledge_use`；正式方法仍走 `localizer_knowledge`。审查发布与归档使用以下 CLI，并按模板填写来源。\n\n推广只是一个处理出口。重复内容可关联既有方法，只有合成意义的实验可结为历史，反例可以修订旧方法，证据不足则继续待审。`partial` 和 `pending` 不能归档；其余决定也必须明确全部内容已处理、剩余部分仅作历史，才能关闭。`adopted` 并不表示剩余限制获得推广。\n\n```powershell\nbin/va.ps1 knowledge-queue\nbin/va.ps1 knowledge-review work/actual-review.json\nbin/va.ps1 candidate-archive knowledge/candidates/actual-candidate.json\nbin/va.ps1 candidate-archive knowledge/candidates/actual-candidate.json --execute --expect <预览指纹>\n```\n\n归档将原文件逐字节保存到 `knowledge/history/candidates/<哈希>/`，核验后从 `candidates/` 移除。映射保存在 `knowledge/curation/candidate-archives.json`；旧采纳表中的逻辑路径通过 `knowledge_records.resolve()` 继续解析，候选索引的 `storage_path` 指向实际原文。关闭的来源不再进入默认候选召回或每日提纯；`knowledge-queue --include-closed` 仍可追溯。已被部分采纳的文件不能仅凭采纳表批量删除。\n\n知识分为初始方法、源限定参考和条件类方法。类方法按topic和内容特征检索：requires_features须全部满足，非空requires_any_features须至少满足一项，两组同时存在时共同成立。多源观察须绑定至少两个独立源的长期证据，不将同源返工计作跨源复验。类方法提供触发条件、步骤、失败签名和核验标准；示例的遮罩、坐标、字体参数及验收不推广。单源细节保留候选。\n\n候选仍标candidate不代表全部内容未使用。人工审查的部分采纳关系记在knowledge/curation/，包含候选原文哈希、合并目标与未推广部分；它用于追溯，不直接加载进制作提示。候选文件或证据发生变化时须重新审查，不能仅因同名记录在旧采纳表中就跳过。\n\n`knowledge/index.json`只索引与具体视频无关的方法及项目政策；`knowledge/cases/index.json`单独索引源限定参考。context分别返回knowledge和source_references，plan分别冻结；方法的适用条件不以案例视频哈希限定。一个方法可关联多个案例，案例只证明已有观察，不绑定方法只能在原视频使用。rules 不重复保存源参考；现行参考正文以 cases 索引为准，已替代正文位于 history。案例中的原文快照仍按 manifest 保留，不作为另一份现行规则维护。\n\n启用采用有来源的用户明确反馈或开发者评审，经 `knowledge-promote SPEC` 建立独立正文和案例。记录 reviewed_by/at、来源、源哈希、目标语种、实际视频哈希和原话；通过 `knowledge-audit`。公司偏好/质量标准需要对应授权，自动总结不会修改它们。跨源、跨语种结论须有对应复验证据。\n\n## 检索与保留门禁\n\n选择的统一入口为 [Agent 方法选择](../../knowledge/rules/agent-method-selection-v2.md)。delivery_modes 限定 fast/strict，未声明的历史方法适用两种模式；具体检查强度依现行模式政策。requires_features 全部满足且 requires_any_features 至少一项（非空时）才适用；命中不表示必须调用模型。\n\n语言 scope 默认 language_match=exact，完整标签不区分大小写匹配；只有审查发布的 base 条目才匹配同基础语言，scope 必须写基础标签。原案例不批量扩域。related_source_references 只发现同源同基础语言的其他标签案例，requires_language_review=true，不能当作已批准同语种参考或进入计划。地区、文字系统、发音与成片须重新审核。\n\n`context`/`plan` 完整返回适用的 project_policy 和 retrieval_role=required 方法，另外最多取6条可选方法；所有条目先满足 active、时效、替代关系、scope、特征和模式条件。政策及必要方法不与可选方法竞争名额。输入阶段政策仍须匹配phase。内容同义特征通过config/content-features.json归一化；未知特征保留，不根据镜头运动臆测文字运动。读取正文及独立案例，正文或证据缺失/篡改时报错，不能静默丢知识。计划记录命中正文哈希。替代用superseded_by，接口/模型/语言变化时标记待复验或有效期。初始两条是开发者规则，未假装经过真实广告实验。\n\n新启用方法的evidence引用必须通过 `evidence_references` 解析到案例内部文件。已有案例可用 `knowledge-evidence SPEC` 追加不可变证据包，索引的required_evidence声明必要标签；缺失、篡改、跨源或错视频阻断审计与检索。补证不改写原方法、历史评审或用户验收。旧成片来源标签仍由交付库查询，不能当作永久视频文件。\n\n后续反例能够推翻旧案例的整片成功解释。原观察保留，追加独立反例与evidence_caveat，让检索同时呈现限制；局部镜像文字或声音边界的证据不能扩张成整片视觉成功。实际资产的使用资格另由有来源的quality-hold约束，不能只写知识候选而继续复用已否定底片，见 `agent/workflows/quality-feedback.md`。\n\n清理runs或outputs前验证知识独立性、交付包内部依赖和未结算账本。验证以离开原目录仍可读/可恢复为准，路径指针和哈希本身不能恢复已删文件。归档到期后同源资产显示expired；再次使用需重新制作或恢复冷存储并验证。\n\n直接查阅历史规则时，先核对索引状态；`superseded` 或带 `superseded_by` 的正文仅用于追溯，沿替代关系读取当前规则。预算现行入口为 [请求总预算](../../knowledge/rules/user-language-budget-60-20261026.md)，历史额度和旧plan中的知识快照不构成新调用授权。\n\n具体操作入口为 `.agents/skills/knowledge-curation/SKILL.md`；目录说明见 `agent/contracts/storage.md`。\n\n## 必要方法和快速选择记录\n\nretrieval_role=required 表示满足既有 scope/特征/模式后必须返回该指导，和政策一起不占额外六条可选方法名额；不表示必须执行对应算法。metadata 的 selection_review 绑定本次开发者审阅及哈希。历史/范围外方法仍不返回；首次未声明 retrieval_role 时为 optional，普通修订省略时继承上一版的必要角色及审阅来源，显式调整仍须正式审阅。\n\n新请求按 content-led-localization-v1 记录三类信息载体及逐域方法选择。context.feature_origins 标识可从角色/文字清单直接得出的特征；Agent 不从这些事实臆测剧情、性别或未知人物。普通与新快速计划冻结实际分类、理由、知识与同源参考/候选版本，快速分支同样支持 knowledge_followup 和 knowledge-use。源解析快照不保存目标语言选择，换语言重新判断。\n","lines":76,"sha256":"903621eecf1ed6b2ebf8f8a7686826a7949b9fd3ebee1125494a2aa881334959"},{"path":"agent/contracts/quality.md","text":"# 成品质量\n\n唯一综合分数配置：`config/quality.json`；快速视觉容差在 `config/fast-delivery.json`。2026-10-23 项目用户授权降低轻微视觉瑕疵的严格度，综合门槛由85调整为80；这是项目用户授权，不代表另有公司验收。历史失败与通过记录保持原结论。\n\n质量门禁用于重试与“质量通过”标签；用户同时要求[最终必须输出](../workflows/always-output.md)。未达分数时保留 revise，在有界返工后用 finalize 交付带瑕疵的完整翻译视频，不把分数不足作为不输出视频的理由。\n\n模式分支的统一入口为 [文字与运动检查](../../knowledge/rules/neutral-visual-and-animation-gate-v4.md)：fast 用基本审核及风险区证据；strict 增加完整逐实例连续帧审计。共同内容、音频和字幕要求均保留。\n\n## 默认实用视觉标准\n\n按[底面与运动难度](../../knowledge/rules/content-aware-text-restoration-v2.md)逐实例选择自然修复或局部模糊兜底：简单背景自然重建，复杂运动/遮挡评估Wan连续局部编辑；不为省额度默认模糊，兜底须有候选或主体风险证据。路线允许不等于质量通过，仍按下列正常播放标准评分；不合格时沿用有瑕疵输出流程，历史结论不变。\n\n先以正常速度、完整构图判断观看影响，再用原尺寸局部定位。轻微纹理变软、颗粒差异、很小的接缝或字体装饰差异，只要正常播放不显眼、不影响主体/信息/动作，可记录为 minor 后通过，停止为逐像素一致返工。只有暂停放大才易发现的差异，不单独构成失败。\n\n- 5分：自然，未发现明显修复痕迹。\n- 4分：局部轻微差异，正常观看基本不受影响。\n- 3分：少量修复痕迹，正常播放不分散注意，信息、主体和运动完整；默认可接受。\n- 2分：正常播放明显干扰，例如突兀补丁、持续闪烁或接缝；需要修复。\n- 0–1分：严重失真、关键对象损坏或不可用。\n\n快速审核保留八项基本检查，另在 `visual_finish` 写0–5分、正常播放观察、实际证据及瑕疵时间/严重度；视觉至少3分，major/critical阻断。minor只用于外观差异，不能覆盖基本检查失败。证据不足保持未审。严格保真另行选择，继续完整逐实例门禁；修改标准不自动把旧候选改为通过。\n\n硬性缺陷：必译内容残留、应去发布者水印或匹配片尾商标遗漏、产品/品牌/报价含义错误、译文提前或延后、不可读/闪烁、外语人声残留、非目标内容明显变化。水印首末及片尾同标均查实际成片；硬性缺陷不能被总体美观分或minor标签抵消，边界后完整输出仍披露残留。\n\n`quality` 机器检查成片尺寸、时长、音轨与实际信号、源/请求/清单/计划/视频绑定、评审覆盖及分数。声音约定、波形核验与译后音频逐项审查见 `agent/contracts/audio.md`。语义和风格由有署名的评审判断；脚本不能证明评语真实。评审必须使用实际成片证据，标明同一 Agent 自审或独立评审。\n\n口播字幕使用 [agent/contracts/captions.md](captions.md) 的独立门禁：共同定稿、逐片段内容、实际音频/画面时间和证据绑定都须通过。缺少分类或实际视听审查、漏词、时间偏差超标、配音或字幕变更后复用旧报告均会打回，不能由高分抵消。场景标题、按钮不要求逐字复述口播。\n\n`config/quality.json` 的 `caption_sync` 给出当前开发阈值：起点最大偏差0.20秒、终点0.25秒，画面相对计划最大偏差0.034秒（当前30fps约一帧）。这是可调整的工程默认值，尚未通过遮蔽测试确定公司标准；更明显的节奏或语义问题仍由评审打回。\n\n评分0–5分：翻译30%、画面保持25%、时序20%、音频15%、广告风格10%；默认总分80以上且无硬性缺陷。无口播时音频维度评保留是否正确，不能声称验证了配音能力。\n\n验收每个文本实例：内容正确、原字已清除、区域对齐、出现/消失正确、持续可读；保留项验证保留理由。用户明确要求翻译的产品标题不能沿用默认品牌保留例外。类似 `Family Time` 的主标题和图标内标题要分别记录。每个人声片段核对意思、语种、时长、响度与衔接。\n\n严格模式涉及文字替换时，执行 [逐实例去字与呈现审查](../../knowledge/rules/neutral-visual-and-animation-gate-v4.md)。`visual-evidence`生成原尺寸对照和pending模板；按实例提交实际观察后，底片、代表语言和最终交付分别核验。`quality`必须通过`text-visual-audit.json`及其逐实例观察的版本、覆盖和证据校验；缺项、fail/pending、动态帧缺失或整组重复套话不能由总分抵消。生成证据不自动填写pass。操作见[视觉门禁](../workflows/visual-review.md)。程序核验证据合同，视觉判断仍由真实审查负责。\n\n固定排版通过实际字体字形测量，`protected_regions` 不得被覆盖。动态文字按实际轨迹和转角排版，区域合成只限制模型影响范围，不保证遮罩内的去字和背景正确；OCR 每0.1秒采样仍可能漏一帧，须补查首次/末次出现。所有本地修复有版本、输入/输出哈希和独立操作记录，不覆盖旧视频和旧评审。\n\n背景音乐不是口播，配音不等于口型同步。外部音频理解、本地 OCR/ASR、分轨和 TTS 已有真实试验；识别候选不等于完整清单，分轨不等于无损分离。口型与复杂去字仍未稳定通过。更贵模型的成功回执不能覆盖残留英文、局部糊化或未核实音效。\n\n用户纠正或复现推翻旧通过后，追加绑定实际成片/底片的quality-hold，保留原评审作为历史。当前交付和复用资格由原质量记录与后续异议共同决定，不能只读旧pass。操作及迁移边界见 `agent/workflows/quality-feedback.md`。原尺寸局部和连续运动检查须支持判断，缩略拼图不可单独证明背景干净或运动保真。\n","lines":41,"sha256":"0f86949aa940dc9a13f4f7a15e6b92454d69a3b48d38e7029023d4d52603ad07"},{"path":"agent/contracts/validation.md","text":"# 遮蔽测试\n\n1. 用相同源片、目标语言、规格和预算制作可比候选。保留失败和成本；不同路线的动作重建不能只比较画面好看。\n2. `blind freeze RUN candidate1.mp4 candidate2.mp4` 随机映射 A/B，去除容器元数据，冻结文件清单与哈希；来源映射放 reveal，不给评审上下文。\n3. 新评审上下文只读 blind/package、源片和同一评分标准。填写 blind/review.json；检查字面内容、时序和广告含义，并写理由。可见水印、品牌或画风可能泄露来源，须记限制。\n4. `blind verify RUN` 验证包未变；`blind reveal RUN` 仅在全部候选已评分且指定胜者或平局后揭示。\n5. 揭示只产生比较证据，不自动升格为公司偏好。偏好确认仍按 knowledge 规则执行。\n\n这是流程遮蔽，不是安全隔离：同一文件权限下的 Agent 技术上能读取 reveal。首次开发没有伪造独立盲评；真正实验应使用不含制作者过程与映射的新上下文或独立评审者。\n\n","lines":10,"sha256":"cdeb8890c2f4f04a0a1f9c1356486937f864a4d4158c6bf79f58c12424da9ab7"},{"path":"agent/contracts/workflow.md","text":"# 制作、检查、返工、交付\n\n当前用户授权的默认模式是[快速交付](../workflows/fast-delivery.md)。新请求记录 `delivery_mode=fast`，优先按该工作流完成基本效果、增量检查和轻量收尾；下文完整逐实例门禁仍用于严格路线。模式变更不改写旧候选的审核结果。\n\n所有任务同时遵守[最终输出](../workflows/always-output.md)：下文门禁决定质量通过和返工；返工结束仍用 `finalize` 输出当前最佳完整翻译视频，不能因分数未达标而无视频结案。旧 `close-failure` 保留失败证据，但不代替新任务的最终视频。\n\n续作和切换阶段时优先运行 `work-packet RUN [--stage source|translation|neutral|render|review|delivery]`，从现有状态取得待办、任务恢复提示与知识入口，不另写重复进度日志。它只导航，不替代知识正文、真实观察或审核。制作的缓存、资源限制和兼容入口见 [缓存与执行恢复](../../docs/workflow-optimization.md)。\n\n工作包中的 `knowledge_advisories` 是待验证观察，和正式 `knowledge` 分开。按需读其原文，用作风险提醒或试验依据，不能直接作为通过标准。结案时按 `knowledge_followup` 用 `knowledge-use` 记录实际采用、未采用及效果，再审查 `knowledge-queue` 中本次新增或受反例影响的内容，具体见 [知识合同](knowledge.md)。\n\n已有诊断预览、重复修复或正式候选尚未交付时，按 [制作收口](../workflows/production-completion.md) 处理：先完成 `next_action` 指出的当前缺口，复用已核验资产；当前候选待审则补实际审核，quality通过则直接deliver。水印／发布者标记默认去除，识别其文字/图形身份并检查片尾同标；用户本次明确要求保留的例外记录来源，旧评审不覆盖。\n\n## 1. 收件\n\n宿主/主控先按真实用户消息用 `budget-open SPEC` 登记一次请求：新请求总额为去重后的实际目标语言数×60 credits，budget-open 的 targets 必填并按语言别名规范化；首次与真实新复用请求同价。额度为各语言与共用底片的灵活共享池；新增语言须根据真实用户要求用 budget-amend 扩容，不能靠换批次自动增加。旧账本保持原额、费用与未知占位，主控按真实用户授权用 budget-amend 修订才生效。同一请求的所有语言、模型、短片、run、批次与返工共用账本；创建run不能重置额度。子任务不得编造新用户消息以开额度，派生短片用 `budget-bind RUN --parent-run PARENT` 继承。旧run在绑定总账本前不能新增付费调用。然后用 `batch-create ID VIDEO --targets ...` 编排语言，第一语言作为代表语言；复用批次加 `--reused`。先运行 `kie-authorization` 读取本项目拥有者授权：automatic_use=true时，现有预算、笔数、模型限制内必要的KIE调用不再逐对话询问。登记用户请求是主控内部操作，不增加用户确认步骤。它不强制模型路线，不替代质量审核或宿主独立审批。用法和信任边界见 `agent/workflows/batch-production.md`。\n\n保存原片、哈希、原始简述、目标 locale、品牌例外。长视频按实际原时长计额并分段处理，普通导入/解析不再受旧演示180秒硬限制；合成 demo 仍保留自身测试范围。用户只需给视频与目标语言，其余由 Agent 判断并记录；缺少会改变结果的品牌/语气约束时再澄清。\n\n目标语言先按 `knowledge/rules/language-aliases-v2.md` 解释；可调用 `language-resolve ja` 核对。用户给定的完整分组在 `config/language-aliases.json`，`init/ingest` 自动解析并保留原始输入。此为输入字典，不占制作方法检索名额；明确的地区、简繁和口音要求同时保留在任务简述中。\n\n## 2. 解析\n\n自动取得媒体信息、候选切点、最长8秒的候选片段、1秒抽帧、音轨。Agent 查阅有意义的画面、补查转场与文字边界，并分析声音。按实例记录文字与人声；用 `agent/templates/inventory-example.json` 对照字段。\n\n`analyze` 先查独立源解析库，源哈希与解析参数一致时恢复抽帧、源音轨、已绑定的源OCR/转写和源观察；已有inventory不覆盖。复用源观察后，译文、目标配音、目标时轴和审核状态重新建立。完成新源观察后用 `source-save RUN` 保存；`deliver` 自动更新快照。内容特征在inventory的 `content_features` 中记录，供条件方法检索使用。\n\n先按 [Agent 选路](../../knowledge/rules/agent-method-selection-v2.md) 判断政策、主方法和辅助检查；在现有 reason/evidence 说明适用条件、首选与备选、切换及停止依据。家庭/医院/校园等剧情背景不直接决定算法。特征定义及同义映射见 `config/content-features.json`，多人对白用 multi_character_dialogue（multi_speaker 同义），短剧用 short_drama；未知身份保留疑点。\n\n全片及片尾执行[水印识别与同标去除](../../knowledge/rules/publisher-watermark-removal-v2.md)。确认的发布者水印/商标用text_role=publisher_mark、统一publisher_identity及mark_form单列，target_text为空表示去除不补字；publisher_mark_review保留片尾matched/no_match与实际帧证据。静态水印也补publisher_watermark特征，不能仅移动水印才召回；产品品牌与发布者标记分别判断。格式见[水印清单示例](../templates/publisher-marks-example.json)。\n\n特征按观察填写：艺术字用 `artistic_typography`，拍摄手机界面用 `filmed_phone_ui`，前景遮挡用 `foreground_occlusion`，需要贴合表面的字层用 `surface_typography`。这些场景即使没有文字动画也可命中视觉方法；普通静态平面文字不必添加这些特征。\n\n所有任务先按 `agent/contracts/audio.md` 明确音乐、音效与对白分工；控制 AI 无法听音时仍向视频模型传递声音要求，证据不足保留 pending。\n\n有人声时读取 `agent/contracts/captions.md`：在实例清单区分口播字幕、场景标题/UI和保留项。`speech_segments[].target_text` 是口播和对应字幕的共同定稿；先确定稿件，再生成声音与动画。\n\n完成标准：visual/speech/timeline 均有方法与证据；实例有区域、区间、译文与动作；所有镜头有描述，完整覆盖源时间轴。自动抽帧不等于已自动 OCR/ASR。\n\n文字识别直接由 Codex 完成：运行 `codex-packet RUN --stage recognize`，读取工作包中的实际图片、规则、偏好与命中知识正文。查看原尺寸画面和边界帧，按实例记录文字、区域、时间与疑点；用 `codex-result` 绑定真实观察，再完善 inventory。`bin/ocr.py` 仅是该工作包的兼容入口，不运行 OCR 模型。图片编辑使用同一合同的 `--stage image`，由 Codex 使用宿主图像工具完成；具体方法由 Codex 按内容选择。见 [模型与图像工作合同](model-routing.md)。\n\n## 3. 判断与执行\n\n动态标题、CTA、关键词强调按[Remotion文字适配器](../../docs/remotion-typography.md)填写明确display.motion和绑定字体，重建计划后走现有render；简单文字沿用FFmpeg。快速流程可先用bin/render_typography.py生成已审底片上的文字，再把实际输出与typography_assets绑定进recipe。渲染失败回退静态字层，降级必须由真实成片审核确认；字体、内容和区域不合格不能借回退绕过。\n\n图片编辑由 Codex 主动选取实际原图与方法，先完成 `codex-packet --stage image` 的知识读取和真实编辑，再登记产物。静态及移动/旋转水印按 [去水印规范](../../knowledge/rules/publisher-watermark-removal-v2.md) 操作。先用 `repair-preflight RUN` 对照实际产品/姿态切点、文字模糊入场和完整画面边缘；本地配方执行与受控试验见 [修复配方](../workflows/repair-recipes.md)。原尺寸查看优先使用 `visual-pages --layer final --limit 2` 与返回的 `--after-frame` 续看，不另写查看脚本。展示游标只记录展示，不代表已审。\n\n匹配有效知识；生成可审查计划。图片工作由 Codex 完成，连续视频需要模型时统一使用 Wan 2.7；本地合成负责把已审图片/字层与原片结合。按模型实际限制合并/拆分片段，不把30秒直接塞进8秒接口。检查 payload、附件与成本估算后执行。\n\n独立配音先确定目标稿件，再用 `tts-packet` 准备 Gemini TTS 任务。旧本地声音只复用已存在且匹配定稿的结果。改稿、语速、说话人或模型会使对应声音失效。裁切、变速、偏移与回混完成后取得实际字词/短语时间，运行 `captions RUN --alignment analysis/caption-alignment.json --apply`。按生成的时间片段排字幕、重建透明字层，然后生成计划。模型直接编辑路线可先生成，但仍要通过实际成片的字幕同步审查。\n\n完成标准：每段有可定位输入与输出；付费任务有 taskId 或明确失败/未知状态。模糊网络失败保留账本，不能当作未提交自动重试。失败响应也消耗本地任务尝试名额。\n\n共享视觉准备先按当前模式实际检查无字短片（fast 基本检查，strict 完整逐实例门禁），再制作一个代表语言的完整编码样片，最后扩展批次。原字清除、背景纹理、前景运动、动画与关联图形分别检查；静止参考图不能代替原本会动的头发、手部或物体。参考帧不可跨照片切换、姿态或遮挡直接复用。缺少可验证的修复效果时保留未通过，低费用或“多数区域正常”不能替代视觉要求。\n\n严格路线开始文字替换前读取 [逐实例去字与呈现审查](../../knowledge/rules/neutral-visual-and-animation-gate-v4.md)。底片用`visual-evidence RUN --stage neutral --shot ID`生成pending证据，逐实例`visual-review`后`visual-release-neutral`放行并重建plan；成片用`visual-evidence RUN`（production自动执行），逐实例观察后重新capture/quality。动态区域检查连续原尺寸帧，各语言分别检查贴合与遮挡，不能批量填pass。具体操作见[视觉门禁](../workflows/visual-review.md)。\n\n同源、同时间区间、已通过且无质量异议的无字底片，可用 `reuse-neutral TARGET --from-run SOURCE --source-shot ID --target-shot ID` 复制素材和独立证据并绑定目标镜头。重新建立目标译稿、配音、字层与评审，再重建plan；此操作不重新编码底片，也不把源语言的成片通过状态复制过去。\n\n## 4. 检查与返工\n\n拼接后抽取成片证据，复制 review/template.json 填写 review/review.json。Agent 查逐实例翻译、漏字、原字残留、闪烁、时序、品牌与广告含义，实际听音或提供可核对音频证据。不能把未看的视频填为通过。\n\n有人声时完成该视频哈希目录的 `caption-sync.json`，同时引用成片 WAV 和字幕边界帧，记录实际说出和实际显示的时间。完成后重跑 `capture` 冻结证据，再执行 `quality`；音频单独送审的同步结论不能替代视听同步检查。\n\n概览拼图用于定位，不作为擦字验收的唯一证据。必须查看原尺寸问题区域、无字底片和透明字层，并核验实际编码的连续运动与首末边界。OCR为空、哈希正确、单张关键帧干净都不能证明去字成功或运动保真。制作门禁的签字和检查字段须来自真实观察。\n\n失败时先记录观测和待验证原因，再选一个变量：单实例、短片段、明确时间区域、更换路线。最多两轮；无法合格时按 always-output 输出当前最佳完整译片及瑕疵说明，明确尚未质量通过；用户必需配音且不可用时如实报告，不以字幕替代。\n\n## 5. 交付与学习\n\n正常质量通过路线通过 `quality` 后 `deliver`；有界返工后未通过的完整候选按 always-output 用 `finalize`，两者状态分开。正常路线得到 `outputs/` 中独立交付包的final.mp4与哈希证据，run内副本保留。交付函数自动归档并执行候选复盘，返回package/case/inbox；中途失败可重试收尾，不重发模型任务。有候选成片的失败结案运行 `reflect`；还没有候选的失败使用 `close-failure RUN SPEC`，记录实际观察、哈希绑定证据与未审范围，不伪造 candidate 或 quality。见 [本地配音与失败结案](../workflows/local-production.md)。\n\n单次或批量收尾后运行 `delivery-index` 刷新 `outputs/index.html`，按任务和语言直接打开正式包中的视频。默认不给 outputs 根目录增加便捷视频副本、批次视频文件夹或 ZIP；只有用户明确需要下载打包时才导出到用户指定位置。批次独有字幕和说明可放 `outputs/reports/<批次>/`，不存媒体副本。参考/待改进版本保留原状态，不因打包而称为已交付。目录入口是可重建视图，`index.json` 和各交付包 manifest 才是定位依据。\n\n知识提纯、用户反馈和素材保留按 `.agents/skills/knowledge-curation/SKILL.md`；方法和必要案例长期保存在knowledge，源片/底片/各语言成品保存在可到期的outputs，runs为执行过程。自动候选不改变正式知识或公司偏好。最终给用户视频、关键权衡、验证范围和待解问题。\n\n用户否定或复现推翻某版质量时，按 `agent/templates/quality-hold.json` 运行 `quality-hold SPEC`，将具体成片及确认有缺陷的共享底片分别绑定实际哈希，保存有来源的反馈证据。随后刷新delivery-index。原评审和交付包保留历史原文；当前目录与library-find显示质量异议和production_eligible=false，制作及deliver入口阻断被否定的字节。新修复版本用新哈希重新审核，音轨和译稿是否可复用分别判断。不要只把反馈记进候选而让旧成功标签继续指导制作。详见 `agent/workflows/quality-feedback.md`。\n\n\n每次运行开始与续作读取 `work-packet.maintenance`；外部交付及记录完成后执行 `maintain RUN --close`，检查删除/暂缓回执。临时缓存归属和自动整理见 [存储合同](storage.md)。\n\n## 信息载体与方法选择记录\n\n新请求记录 routing_contract_version=1。按 [三类广告条件](../../knowledge/rules/content-led-localization-v1.md) 判断 audio_led、onscreen_text_led 或 mixed；只发现音乐/非语言音效且无待译文字时可有据写 preserve_only。全片有主类型，实际需要时记录片段例外；不按字数、镜头人数或剧情地点自动归类。旁白、对白、独白及片尾口播全部进入人声清单，不受主类型影响。\n\n在 inventory.routing_assessment 填 version=1、primary_type、reason、真实 evidence，以及 method_choices：每个需要翻译的 speech/visual 域记录 domain、命中的 method_id、reason、alternative、switch_when、stop_when。程序在 plan/fast-register 前检查完整性及已适用方法，语义判断仍由 Agent 负责。每句 speech_role 区分 dialogue/narration/monologue/spoken_cta/unknown，character_id 未确认可写 unknown 并补证。\n\n已确认不同 character_id 自动补多人检索，待译文字补 onscreen_text；context.feature_origins 说明补齐依据。required 方法及政策完整返回，六条上限仅限制额外可选方法。快速模式同样冻结计划、知识正文、选择和待反馈项目；旧计划缺记录时提示重新登记现有资产，不伪造旧事实或重发模型。\n","lines":88,"sha256":"10810df252e1016d349679a9fd7ae542871e861d642573e9ae0b09596a889ab9"},{"path":"config/profiles/company-default/method.md","text":"# 公司默认方法（待确认）\n\n广告本地化先保留产品、卖点和节奏；目标文案自然简短，保留原语气。品牌名默认保留，确需本地化时记录用户指示。数值、价格、时长与优惠不得被“润色”成新主张。\n\n这份初始方法由开发者提出，未获历史偏好数据支持。后续给原片、项目候选与设计师版本时，先用统一标准做比较，再记录有权人员的选择及适用语种、品牌、广告类型。一次选择不推广为所有广告的通则。\n\n","lines":6,"sha256":"a68d47bd79f17b4ce556ceb0cb911f0e5d83016286a546c28d957a6e270eafc0"},{"path":"config/profiles/company-default/profile.json","text":"{\n  \"id\": \"company-default\",\n  \"version\": \"0.1\",\n  \"status\": \"provisional_developer_defaults\",\n  \"company_preferences_confirmed\": false,\n  \"method\": \"config/profiles/company-default/method.md\",\n  \"priorities\": [\"translation accuracy\", \"product and claim fidelity\", \"timing\", \"legibility\", \"ad rhythm\"],\n  \"preserve\": [\"brand names unless explicitly localized\", \"numbers and offer meaning\", \"product identity\", \"shot order\"],\n  \"preferred_style\": \"Natural concise target-language ad copy; preserve the source's tone\"\n}\n","lines":10,"sha256":"39c896b15884582a31d2a44446100999e5de4d31e251d4e2f73518d84fb4a776"},{"path":"docs/architecture.md","text":"# 架构与职责\n\n这个项目像一间制作工作室：Codex 看图识字、直接处理图片并决定怎么做，执行器操作媒体工具，运行目录保存现场，知识库保存以后还能用的经验。\n\n## 谁负责什么\n\n| 层 | 项目位置 | 责任 |\n| --- | --- | --- |\n| AI 主控入口 | `AGENTS.md`、`.agents/skills/` | 理解请求、翻译、选路、实际观察、判断返工 |\n| 执行合同 | `agent/contracts/` | 质量、声音、字幕、知识和证据的共同约束 |\n| 专项方法 | `agent/workflows/`、`knowledge/rules/` | 按内容条件选择步骤和检查方式 |\n| 偏好与参数 | `config/profiles/`、`config/` | 有来源的偏好、质量阈值、预算、模型策略 |\n| 调用入口 | `bin/`、`agent/integrations/` | CLI/MCP 适配及外部工具使用约定 |\n| 实现 | `src/video_localizer/` | 媒体计算、任务账本、缓存、审核门禁、归档 |\n| 独立知识 | `knowledge/` | 方法、同源参考、反例、证据和未启用候选 |\n| 本机资产与状态 | `.runtime/`、`runs/`、`media/`、`outputs/`、`state/`、`work/` | 安装资产、现场、复用素材、账务及临时工作 |\n\n目录按责任和生命周期划分，通常由同一个执行器读取，并不是每个目录各有一个 Agent。\n\n## 一次任务的循环\n\n```mermaid\nflowchart LR\n    U[视频与语言] --> A[AI 解析和定稿]\n    A --> P[计划与预算预览]\n    P --> E[本地工具或外部模型]\n    E --> V[实际成片与证据]\n    V --> R[AI 逐实例审查]\n    R -->|缺陷且仍可返工| A\n    R -->|quality 通过| D[独立交付包]\n    R -->|达到返工边界| F[当前最佳完整译片及缺陷记录]\n    D --> K[候选经验]\n    F --> K\n    K --> H[有来源的审查与启用]\n    H --> A\n```\n\n`workflow.py` 承担计划、制作与质量的主要合同；`production.py`、`batches.py`、`work_packet.py` 负责阶段导航、恢复和语言编排。媒体、排版、修复、声音和视觉采证是可复用模块。执行成功只说明产生了结果；语义、残字、运动、音色和同步由真实观察决定。\n\n## 实现边界\n\n| 责任 | 主要模块 | 边界 |\n| --- | --- | --- |\n| 制作计划与执行 | `workflow.py`、`fast_delivery.py`、`production.py` | 冻结输入、调度媒体能力、绑定成品与审核 |\n| Fireplay发现与接入 | `fireplay_monitor.py`、`fireplay.py` | 需求版本、聊天/预算、源文件和提交操作状态 |\n| 素材参数与归属校验 | `fireplay_materials.py` | 对已解析的数据检查共享组、标签、设计师、命名和实际归属；不读写账本、不执行外部调用 |\n| 平台发布与恢复 | `fireplay_publication.py`、`fireplay_youtube.py`、`fireplay_submission.py` | 发布可接受性、平台路由及持久提交进度分别处理 |\n| 知识闭环 | `learning.py`、`curation.py`、`knowledge_review.py`、`knowledge_usage.py` | 记录、提纯、审查、使用反馈分开，当前状态由索引和不可变审查链产生 |\n| 保全与维护 | `bundles.py`、`retention.py`、`maintenance.py` | 独立包核验、删除门禁、已登记临时缓存清理 |\n\nFireplay主模块保留原命令和锁定的提交状态机，素材规则集中在一个无I/O模块，避免归属写入与最终读回各维护一份判断。批次冻结后设计师身份/创作类型不能通过再次准备偷偷改变；相同身份的重复请求沿原操作和授权记录恢复。设计师DID命名和另有明确授权的用户ID写入是不同路线，均以实际平台读回为准，详见[提交流程](../agent/workflows/fireplay-intake.md)。\n\n调整架构优先抽出已有清晰职责，不批量移动正在执行的run或改写旧账本。文档导航、模板格式、知识结论和本机回执各留一处；方法论解释长期流程，历史数字进入[维护历史](history.md)，动态状态由命令生成。\n\n## 对外连接\n\n宿主通过 CLI 或 stdio MCP 调用项目；项目通过受控适配器调用 KIE，凭据只由执行器读取。预算、任务号、未知状态和结果哈希落在项目账本中。Codex 的图像工作包绑定实际图片、规则、知识和产物；ASR 与分轨读取 `.runtime/` 安装资产，TTS、音频理解及视频编辑使用受控 KIE 入口。见 [模型分工](../agent/contracts/model-routing.md)。\n\n每日知识提纯由项目 Hook 持有调度配置、提示词、输入和检查点，Codex CLI 是可替换的推理接口。Hook 形成候选；启用方法和改变偏好遵守项目知识合同。\n\n## 复用与失效\n\n源解析按完整源哈希和参数复用；制作缓存还核对定稿、参数、实现与工具版本。底片、声音、字幕和审核具有各自的适用范围。新语言重建稿件、声音、时间轴和检查；质量异议按实际哈希阻止旧版本继续生产。\n\n独立证据包保留自身文件和 manifest，不要求旧 run 永久存在。现行方法与源限定参考分开检索，旧版本集中保留。详细生命周期见 [存储合同](../agent/contracts/storage.md)。\n\n`fireplay_submission.coverage`用原片各自的目标语种对比已验证绑定，提供`delivery_coverage/submission_complete`；巡检直接消费同一结果，避免手工returned标志或某批次成功遮住漏交。`fireplay_retry.py`单独持有超时重传准备：只处理未入库的文件上传，保留旧尝试、以新超时证据有界恢复，不执行外部调用。媒体传输、素材归属、发布判断和需求完整性各有自己的校验。\n\n\n## 流程一致性核对\n\n快速与标准quality共用实际字幕同步evaluate及已有音频模型报告校验，负面、不确定、角色声线问题与错误哈希不能被高分声明覆盖。没有音频模型报告时不会自动新增付费调用，听感和画面仍须真实审核；这不实现默认口型重建或自动独立第二评审者。\n\n适用时优先选择ImageGen同镜头参考＋Wan，仍可按内容单独使用Wan或沿其他已验证路线。选用参考图时，Wan默认和自定义提示都保留用途：去字图指导背景恢复且不补字，译字设计图指导文字布局。附件须明确绑定真实图像路径与哈希，不从最近生成图自动猜选。逐镜头生成与绑定规则见[ImageGen政策](../knowledge/rules/imagegen-first-v3.md)。\n\n每次bind后会生成整项completion-check，CLI/MCP也提供独立完整性读回：对全部videos[].targets逐项核对已审成片哈希、素材ID与当前平台绑定。partial只完成当前批次；当前读回过期、缺语种/原片、缺素材、跨项复用ID或平台待用户选材时均不能报告整项完成。后续YouTube排队仍交平台。\n","lines":76,"sha256":"5a13bbf62230a5ddbe6c4064a8a563507057112097db860a054b60f3d6295bf6"},{"path":"agent/workflows/batch-production.md","text":"# 批次制作、预算与耗时\n\n本入口串联已有制作步骤，不替代 Agent 的源观察、翻译、路线选择或实际视频评审。不改变擦字、运动、声音和字体算法，也不降低质量标准。\n\n## 新任务\n\n主控按 `agent/templates/budget-request.json` 填真实用户请求、原视频、targets全部目标语言及宿主消息ID，执行 `bin/va.ps1 budget-open SPEC`，取得请求总账本ID。然后用 `bin/va.ps1 batch-create demo C:/media/source.mp4 --targets ja es pt` 编排语言。第一语言是代表语言，优先选择文字长度/字体与音频风险有代表性的语言。各语言独立run，但一次请求的所有批次/run/短片/模型/返工共用60 credits×去重目标语言数的总池；3语言180、10语言600。共用底片费用只计一次，允许池内灵活调配，不对每种语言另设60硬分区；别名重复、模型、run或任务数不增额。\n\n单语言也可用此入口。旧的init及查询、下载、评审继续可用，但没有请求账本的run不能新增付费调用。同源新run自动加入现有预算；首次登记会收纳同源旧run的费用，不能换run跳过旧账。派生短片字节不同，先 `budget-bind CHILD --parent-run PARENT` 继承总预算。删除run不会返还总账本中的费用或未知占位。\n\n只有用户后续真实提出新复用需求，主控才登记另一请求：`mode: reuse`、`reuse_of: 先前账本ID`、`reuse_confirmation: new_user_request`，使用新的真实宿主消息ID。旧账需全部对账，关闭后新请求按实际去重目标语言数×60 credits 登记（首次/新复用同价），再 `batch-create ... --reused`。同一请求的失败、返工、拆片或新增worker不是新的复用额度。已结算的历史供应商回执复用不重计费用；新调用照常计入新请求总额。历史账本不自动改价；带用户来源的 budget-amend 保留费用及未知占位。任务名额按原时长/角色数有限规划，两轮返工与整请求预算同时约束。归档恢复的旧batch指针仅作来源，新部署须由自己的拥有者授权并登记请求。\n\n1. 先对代表run执行analyze/context，建立真实inventory，使用已有source-save/source-find缓存原片观察。缓存不复制目标译文或验收。\n2. 按原流程准备无字底片、音轨和字层。底片必须过原有prepared-video门禁。同源资产用交付库恢复/绑定，或 `reuse-neutral TARGET --from-run SOURCE --source-shot ID --target-shot ID` 复用同一源时间段的已审无字底片。它复制独立证据并校验哈希、质量异议与原评审；不重新编码，不复制目标语言译稿/音轨/成片审核。绑定后重建目标plan。\n3. `tts-packet RUN --voice Kore --estimate 2` 从定稿speech_segments生成源绑定请求；可用 `--speech-ids id1 id2` 选择有序子集。声音选型、风格和保守估价仍按任务判断，此命令不付费。检查后用 `model-task RUN 包路径 --execute`。听感、语义覆盖和混音后对齐必做。\n4. `production RUN` 串联计划、渲染、原尺寸视觉对照、抽证据、quality。新视觉证据默认pending；按[视觉门禁](visual-review.md)完成逐实例观察以及整片/字幕实际观测后重跑。缺inventory或实际评审时明确停止，不编造通过；加 `--deliver` 仅交付通过者。现有build_repair_master、mix_localized_narration、OCR/ASR和分离脚本继续共用。\n5. 实际检查代表语言并填写评审后 `batch-approve demo`，重新过质量门禁，冻结成片、计划、评审及底片哈希。不将Agent自审改称用户验收；用户明确要求先确认时仍须等确认。\n6. 各语言自己的译稿、音轨、时轴、字层就绪后 `batch-run demo --deliver`，在第一个待审或失败处停止。非代表语言的付费提交和渲染重新核验代表语言，变化后须重新审核，各语言依然逐一quality。\n\n默认串行渲染，避免编码器争用磁盘/显存；未引入并发付费提交。原命令也可逐步使用，已绑定批次的预算、渲染门禁仍有效。新场景的遮罩、跟踪、字体和布局仍需判断，本次没有把单片坐标推广为通用算法。\n\n## 可恢复执行\n\n新增的 ASR / 分离 / 混音检查点、视觉片段复用和阶段导航见 [P0/P1 流程优化](../../docs/workflow-optimization.md)。优先 `work-packet RUN` 读取当前机械状态；`asr`、`audio-mix` 与旧脚本共用实现，采用返回的实际输出路径。默认同工作区一次一个重任务，资源忙时保留现场后重试，不主动删锁或重发付费任务。`production --force-render` 同时跳过整片和片段编码缓存。\n\nproduction编码检查点绑定计划、inputs/analysis字节、模型结果、项目字体、编码器版本与代码；各语言不复用目标成片。有效检查点仅跳过重复编码，capture、quality、质量异议仍重查。系统安装字体变化不在项目字体哈希中，改变后须 `production RUN --force-render`。返工应修改实际方案，不能反复编码同一失败方案。\n\n已有计划保留其明确路线（包括experiment）；inventory或资产改变导致计划失效时，先按原意重新执行plan，不由production偷偷换回默认算法。批次未完成前保留代表run及其评审，删除后放行证据缺失会阻断继续扩语。\n\n## 预算与授权\n\n`budget-status ID` 显示整次请求占位/计费、剩余额度和待对账数；`batch-status demo` 使用同一总账本并补充批次进度与耗时。视频submit、model-task、audio-analyze在外发前原子预留；KieClient写请求必须持有执行器预留许可，单份许可只能建一次模型任务。并发锁冲突时停止；中断在预留后未写job也继续占位，需要对账，不自动重发。确认终态计费后结算；收到费用但JSON解析失败也保存实扣。\n\n总账本在state/budgets，批次进度在state/batches。新请求上限按每个目标语言60 credits汇总（由config/budget-policy.json唯一配置），历史60/40与按时长账本保留原限额；修改run/batch预算或新建run不会增额。不要手动删除或调低账本。当前支持的全部付费KIE入口统一记账，其他供应商如后续接入也必须先走同一预留/结算合同。当前本地OCR/FFmpeg不产生供应商credits；Codex宿主套餐消耗没有KIE credits计价接口，不伪造换算。\n\n执行器能阻止“已实扣或占位 + 下一笔估价”超过总额，但本地估价不能约束供应商最终计费；要保证远端账单绝不超额，需要供应商的确定价格/硬限额。实际费用超估算会阻止后续调用，未知计费继续占位。旧的单笔视频40上限已移除，Seedance禁用、每run笔数与返工次数保留。\n\n权限边界：budget-open是宿主/主控登记真实用户事件的管理入口，不应暴露为子Agent可自行增额的业务工具。已授权自动KIE的正常翻译请求，无需为登记账本再问用户。当前本地文件系统无法防止拥有管理员权限的人改源码、伪造宿主事件或手动改账；迁移服务时由服务端保存可信用户事件、账本和KIE密钥，只给worker绑定预算后的执行接口。\n\n`kie-authorization` 显示拥有者授权。已授权预算范围内由Agent判断是否必要并使用KIE，不再每对话重复询问；需要扩预算、其他供应商或范围外素材时仍需授权。宿主安全审批不能由配置绕过。\n\n本机授权在config/kie-authorization.local.json，含原话及工作区绑定；不进Git或干净导出。新部署的操作者按自己的授权复制example为local并填实际路径。能力可迁移，付费同意不替其他用户作出。\n\n2026-10-22：项目根 AGENTS.md 要求每次先读取 `kie-authorization`；已有有效授权范围内直接执行必要调用，无须逐视频重复询问。Codex 的命令/外发审批是独立宿主权限。用户对“本项目所有符合条件的命令和外发审批交给 Codex 自动审核，范围包含 KIE 之外的本项目操作”明确答复“允许本项目自动审核”，因此 `.codex/config.toml` 保存 `approvals_reviewer = \"auto_review\"`。该默认由自动审核处理符合条件的请求，沙箱、预算、模型限制和托管安全要求继续生效；高风险、超出授权或审核未通过的操作仍可能需要人工确认。\n\n新会话需在受信任的项目目录加载该设置；会话显式权限、启动参数或托管要求可覆盖项目默认，当前有效模式以宿主为准。完整文件复制可带上 `.codex/config.toml`；现有 `workspace-export` 不复制该目录，也不导出本机 KIE 授权，使用干净导出包时需在目标宿主初始化一次相应设置及拥有者授权。\n\n## 统计范围\n\n`timing RUN` 和batch-status读取state/timing：自动记录解析、计划、渲染、抽证据、质检、上传/建任务/查询/下载及共用OCR/ASR/分离/混音/底片脚本。失败也计时；不存提示词、媒体、密钥或签名URL。\n\n阶段数字包含子步骤，不能将外层render与内层ffmpeg相加。报告另给顶层工作秒数、合并重叠区间的观察墙钟、首末跨度和未观测间隔。Agent思考、人工评审、用户等待和旧临时脚本没有自动细分，间隔不能归因为OCR或模型慢。杀进程造成的未完成阶段没有完整时长，不伪造历史统计。provider_seconds继续以原始供应商回执为准。\n\n## 文字识别与源解析复用\n\n`codex-packet RUN --stage recognize` 提供实际图片和项目知识，由 Codex 看图完成实例识别，再用 `codex-result` 登记真实观察。`bin/ocr.py RUN` 是同一工作包的兼容入口。登记成功不代表实例覆盖、翻译或质量已通过，缺失观察继续 pending。\n\n源解析库可复用已核验的源帧和历史 OCR 观察；复用仍需核对当前源哈希及覆盖范围。新识别不调用 RapidOCR 或 GLM，具体合同见 [文字识别](ocr.md) 和 [模型分工](../contracts/model-routing.md)。\n\n新增语言时，主控将真实用户授权、完整targets和修订后总额度填入 `agent/templates/budget-amendment.json`，执行 `budget-amend ID SPEC`；旧费用和未知占位保留。同一授权重复提交幂等；不通过再次budget-open重置账本。历史账本只修额度时省略targets，不能自动迁移或降低已占用金额。\n","lines":60,"sha256":"7ad0d0a5c5f25ef44f57fe3f13a802c12f7a49fe55f35697e8724e6c71c5c34b"},{"path":"docs/daily-knowledge-curation.md","text":"# 项目自身的知识提纯 Hook\n\n开发者于2026-10-20授权每天北京时间09:00整理新增项目经验、合并重复内容，保留来源和适用范围；已验证翻译规则保持原样，不调用付费视频模型。2026-10-27用户进一步要求巡检、经验总结、存储整理各用独立定时任务，2026-10-28用户将执行时区调整为Asia/Shanghai，当前由独立应用经验任务每天上海时间18:00唤醒，见[三项定时职责](scheduled-tasks.md)。项目保留提纯角色、检查点与写入控制，调度与推理解耦。\n\n## 运行链路\n\n```text\ndeliver / reflect → 项目候选与inbox\n                              ↓\n独立经验定时任务 / 可选Windows宿主触发器\n                              ↓\nconfig/hooks.json → curation.py：锁、到期判断、文件哈希增量\n                              ↓\nconfig/hooks/knowledge-curation/prompt.md + 有界packet\n                              ↓\n可替换的文本推理接口 → 分组、合并建议、pending\n                              ↓\n执行器检查来源、原scope、可见性、保护文件哈希\n                              ↓\nknowledge/distillations/候选 + 原子检查点 + 审计记录\n                              ↓\nknowledge-queue → 主控审查采纳目标/缺证据 → knowledge-promote / knowledge-review\n                              ↓\n正式方法与独立候选召回 → knowledge-use 使用反馈 → 修订审查队列\n```\n\n当前文本适配器是 `codex_cli`，通过命令行使用当前登录的AI推理能力。当前独立应用任务负责唤醒，不能在关闭应用后宣称会继续运行。Windows可选择已核验的系统触发器，但不与应用经验任务重复启用。换AI时可使用相同的packet/schema与prepare/apply接口；预算边界和存储规范保持在项目内。\n\n## 操作\n\n```powershell\n.\\bin\\va.ps1 hooks status\n.\\bin\\va.ps1 hooks run                 # 手动执行一次\n.\\bin\\va.ps1 hooks run --due           # 按config/hooks.json的上海时区到期判断执行\n.\\bin\\project-hooks.ps1 -Action Install\n.\\bin\\project-hooks.ps1 -Action Status\n.\\bin\\project-hooks.ps1 -Action Uninstall\n```\n\n新机器首次部署必须显式运行 `hooks baseline`，登记当时已经整理的历史输入；已有检查点不能重建覆盖。来源为knowledge/candidates及knowledge/local下的candidates、inbox、feedback，排除目录索引和生成报告。安装定时器不会调用推理或视频模型。\n\nWindows可选任务计划程序，按带UTC+08:00时区的每日触发器执行，并在当前用户登录时检查补跑；此路线需要电脑开机、用户登录和有效CLI/Python，可不依赖桌面应用。当前macOS使用应用定时任务，需要应用运行，没有独立系统触发器的安装证据。其他宿主可显式配置系统定时器调用 `va.py hooks run --due`；仓库配置本身不会唤醒关机电脑。迁移机器后重新核对调度，不重建旧检查点。\n\n更换推理接口或人工检查建议时：\n\n```powershell\n.\\bin\\va.ps1 hooks prepare             # 输出packet与JSON schema位置，不请求AI\n.\\bin\\va.ps1 hooks apply --response work/curation-response.json\n```\n\n新回复必须覆盖当前packet的每个event_id；过时、重复、来源不明、跨scope或跨公私范围的合并会被拒绝。若配置engine为packet，定时任务只准备资料并明确报告awaiting_reasoning，不声称已自动提纯。\n\n## 保存与执行边界\n\n- 检查点、锁、任务包、推理用量、pending与报告保存在 `knowledge/local/curation/`；这些是本地运行状态，不是项目经验正文。已整理技术候选保存在可版本管理的 `knowledge/distillations/`；私有来源的提纯保存在本地private-candidates。\n- 每条候选继承原scope，保存全部原始观察快照、来源路径/哈希、限制、失败和反例。路径只是来源标签；读取方法不依赖runs/outputs。原始记录保持不变，修订使用新内容哈希文件，旧版本继续保留。\n- 新回复须提出 adoption 目标及缺证据项；旧缓存回复仍可读取，不假装已有采纳决定。已通过审查关闭的来源不再进入增量提纯。Hook报告指出待审队列，主控通过knowledge-review落实处理结果；Hook自身仍不能发布正式规则。\n- AI只返回受schema约束的数据。CLI适配器在隔离目录运行，禁用shell、MCP、应用、浏览器、图片生成、其他Agent及宿主hooks；执行器不向其传递媒体模型密钥。工具调用结果会被拒绝。\n- 相同含义、完全相同scope及相同可见性才允许合并。同一素材返工不算独立复验。缺证据或有冲突保留pending/待审，不自动启用。未变化的pending保留待办，不每天重复调用AI；补充或修订来源后再次进入增量。\n- 执行前后核验正式索引、规则、案例、agent 执行依据、docs 开发说明、config（含偏好和 Hook 提示词）与技能的哈希，并运行knowledge-audit。全部成功后，检查点一次提交源进度与候选版本；目录索引仅是可重建视图。并发锁、缓存回复和不可变版本防止重试重复；失败不推进检查点。\n- 本hook没有视频、图片或语音模型提交接口，不读取.env，不制作视频、不清理runs/outputs、不提交Git、不修改全局记忆。外部媒体模型credits为0；文本推理使用当前AI账户额度，实际用量记录在engine-receipt.json，不能表述为完全无计算消耗。\n\n当前上限与时间在 `config/hooks.json`；角色提示词在 `config/hooks/knowledge-curation/prompt.md`；宿主安装回执在 `knowledge/local/curation/schedule.json`。代码与配置可随项目管理，机器路径和运行凭据保持本地。\n\n日常主动检查不依赖用户提醒：每次制作/修复/反馈结束记录本次经验，独立经验任务读取`knowledge-queue`与`hooks status`；每日到期时运行`hooks run --due`，再按知识技能处理本轮待审。Fireplay巡检不兼做全局知识整理。`new_records`表示尚未进入提纯的输入，`adoption_queue_open`和`review_required`表示尚未闭合的审查，`pending`表示Hook保留的具体缺口，三者不能混为一谈。来源已直接审查结清时，不再重复生成提纯候选。电脑/宿主未唤醒或推理失败时保留实际缺口，不声称定时处理成功。\n\n2026-10-27知识暂存整理修复：知识队列和增量Hook均排除独立案例包内副本与原始ASR证据，原文件继续保留。inbox指向已归档公开候选时，按实际候选哈希及原案例/已采纳目标核验已闭合状态，不仅按名称丢弃；无需反复提纯旧指针。当前本机在实际队列与未处理增量均归零后建立基线，不将未审来源伪装成已总结。此处不宣称已安装独立系统调度器，应用监控仍由既有定时唤醒执行。\n","lines":67,"sha256":"3f42f36b03718d90e30d70994a45198a7970e40e23fa07aeb3883da173b9bd71"},{"path":"agent/workflows/local-production.md","text":"# 本地配音与成片前失败结案\n\n`work/` 是草稿桌，不是工具箱。代码放 `src/` 和 `bin/`，参数模板放 `agent/templates/`，模型注册表放 `config/`，安装好的依赖和权重放 `.runtime/`。后者不上传 Git，但安装入口和校验规则随项目提供。知识与独立错误案例保存在 `knowledge/`。\n\n## 声音与图片\n\n新配音统一使用 `tts-packet → model-task` 的 Gemini TTS。`local-tts` 只核验和复用已有完整声音，不产生新 Piper 推理；缺失或改稿时使用当前配音入口。模型、旧声音和用户素材不在本次策略切换中删除。\n\n图片直接交给 Codex，使用 `codex-packet --stage image → codex-result`，遵循 [模型分工](../contracts/model-routing.md)。实际混音、字幕时间和成片审查继续使用原有合同。\n\n## 没有成片的失败\n\n```powershell\nbin/va.ps1 close-failure RUN inputs/preproduction-failure.json\n```\n\n规格见 `agent/templates/preproduction-failure.json`。填写真实阶段、观察人、原因假设、逐项观察、实际文件 SHA256，以及尚未检查的范围。独立保存必要证据并建立候选与 inbox；相同输入幂等，新判断建立新案例。已有 candidate 时仍走正常 quality/reflect。不会改预算，不会把失败结案变为交付或正式知识。\n\n## 修复与旧脚本\n\n可选本地程序能力通过 `repair-run` 调用；LaMa 新推理已停用，图片方法由 Codex 自主选择。现有程序工具，包含颜色/连通域掩模、保护区域、显式实验性的泊松融合，以及之前迁出的三类修复。参数仍需按实际素材填写，详见 [修复配方](repair-recipes.md)。旧脚本的具体坐标、阈值和视觉判断不是通用默认值。尚未验证的光流对齐等素材专用尝试仅保存为历史参考，不作为可发布能力。\n\n## 清空边界\n\n只有在相关任务停止、草稿不再是唯一输入、知识和错误案例独立保全后，才可清空 `work/`。下次运行可能自动重建 `work/tmp` 或缓存，这是正常行为，不应重新出现安装依赖。平时的 run 清理继续遵守 [存储门禁](../contracts/storage.md)。历史一次性重置不构成日后自动清空规则；未知费用保留原账本与占位。\n\n有价值的临时计算进入正式模块，具体参数进入配方，观察进入独立案例。历史脚本只作为来源数据，不由生产入口执行或自动进入规则检索。\n","lines":27,"sha256":"a86f6b305ba612ddf711240089c99ef4b491ee6798262f65cbe56d77d69c1820"},{"path":"agent/workflows/ocr.md","text":"# Codex 文字识别\n\n文字识别统一由 Codex 直接看图完成。先运行 `analyze`，再执行 `codex-packet RUN --stage recognize`，读取真实图片清单与项目知识。旧 `bin/ocr.py RUN` 也只生成该工作包，不启动 RapidOCR 或 GLM。\n\n逐实例记录原文、译文、区域、出现/消失时间、保留理由与实际帧证据；小字、旋转、遮挡及动画边界补查原尺寸相邻帧。看过代表图不代表全片覆盖。分组工作包可通过 `--spec` 的 images 指定，每组结果由 `codex-result` 登记，最后由 Codex 汇总 inventory，未解决项保持 pending。\n\n图片处理及回执格式见 [模型与图像工作合同](../contracts/model-routing.md)。旧 OCR 本机配置不再生效，历史报告保留为来源记录；其候选、空识别和旧 pass 都不代替本次观察或质量审核。\n","lines":7,"sha256":"cd4b88f51fe1a6dbcabd7352e3bcd000b1cda4b2c2c53227a2aa90320dab14fc"},{"path":"docs/project-layout.md","text":"# 目录与干净导出\n\n源码、安装资产和任务数据分开保留。清空运行数据不会卸载模型；导出源码不会携带旧视频或本机授权。\n\nRemotion是可选下载依赖：源码只保留`src/remotion_renderer`的项目适配器、package.json及锁文件。按`bin/setup_remotion.py --install`下载到`.runtime/deps/remotion`；Node、浏览器和node_modules不提交GitHub。导出会跳过各层node_modules、.cache及Python缓存，但保留适配器和安装清单，已安装环境不受导出影响。\n\n| 目录 | 内容 | 进入源码 |\n| --- | --- | --- |\n| `bin/`、`src/`、`tests/` | 正式入口、实现、测试 | 是 |\n| `workbench/` | 本机只读工作台及其测试、静态资源 | 是 |\n| `.agents/skills/` | AI 制作和知识整理的操作入口 | 是 |\n| `config/` | 公共参数、`profiles/` 偏好档案、`workflows/` 流程配置、`hooks/` 提示词 | 是，递归收集并排除 `*.local.json` |\n| `agent/` | `contracts/` 执行规则、`workflows/` 操作步骤、`integrations/` 工具约定、`templates/` 填写格式 | 是 |\n| `docs/` | 架构、安装维护、实现原理、开发测试和历史说明 | 是，排除一次性 `verification/` 报告 |\n| `knowledge/` | 方法、源参考、独立证据、候选和历史版本 | 是，排除 `local/` |\n| `.runtime/`、`.venv/`、`assets/fonts/` | 本机工具、依赖、模型和字体 | 否，由安装流程准备 |\n| `runs/` | 本次现场、模型任务、候选和评审 | 否 |\n| `media/` | 原片、源帧、音轨和中性观察快照 | 否 |\n| 根 `outputs/` | 可离开 run 恢复的交付/复用包 | 否 |\n| `state/` | 预算、批次、锁、保全、清理和维护回执 | 否 |\n| `work/` | 可重建缓存、开发实验、测试和临时导出 | 否 |\n| `.env`、`.codex/`、`*.local.json` | 凭据、宿主配置和本机授权 | 否 |\n| `dist/`、`.archive/` | 明确生成的分发包或本地归档 | 否 |\n\n`runs/<任务>/outputs/` 是现场的一部分；根 `outputs/` 是独立交付库。`media/` 保存源解析，不是已验收的去字底片。它们可能保留相同字节来满足各自恢复合同，不能只按重复哈希删除。\n\n## 生成源码副本\n\n```powershell\nbin/va.ps1 workspace-export dist/source\nbin/va.ps1 workspace-verify dist/source\n```\n\n目标必须不存在。导出使用代码中的公开目录清单，不复制整棵工作目录；保留原始字节，并在导出副本生成 `fresh-workspace.json` 供核验；主仓库不维护过期的导出清单，该生成文件不进入Git。`knowledge/history/` 随源码保留，确保替代链可追溯。本机授权、私有证据、生产视频、Git 历史、模型和字体不会导出。\n\n副本安装方式见 [README](../README.md)。`workspace-init` 复制公共配置、操作文档、技能和知识，执行器仍在代码目录；配合 `VIDEO_LOCALIZER_WORKSPACE` 可隔离工作区。`workspace-export` 包含可独立安装的完整源码。\n\n## 目录迁移与旧记录\n\n2026-10-22 按职责统一布局：原 `core`、`systems`、`templates` 与执行步骤集中在 `agent/`；`designers` 和 Hook 提示词集中在 `config/`；流程的机器配置保存在 `config/workflows/`。`docs/` 专注开发说明。整理过程曾把执行依据放入 `docs/`，随后按项目拥有者要求分离，旧目录不保留重复副本。\n\n当前操作说明、代码和模板使用新路径。历史需求、实验原文及案例证据保留原始来源标签；现行知识中的合同路径变更有 [首轮迁移记录](../knowledge/curation/layout-migration-20261022.json) 与 [Agent 目录迁移记录](../knowledge/curation/agent-layout-20261022.json)，原文和哈希均保留，没有改变规则含义或验收结论。\n\n已有 run、交付包和账本不批量改写。旧计划或 Codex 工作包若因档案/合同路径及哈希变化而失效，续作时用 `work-packet` 核对缺口，重新生成计划或工作包，并按门禁重新绑定实际检查；不能修改旧审核哈希让它继续通过。\n\n## 发布前核查\n\n```powershell\n.venv/Scripts/python.exe bin/check_repository.py\nbin/va.ps1 knowledge-audit\nbin/va.ps1 check\n```\n\n仓库检查核验现行文档链接、知识索引、历史正文哈希和发布边界；知识审计核验现行正文及证据。隔离副本中执行 `demo --id smoke-001` 可检查合成媒体链路，需要真实观察的字段继续 pending。\n\n流程图保留离线来源快照。修改被引用的合同、实现或命令后，运行 `.venv/Scripts/python.exe bin/sync_flow_reference.py` 刷新快照与 CLI 帮助，再运行仓库检查；`--check` 只核对快照。流程解释本身仍需人工/Agent 审查，不由同步脚本推断。\n\n导出不带 Git 历史；直接发布现有 Git 仓库时还应核查历史。仓库尚未声明开源许可证，源码可上传不等于已授予第三方再分发权。模型和字体遵守各自来源许可。\n\n## 本机清理\n\n运行产物按 [存储合同](../agent/contracts/storage.md) 保全、预览和删除。`work/` 不承载唯一正式能力或唯一案例证据：有价值的脚本先提入 `src/`/`bin/`，参数进模板，观察进知识，再清理临时副本。没有活跃进程、恢复依赖或唯一证据时，普通临时内容可删，缓存按需重建。\n\n当次清理结果以本地回执和目录检查为准，长期文档不声明运行目录“永远为空”。实际账单未核清时保留记录和预算占位。\n","lines":64,"sha256":"4feec41422164bca46efde133be25dac0e97af79897f24a1d0768e9509064a7b"},{"path":"agent/workflows/quality-feedback.md","text":"# 后续质量反馈如何影响旧交付\n\n文件可恢复、原评审曾通过、现在适合交付，是三个不同判断。用户的新反馈或可复现缺陷能够推翻视觉通过，但不应改写历史文件来掩盖误判。\n\n1. 定位实际源、成片哈希和问题区间；保留用户原话、观察证据及绑定不确定性。\n2. 使用 `agent/templates/quality-hold.json` 填写规格，执行 `bin/va.ps1 quality-hold SPEC`。规格和证据使用工作区相对路径；输入文件哈希必须匹配。共享底片本身有缺陷时另写一条 `asset_kind: neutral_master` 的记录，不能只标某一语言的成品。\n3. 运行 `delivery-index` 刷新当前查看入口。历史manifest及评审不变；`library-find` 返回原status、当前effective_status、quality_holds、visual_reuse_holds和production_eligible。`availability=available`只说明包仍完整可恢复，不等于可用于制作。\n4. 制作底片检查和deliver阻断有异议的实际哈希。即使修改旧批准布尔值、复制到另一个run、重新归档，仍无法用同一字节绕过。deliver也复核计划内底片，避免绕开正常render后交付新文件。\n5. 修复版本使用新的字节和审核证据；新哈希不自动继承旧异议，也不自动通过。当前实现只追加阻断事件，不提供删除历史异议或一键重新批准原问题字节的入口。\n\n记录及必要证据独立保存于 `knowledge/local/quality-holds/<源哈希>/<资产哈希>/`。清理run或交付库不会删除这些记录；完整迁移既有工作区时须携带knowledge/local。干净源码导出排除客户异议记录，通用反例和方法另存公开knowledge/examples，二者各司其职。单独旧交付包仍是历史快照，不能在丢失后续异议库后声称掌握最新验收状态。\n\n记录具有来源、不可变事件ID和证据哈希。重复登记相同事件不重复累积；修改同一ID时报错，必要时追加新事件。记录缺失或被篡改时阻断当前用途，不静默恢复旧通过状态。\n\n这个机制负责落实已经观察到的质量判断，不自动识别灰块、残字或错误运动。Agent仍须检查实际编码视频，分别报告自审、独立审查和用户验收。视觉缺陷不会自动否定已核验的声音、译稿或其他源素材。\n","lines":15,"sha256":"03a3aa64d086b2ff0abac0b8fcb1d496c0e1f588222438558cec670a04595d85"},{"path":"agent/workflows/repair-recipes.md","text":"# 本地去字／去水印配方与风险预检查\n\n本功能执行已解释、绑定源片的局部修复；不自动理解水印、挑选供体或认定效果合格。方法正文见 `knowledge/rules/publisher-watermark-removal-v2.md`。已有 prepared、资源锁、视觉审核和质量异议继续有效，不另建模型任务系统。\n\n```powershell\nbin/va.ps1 repair-preflight RUN\nbin/va.ps1 repair-run RUN inputs/repair.json --probe\nbin/va.ps1 repair-run RUN inputs/repair.json\n```\n\n配方示例为 `agent/templates/local-repair-example.json`。填写实际 source_sha256、产品/姿态边界、操作区间、掩模 bbox 或 polygon、旋转角度、trajectory 和保护区；reason 说明真实观察。bbox 轨迹线性插值，不能代替正确跟踪。当前程序配方可使用 temporal_frame、temporal_median、telea 等操作；图片模型编辑由 Codex 完成。时序供体与目标必须在声明的同一镜头/姿态内；实际边界和干净供体仍需 AI 判断。不要直接使用旧素材的坐标或旋转速度。\n\n预检查复用原分析器的视觉切点检测，并分别列出文字源区间、轨迹事件和完整画面边缘检查。候选切点不是已复核的镜头边界，模糊文字入场也需看原图。探针覆盖事件前后连续帧，输出原尺寸 PNG；它们不能放行整片。MCP 提供 localizer_repair_preflight 和 localizer_repair_recipe，后者默认 probe。\n\n完整结果使用无声 FFV1 无损底片和版本化 provenance，记录真正变化的掩模范围。掩模外及保护区直接保留原像素。配方冻结进该版本目录，后续修改原配方不破坏旧记录。LaMa 新推理已停用；历史结果仅在输入及结果哈希匹配时复用，新的图片编辑按 [模型分工](../contracts/model-routing.md) 执行。当前内存预算限制解码源片不超过512 MiB，VFR须先显式规范化；长片应先选有来源的短片段，不静默改变时轴。\n\n继续按 visual-evidence --stage neutral → visual-notes → visual-release-neutral → plan 建立审核。默认未通过，禁止把执行成功、掩模外像素一致或探针干净当作修复质量通过。\n\n项目 state/repair-trials/<RUN>.json 跨配方累计实际尝试和耗时，默认4次、600秒。缓存命中不增加次数；修改配方不重置预算。需继续时提供 --extension-reason 解释失败和下一变量，仅增加1次及300秒；这不是付费授权或质量豁免。达到时间预算会停止局部计算，半成品不是检查点。\n\n进程中断后先按现有规则核对 run/resource 锁及 PID；不要删除活锁。确认进程已退出后可运行 repair-reconcile RUN --reason \"有来源的中断原因\"，它只核验本地检查点或标记中断，不重发远端任务。work-packet 返回尝试记录、已有问题和图片展示游标，展示不等于审查通过。旧的一次性脚本未接入此预算，不能据此宣称所有历史脚本都已受控。\n\n## 旧脚本迁移与逐帧复用\n\n不要复制旧脚本再改一个帧号。把输入资产、操作区域、生效区间及参数放进配方，仍从 `repair-run` 执行。本轮把已实测旧脚本中的三类操作提为通用方法：\n\n- `source_restore`：从原片同一帧恢复指定矩形，不借用其他时刻。\n- `horizontal_fill`：从当前原帧的左右干净边缘采样，逐行插值；只适用于已经核实的平坦背景，不推广到纹理、产品或其他视频。\n- `exposure_patch`：使用已有、哈希绑定的同帧模型画面，按指定参考行修正曝光及过渡；不调用模型，不自动证明生成画面正确。\n\n这三类操作的整数 `bbox` 使用半开范围 `[x,x+w)`、`[y,y+h)`，与 Python 切片一致。旧 `telea/lama/temporal_*` 的掩模约定保持不变。\n\n原脚本按帧号判断时，显式填写 `frame_interval: [起始帧, 结束帧]`，起始为零、结束不包含；它是实际生效范围，`start/end` 保留时间描述，帧区间仍必须落在声明镜头和视频范围内。不要直接将帧号除以帧率当作等价条件，MKV 毫秒时间戳取整可能漏掉边界帧。按秒定义的普通配方继续只用 `start/end`。\n\n`base_video: {path, sha256}` 可指定已有底片。声明区域之外保留底片像素，`source_restore` 才从源片恢复。`proposal_video` 同样绑定路径与真实哈希。源片比底片短时默认拒绝；只有明确设置 `hold_source_tail_frames` 才允许相应数量的末帧延展，时钟不一致仍拒绝。这是显式保留旧行为，不是对新视频自动补帧。\n\n每帧复用依据包含源片、底片、该帧的操作顺序/实际参数/供体、模型、实现与解码工具版本。只改生效边界时，未受影响的帧不重新做修复计算；参数、供体或素材改变时相应帧失效。源片、底片或实现改变时保守失效。旧母版及帧索引必须核验哈希，取出的像素也逐帧校验。\n\n缓存只引用已完成的无损母版并增加小型 JSON 索引，不另存逐帧 PNG。缺失旧母版会重算；被篡改的文件会停止。完全相同配方的资产已过期时，新建 rebuild 版本，不覆盖旧配方、失败记录及旧审核。输出仍默认为 `approved_for_reuse=false`，必须重新绑定实际结果并按原质量流程审查。\n\n目前仍需要读取源片、读取被复用的母版帧以及完整无损编码；不承诺每种廉价修复都提速。已验证的是本次三类旧操作的迁移，任意历史 Python 脚本不会被自动拦截或自动改造成增量执行。\n\n像素等价和边界回归见 `tests/test_incremental_repair.py`；旧实验概述见 [维护历史](../../docs/history.md)。真实画面验收与这些执行测试分开报告。\n","lines":43,"sha256":"b226ac11336a6227ffeafcbd64b394d8148de18fd0432e5fa2c4defe38663c5d"},{"path":"docs/reusable-methods.md","text":"# 项目知识如何跨视频使用\n\n知识提供有适用条件的处理程序；案例提供判断这些程序的证据。方法不等于模型权重，也不能把旧素材的坐标、声音或验收直接套给新视频。\n\n## 当前读取方式\n\n`context.knowledge` 返回适用政策和有界方法，`context.source_references` 单独返回同源参考。`plan` 分别冻结命中正文和依赖。输入语言政策按输入阶段使用；当前数量以 `knowledge-audit` 为准。\n\n| 方法入口 | 触发与可复用内容 | 仍需重新判断 |\n| --- | --- | --- |\n| [气泡排版与动态自然去字](../knowledge/rules/container-layout-and-local-motion-repair-v1.md) | 原生卡片、移动人物/纹理上的文字；分层字形测量、保护对象、原帧覆盖与局部融合；[代码入口](container-motion-repair.md) | 容器尺寸、字体塑形、运动表面、修复范围及实际模型效果；不固定 Wan |\n| [选择与冲突处理](../knowledge/rules/agent-method-selection-v2.md) | 全部任务；实际条件、政策优先级、主/辅助方法组合及退出 | 新素材证据与用户硬性要求 |\n| [多人固定声线](../knowledge/rules/short-drama-character-voices-v2.md) | speech 且多角色/短剧；同角色固定、不同角色区分、最低男女声 | 实际身份、音色、跨次一致及降级边界 |\n| [短剧声音事件](../knowledge/rules/short-drama-audio-scenes-v2.md) | 轮换、短回复、重叠、长句、独白和片尾；按源轮次安排时间 | 实际生成时长、空隙、清晰度及句尾 |\n| [实例与时间轴](../knowledge/rules/text-instance-timing-v1.md) | 每个位置、出现区间单独记录，覆盖全部镜头 | 新视频的实际边界与漏检 |\n| [路线选择](../knowledge/rules/route-selection-v4.md) | 按背景、运动、保真要求选本地修复、模型编辑或重建 | 路线效果、预算和素材限制 |\n| [图片修复与连续视频](../knowledge/rules/method-source-neutral-preparation-v5.md) | Codex定修复参考和译文字形，按源帧合成；需要连续重建的区域交给Wan，声音单独翻译 | 逐帧合成与逐帧生成的区别，原运动/前景/特效，模型实际采用范围，独立音频检查 |\n| [文字、前景与遮挡](../knowledge/rules/method-animated-text-occlusion-v8.md) | animated_text、artistic_typography、filmed_phone_ui、foreground_occlusion、surface_typography 任一命中；分层、排版和连续编码检查 | 实际字体、取帧范围、原文字平面、背景失焦、片尾时长、动态承载面及有条件的透明资产导出 |\n| [口播与字幕](../knowledge/rules/method-spoken-caption-verification-v4.md) | speech；定稿、识别分歧、句间停顿及实际混音边界 | 新语言文案、音色、时间轴与听感 |\n| [水印与片尾同标](../knowledge/rules/publisher-watermark-removal-v2.md) | 识别发布者身份，默认去除静态/移动水印及匹配片尾商标；检查模糊入场、边缘、旋转和切镜 | 实际身份关联、产品品牌区别、用户保留例外、轨迹和干净供体 |\n\n共同政策包括 [视觉门禁](../knowledge/rules/neutral-visual-and-animation-gate-v4.md)、[口播字幕统一](../knowledge/rules/user-caption-audio-sync-20261019.md)、[请求总预算](../knowledge/rules/user-language-budget-60-20261026.md)、[语言别名](../knowledge/rules/language-aliases-v2.md) 和 [不以实色块盖字](../knowledge/rules/user-no-solid-text-panels-20261022.md)。参数与状态由当前配置及索引决定。\n\n## 证据与推广边界\n\n多源观察至少来自两个不同源视频；同源多语言或多轮返工不增加独立来源数。这一等级包含反例，不等于多次成功验收。旧“通过”被反证推翻时，同时保留原评审、追加观察及当前使用限制。\n\n`examples/` 保存独立图片、音频、原始观察及 manifest。案例正文与通用方法可能谈同一主题，但前者限定某个来源，后者规定条件和步骤。逐字相同的旧兼容副本已去除；被替代版本集中在 `history/`。详见 [知识目录](../knowledge/README.md)。\n\n候选部分采纳的关系记录在 `curation/`。相同含义且范围一致时合并证据；特定阈值、遮罩、字体、模型成功与未验证细节保留原范围。结构整理不自动启用候选，也不修改公司偏好。\n\n## 按信息载体选择制作重点\n\n[三类广告](../knowledge/rules/content-led-localization-v1.md)：音频主导先处理完整人声、角色与时间，画面文案主导先处理文字/底面/动画，混合型两条链路合成；所有类型都翻译旁白和对白并保留音乐音效。分类依据与方法首选/备选、切换/停止条件进入 routing_assessment，普通/快速模式均冻结。程序补齐可从角色/文字事实得到的标签，适用 required 方法完整返回，Agent 保留实际方法选择权。\n\n旧案例将`language_match`保存在scope内时，检索兼容读取该字段为匹配政策，不要求输入提供同名事实；它须与条目明确政策一致，否则报错。默认仍完整标签匹配，不能据此扩大到地区标签或其它源片。\n","lines":36,"sha256":"b8c8401655d2859d838a6464d6f4db999b358f7bfbf341a41055d8497d8f0a3f"},{"path":"agent/contracts/storage.md","text":"# 存储、保全与清理合同\n\n当前 AI 判断保留价值并提纯经验；执行器负责锁、复制、哈希、依赖闭包和账本门禁。目录职责见 [项目布局](../../docs/project-layout.md)，知识分类见 [知识入口](../../knowledge/README.md)。\n\n## 独立保留的对象\n\n- `runs/<任务>/` 保存制作现场，包含输入、定稿、计划、任务、候选和评审；制作中和恢复时使用。\n- `media/<源哈希>/<版本>/` 保存原片、源帧、音轨、OCR/转写及中性观察；只用于核验过的同源解析，不继承目标语言结果。\n- 根 `outputs/` 保存可独立恢复的交付/复用包。manifest 绑定成片、源片、准备资产、语言层和评审；历史 revise 包仍是待改进参考。\n- `knowledge/` 保存方法、必要案例和反例；`knowledge/local/` 保存私有证据、质量异议、候选及检查点。\n- `state/` 保存预算、批次、锁、保全、恢复和删除回执。未知费用继续预留。\n- `.runtime/` 和 `.venv/` 是安装资产；`work/` 是可重建缓存和临时工作。\n\n这些对象有各自的恢复合同。相同字节可以出现在多个独立包中；同一包可用内部硬链接，交付包不能链接到可变 run。知识案例使用独立文件，不依赖生产目录长期存在。\n\n2026-10-23 用户要求减少空目录和无用半成品：新 run 仅创建收件所需目录，其余由实际阶段写入时创建。续作先查询 `work-packet` 的 `reusable_packages`，优先使用已核验 outputs 包。阶段结束后，Codex 判断保留价值；无用 run 走下述保全/删除，过时版本走选择清单。普通空目录与无引用的可重建缓存可在明确清理授权内删除；安装资产、正在使用的目录、未结算记录和必要证据继续保留。2026-10-23 用户进一步授权将增量整理作为后续每次运行的固定流程；具体执行见下节。\n\n`storage-report --duplicates` 提供定位线索，不是删除清单。`storage-policy` 与 `storage-plan` 提供数量、容量和最低剩余空间预警，目前不会自动删除。\n\n## 每次运行的增量整理\n\n由 `config/maintenance.json` 启用，用户授权来源为 2026-10-23 本项目会话。运行中的阶段操作成功后，`guarded` 自动检查本任务账本与活动锁、移除本任务普通空目录，并写 `state/maintenance/<run>/latest.json`；清理失败单独记录 deferred，不影响已经生成的视频。嵌套操作只在最外层检查，保全/删除操作不触发二次整理，避免改变已冻结指纹。\n\n1. 开始和续作：读取 `work-packet.maintenance` 与 `reusable_packages`。临时文件放 `work/runs/<run>/`，目录按需创建。长期执行能力进入 src/bin，回执进入 state，实际审核与必要失败证据进入 run/knowledge，正式成片进入 outputs。\n2. 阶段收尾：确定某个文件只是可重建缓存后，用 `scratch-register RUN work/runs/RUN/文件 --reason 重建方法` 登记当前哈希。成片实际文件哈希与交付记录一致、账本/任务已结清时，交付阶段 Hook 自动核对内容与引用，保存指纹预览，再删除已登记且未变化、未被引用的缓存。未登记文件不按扩展名或年龄猜测删除。返工中的中间阶段不会因为存在旧交付记录而释放缓存；其它 run 活动时暂缓引用扫描。\n3. 每次任务结案：完成外部提交和必要记录后，执行 `maintain RUN --close`。它串行执行保全、删除预览与当前指纹删除；源片、知识案例和独立交付包验证通过才移除 run。仍需被其它任务引用、账本未结清、活动锁或缺少完整译片时保留，并输出具体原因。后续续作先处理这个回执；不建立隐式后台定时器。\n4. `work/` 中旧的未归属文件先分类，不自动认定全是垃圾。新任务统一归属路径，避免继续累积。`work/cache/uv` 等共享包缓存可复用，不随单个视频结束反复清空；按容量报告单独安排清理，安装资产保留在 `.runtime`。已经作为审核依据或复用依赖的文件先迁入正式包，再重新核对引用后整理。\n5. 根 `outputs/` 是交付库，每次结案检查成片已独立归档，保留现行最终版和有价值复用包。空目录可移除；旧完整版本按选择清单保全。重复字节、低分、时间久都不单独构成删除理由。失效/缺文件的包记录问题，不能将缺失文件报告为释放空间。\n\n入口：`bin/va.ps1 maintain RUN`、`bin/va.ps1 maintain RUN --close`；MCP 为 `localizer_maintain`。回执留在 state，即使 run 删除仍可复查。维护脚本不得递归清空整个 work/outputs/media/state。\n\n## 源解析与素材复用\n\n`analyze` 按完整源 SHA256、抽帧参数、分段上限和解析版本查找快照，命中后核验源解析资产。已有 inventory 不覆盖；源观察仍需确认覆盖，新语言重新定稿、配音、时轴、字层和审核。`source-save RUN` 显式保存观察，`source-find SHA256` 查询。\n\n同源底片和语言素材由交付库单独管理；`library-find SHA256` 显示 expired 时不能从哈希恢复文件。重新编码文件当前不视为精确同源。缓存只复用机械结果，失效规则见 [缓存与恢复](../../docs/workflow-optimization.md)。\n\n## 删除一个 run\n\n```powershell\nbin/va.ps1 run-preserve RUN\nbin/va.ps1 run-delete RUN\n# 仅在用户授权范围内，使用本次 ready 预览的完整指纹\nbin/va.ps1 run-delete RUN --execute --expect 完整指纹\n```\n\n保全冻结源状态、观察、决定和账本，建立独立候选案例及 inbox；已有成片时保留原技术状态的交付包，原片另存恢复包。未启用观察不会因此成为正式规则。\n\n删除要求当前内容与保全指纹一致、知识审计通过、独立包及必要文件完整、任务终结、费用明确且没有活动锁。每次只处理一个明确 run；不存在 force 绕过。删除失败保留 deleting 回执和恢复包，检查后恢复处理。保全会占用持久空间，删除 run 不代表删除 media、outputs、state 或全部源素材。\n\n费用门禁同时读任务与请求总账。失败、超时、无 taskId 或无 billing 字段均不证明未扣费；有估算/预留而实际费用未知时阻止删除。只有有依据的数值零费用与未知不同。任务文件缺失也不能释放总账中的未知预留。\n\n## 清理旧比较图和旧视频\n\n`run-prune` 在正常保全与删除预览之后，只处理未被当前成品/底片使用的过时比较图。保留原始观察、明确失败与代表性图片、脚本、配方、账本和当前完整审核；缺失必要失败证据会阻止清理。\n\n```powershell\nbin/va.ps1 run-preserve RUN\nbin/va.ps1 run-delete RUN\nbin/va.ps1 run-prune RUN\nbin/va.ps1 run-prune RUN --execute --expect 完整预览指纹\n```\n\n旧完整视频采用 [选择清单](../templates/prune-versions-example.json) 明确指定：\n\n```powershell\nbin/va.ps1 run-preserve RUN\nbin/va.ps1 run-prune-versions RUN inputs/prune-versions.json\nbin/va.ps1 run-prune-versions RUN inputs/prune-versions.json --execute --expect 完整预览指纹\n```\n\n执行先建立并核验独立 `knowledge/local/retired-versions/` 证据，再删除所选视频。当前计划、候选、交付、任务和其他 run 引用的资产受保护；重任务锁、未知费用、内容变化或证据缺失都会拒绝。运动/声音问题需保留连续或声音证据，单图不足时保留整段。\n\n部分清理后旧 manifest 仍保留历史原文，但缺图的历史审核不再是完整可复用证据。清理改变内容后重新保全，旧指纹失效。历史脚本以数据保留，不执行其旧审核结论。\n\n## 知识与质量异议\n\n必要知识证据由案例 manifest 声明，旧路径仅是来源标签。`knowledge-evidence` 可追加不可变补证；`knowledge-audit` 检查正文、哈希、scope 和必要证据。精简案例支持理解方法，不承诺逐帧重放整支生产视频。\n\n质量异议独立保存在 `knowledge/local/quality-holds/`，删除 run 或交付包不会撤销否决。迁移历史客户素材时一并迁移相关异议；只复制旧交付包不能证明其当前可用于制作。详见 [质量反馈](../workflows/quality-feedback.md)。\n\n## 恢复与迁移\n\n`archive RUN` 创建交付包，`archive-verify PACKAGE` 核验，`archive-restore PACKAGE --id NEW` 恢复历史工作副本。恢复不等于新语种验收。\n\n全新部署只导出公共源码和知识，见 [干净导出](../../docs/project-layout.md)。迁移既有业务还须带上需要的私有知识及索引、质量异议、账本、检查点、源解析、交付包和未完成现场；凭据和安装资产分别配置。项目 Hook 的首次 baseline 和调度见 [每日提纯](../../docs/daily-knowledge-curation.md)。\n\n任何清理均按实际阻塞清单报告已删与保留，不为追求空目录绕过门禁。一次用户明确授权的历史重置不构成日后自动清空规则。\n\n## 按需求名组织交付目录（2026-10-26 用户要求）\n\n交付一级目录使用明确需求名，通常为原视频文件名去掉扩展名；结构为 `outputs/<需求名>/<语言>/<版本>/`。实际源 SHA256 仍是身份依据。当前映射登记于 `state/delivery-folders.json`，归档器按映射续写，未登记的旧来源保持哈希路径兼容；新需求先核实名称并登记，同名不同源须明确区分，不能合并覆盖。改名同步 catalog 和当前展示链接，保留迁移映射及旧索引；包内不可变 manifest、源片和审核证据不改写。`reports` 与索引文件是公共入口，不是视频需求目录。\n","lines":92,"sha256":"6cf26779da04ecf5479f11e7fde9f50ebfe53ad8f90427682f1e8711d8ce0b1e"},{"path":"docs/storage-policy.md","text":"# 存储上限与保留策略\n\n推荐“精简保留内容 + 数量/容量双上限 + 最低剩余空间”，不推荐完整临时现场永久累积。2026-10-20 的本批任务已发生磁盘不足导致归档中断；任务数不能代表占用，多个语言的准备层、逐帧图片、透明视频及 ZIP 都会放大空间。\n\n本轮实现配置和只读预览，尚未实现自动压缩、删除交付包或后台清理。超限是需要处理的信号，不是可以突破知识、复用、账本和正在运行任务保护的授权。不会因超限降低画质、改配音、减少审核或取消知识证据。\n\n## 当前可调配置\n\n默认值在 `config/storage-policy.json`；个人设置写 `config/storage-policy.local.json`，不会带入公开部署包。\n\n| 区域 | 建议数量上限 | 容量上限 | 计数方式 |\n| --- | ---: | ---: | --- |\n| runs | 20 | 8 GiB | 每个目标语言的独立 run，含未完成任务 |\n| outputs | 100 | 20 GiB | 索引中实际存在的独立交付/复用包；所有文件都计入容量 |\n| media | 50 | 5 GiB | 源哈希目录；容量包含源解析快照 |\n\n最低剩余空间默认 5 GiB。这些是可调的预警值，并不是本机一定可以容纳的配额；磁盘小的用户应降低容量或迁移素材盘。`0` 表示关闭对应上限。永久知识与未结清账本不参与数量淘汰。\n\n```powershell\n.\\bin\\va.ps1 storage-policy show\n.\\bin\\va.ps1 storage-policy set --area runs --max-count 10 --max-gib 4\n.\\bin\\va.ps1 storage-policy set --area outputs --max-count 60 --max-gib 12\n.\\bin\\va.ps1 storage-policy set --area media --max-count 30 --max-gib 3\n.\\bin\\va.ps1 storage-policy set --minimum-free-gib 3\n.\\bin\\va.ps1 storage-plan\n```\n\n跨平台使用 `python bin/va.py` 加相同参数。可在个人 JSON 设置 `pinned_runs`、`pinned_sources` 数组，固定保留指定任务或源。预览列出运行锁、未终结模型任务、未知账单、缺少质量结果等阻塞；即使无阻塞，仍需确认对话已结束并通过已有 `run-preserve → run-delete` 门禁。预览不会计算可安全释放的承诺值。\n\n## 后续精简的内容边界\n\n| 内容 | 建议生命周期 | 保留/删除条件 |\n| --- | --- | --- |\n| 正在制作的 run | 完整保留 | 不按年龄、数量猜测任务完成 |\n| 已结案 run 的草稿、全量抽帧、失效渲染 | 短期调试 | 先检查实际依赖和独立归档；过门禁后清理现场 |\n| 最终成片、定稿、语言音轨、排版与复用依赖 | 较长期交付包 | 保留原字节、哈希及恢复能力，不重编码压缩替代 |\n| 同源解析、无字底片、背景轨 | 按源共享 | 新语言仍使用；任何有效包或任务引用时禁止删除 |\n| ZIP、预览下载副本 | 短期/按需生成 | 先确认不是唯一成片或唯一未通过候选 |\n| 知识规则、精选正反例和实际证据 | 长期 | 去重/提纯需保留来源和可验证依赖；不按 run 数淘汰 |\n| 未结清请求与账本 | 结清前保护 | 未获计费回执不改成零、不因空间不足删除 |\n\n最终交付和复用包需要较大的保存上限，工作现场可以较小。当前包已按依赖收集必要素材，但同源跨语言仍复制部分准备资产。下一阶段可以引入带引用计数的不可变共享素材库，让一份源片/底片服务多个语言包；必须先具备事务发布、并发控制、引用验证、垃圾回收与迁移恢复测试。\n\n**能力与存储的边界**：删除可重建草稿可以不改变已交付视频的字节和质量；删除最后一份底片/源解析，会降低以后同源翻译速度；删除最后一份成片，会失去历史下载。希望这些用途完全保留时，容量达到上限应扩容或迁移到其他磁盘/对象存储，而不是自动删除。任何有限空间都不能无限保留全部历史。\n\n## 发布前迭代目标\n\n1. 完成依赖闭包核验后的工作现场精简，避免保全时再次全量复制而占满盘。\n2. 下载包统一登记生命周期，防止散落 ZIP、预览副本绕过上限。\n3. 新任务按源时长、分辨率、语言数预估峰值临时空间；不足时先整理或迁移，不能开始付费后才发现归档失败。\n4. 自动清理必须支持预览指纹、固定保留、未结清保护、原子执行和中断恢复。输出过期需明确选择影响，不能默认破坏复用。\n5. Windows/Linux 的依赖、字体和模型缓存固定版本，验证独立部署；当前配置/CLI 可迁移不等于云端已验收。\n","lines":52,"sha256":"3c304082db715699aabac213bdd8593c3f19851e687502e00bd0010eab738cc4"},{"path":"docs/tools-and-locations.md","text":"# 工具、模型和文件位置\n\n路径相对于项目根目录。使用 `bin/setup.ps1` 安装，运行 `bin/va.ps1 doctor` 核对实际位置。模型和依赖属于安装资产，`work/` 只放可重建缓存与临时工作。\n\n| 能力 | 正式入口/实现 | 安装资产或结果 |\n| --- | --- | --- |\n| Python / CLI / MCP | `bin/va.ps1`、`bin/va.py`、`bin/mcp_server.py` | `.venv/`；基础 Python 在 `.runtime/python/` |\n| FFmpeg / ffprobe | `media.py`、合成与采证模块 | `.runtime/ffmpeg/bin/` |\n| Codex 识字/图片编辑 | `codex-packet`、`codex-result`；兼容 `bin/ocr.py` | 宿主图片能力；run 的 `analysis/codex/` 记录 |\n| Whisper small ASR，含 VAD | `asr RUN`、兼容 `bin/asr.py` | `.runtime/deps/asr/`、`.runtime/models/asr/small/` |\n| UVR 分轨 | `bin/separate_local_audio.py` | `.runtime/deps/separation/`、`.runtime/models/separation/` |\n| 历史本地声音 | `local-tts` 仅复用完整既有结果 | 旧 `.runtime/models/tts/` 和实际声音保留；新声音用 Gemini TTS |\n| KIE 配音/视频/声音分析 | `tts-packet`、`model-task`、`submit`、`poll`、`audio-analyze` | 远端服务；任务和费用保存于项目账本 |\n| 本地混音 | `audio-mix RUN`、`local_audio.py` | run 中版本化声音、配方和哈希 |\n| 本地图片/帧工具 | `repair-preflight`、`repair-run`、`repair-reconcile` | OpenCV 在 `.runtime/deps/vision/`；LaMa 新推理停用 |\n| 文字层与合成 | `layout.py`、`compositor.py`、`surface.py` | `assets/fonts/`；目标字层逐实例核验 |\n| 视觉/字幕检查 | `visual-evidence`、`visual-pages`、`visual-review`、`caption-check` | run 的实际哈希证据；展示不等于已审 |\n| 恢复和批次 | `work-packet`、`production`、`batch-run` | run 状态、`state/batches/` |\n| 最终必须输出 | `compose-best RUN`、`finalize RUN SPEC` | 完整翻译视频及瑕疵说明；根 outputs 标记已输出/有瑕疵，保留原质量结果 |\n| 成片前失败 | `close-failure RUN SPEC` | 独立案例与候选，不虚构最终片 |\n| 知识、交付与保全 | `knowledge-audit`、`deliver`、`archive-verify`、`run-preserve` | `knowledge/`、`outputs/`、`media/`、`state/` |\n| 项目知识 Hook | `bin/project-hooks.ps1`、`hooks` | 项目提示、配置和检查点；只生成候选 |\n\n配音与失败结案的完整步骤见 [本地制作入口](../agent/workflows/local-production.md)。\n\n安装器按 `config/model-routing.json` 安装 Whisper small 与 UVR，拒绝清单之外的模型；`bin/install_dependencies.py --plan` 只展示经过校验的安装计划。图像依赖清单只有 `vision.txt`，ONNX Runtime 保留在音频依赖中用于 ASR/VAD，不代表启用了 OCR。\n\n历史本地声音注册表只保留身份、来源和文件哈希，供核验现有声音。旧声音安装入口已移除；缺失、改稿或参数变化时使用 Gemini TTS，不补下载旧声音包，也不重新启动 Piper。实际声音仍需经过混音与字幕同步检查。\n\n配方字段见 [修复配方](../agent/workflows/repair-recipes.md)，缓存边界见 [执行恢复](workflow-optimization.md)。一次性脚本中的坐标和审核结论不作为正式工具默认值。新源码不携带本机模型、声音包、字体、密钥或自动授权。\n","lines":30,"sha256":"976c1e250649911e3b2234309f09e71f9b4f2a28cbc30a5d3924d66e6787fb5e"},{"path":"agent/workflows/visual-review.md","text":"# 逐实例视觉证据与放行\n\n本流程是 strict 的完整逐实例门禁；fast 采用 [模式分支](../../knowledge/rules/neutral-visual-and-animation-gate-v4.md) 的共同要求及基本审核，风险区域可按需使用此工具补证。进入本流程生成的 pending 仍须真实审核，不因 fast
