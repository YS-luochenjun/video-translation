'], 'engine': engine,\n                         'model': voice['model'], 'tokens': voice['tokens'], 'data': voice['data'],\n                         'implementation': file_hash(__file__), 'text': text, 'speed': speed, 'speaker_id': speaker}\n            asset, reused = _take(run, signature, voice)\n            lines.append({'id': speech['id'], 'target_text': text, 'voice': asset, 'reused': reused})\n        require(file_hash(inventory_path) == inventory_hash, 'Speech inventory changed during local TTS')\n        require(file_hash(inside(run, source['source'])) == source['source_sha256'], 'Source changed during local TTS')\n    return {'lines': lines, 'state': 'needs_review', 'approved_for_reuse': False,\n            'scope': 'Use these hash-bound voice takes in narration-plan; no automatic timing, mixing or acceptance.'}\n","lines":95,"sha256":"c9cefe2baf0e9318c80d3135f248c38ea40a2c47a267fb67fa3d981bb1ec0bc4"},{"path":"src/video_localizer/model_tasks.py","text":"\"\"\"Journaled, source-bound KIE audio tasks and small diagnostic video probes.\"\"\"\nfrom __future__ import annotations\n\nimport copy\nfrom pathlib import Path\nfrom urllib.parse import unquote, urlparse\n\nfrom . import audio, media\nfrom .common import file_hash, guarded, inside, lock, object_hash, read_json, require, require_number, utc_now, write_json\nfrom .kie import ApiError, KieClient, download\n\nVIDEO_MODELS = ('wan/2-7-videoedit', 'bytedance/seedance-2-fast', 'wan/2-6-flash-video-to-video', 'bytedance/seedance-2-mini')\nGEMINI_TTS_MODELS = ('google/gemini-2-5-pro-tts', 'google/gemini-3-1-flash-tts', 'google/gemini-3-8-flash-lite-tts')\n\n\ndef _reference_image(path):\n    from PIL import Image\n    try:\n        with Image.open(path) as image:\n            require(image.format in ('PNG', 'JPEG', 'WEBP') and not getattr(image, 'is_animated', False),\n                    'Video task reference must be a static PNG, JPEG or WebP image')\n            require(image.width > 0 and image.height > 0, 'Reference image dimensions must be positive')\n            image.verify()\n        with Image.open(path) as image:\n            image.load()\n    except (OSError, ValueError, SyntaxError):\n        require(False, 'Video task reference image cannot be decoded')\n\n\ndef packet(run, relative):\n    from .workflow import source_path\n    data = read_json(inside(run, relative))\n    require(data.get('source_sha256') == file_hash(source_path(run)), 'Audio task source binding mismatch')\n    require(bool(data.get('purpose')), 'Audio task needs an explicit purpose')\n    require_number(data.get('estimated_credits'), 'Audio task estimate', minimum=0.01, maximum=10000)\n    payload = data.get('payload', {})\n    inputs = payload.get('input', {})\n    model = payload.get('model')\n    video_model = model in VIDEO_MODELS\n    require(video_model or model in (*GEMINI_TTS_MODELS, 'ai-music-api/separate-vocals', 'elevenlabs/text-to-speech-multilingual-v2', 'elevenlabs/text-to-dialogue-v3', 'elevenlabs/text-to-speech-turbo-2-5'), 'Unsupported model task')\n    require(set(payload) == {'model', 'input'}, 'Unexpected audio task payload fields')\n    if video_model:\n        require(isinstance(inputs.get('prompt'), str) and 0 < len(inputs['prompt']) <= 5000, 'Video probe needs a bounded prompt')\n        require('video' in data.get('assets', {}) and data.get('source_interval') and len(data['source_interval']) == 2, 'Video probe needs a source interval and clip')\n        start, end = data['source_interval']\n        require(0 <= start < end and end - start <= 10, 'Diagnostic video probe interval must be at most 10s')\n        if model == 'wan/2-6-flash-video-to-video':\n            duration=inputs.get('duration')\n            require(duration in ('5','10') and abs(end-start-int(duration))<=.15,'Wan Flash probe needs its actual 5/10s interval')\n            require(inputs.get('video_urls')==['ASSET:video'] and inputs.get('audio') is False\n                    and inputs.get('resolution')=='720p' and inputs.get('multi_shots') is False,'Low-cost Wan Flash probe requires one source video, silent 720p and no new shots')\n            require(len(inputs['prompt'])<=1500 and data['estimated_credits']>=int(duration)*4,'Wan Flash prompt/price reservation invalid')\n        elif model == 'wan/2-7-videoedit':\n            require(inputs.get('video_url') == 'ASSET:video' and inputs.get('audio_setting') == 'origin' and inputs.get('prompt_extend') is False, 'Visual diagnostic probe must keep source audio and exact prompt')\n            if inputs.get('reference_image') == 'ASSET:image':\n                require('image' in data.get('assets', {}), 'Reference image needs a bound image asset')\n        else:\n            require(inputs.get('reference_video_urls') == ['ASSET:video'] and inputs.get('generate_audio') is False, 'Seedance visual probe requires an explicit source video and no generated audio')\n    elif model == 'ai-music-api/separate-vocals':\n        require(set(inputs) <= {'audio_url', 'type', 'stem_name'} and inputs.get('audio_url') == 'ASSET:audio', 'Separation requires a bound uploaded audio file')\n        require(inputs.get('type') in ('separate_vocal', 'split_stem', 'split_stem_advanced'), 'Unknown separation type')\n        require(inputs.get('type') != 'split_stem_advanced' or bool(inputs.get('stem_name')), 'Advanced separation needs a stem')\n    elif model == 'elevenlabs/text-to-speech-turbo-2-5':\n        from .model_routing import require_remote_task\n        require_remote_task(model, run=run, authorization=data.get('model_authorization'))\n        require(set(inputs) <= {'text', 'voice', 'stability', 'similarity_boost', 'style', 'speed',\n                                'timestamps', 'previous_text', 'next_text', 'language_code'},\n                'Unsupported ElevenLabs Turbo input field')\n        require(isinstance(inputs.get('text'), str) and bool(inputs['text'].strip())\n                and len(inputs['text']) <= 5000 and bool(inputs.get('voice')),\n                'ElevenLabs Turbo needs bounded exact text and an explicit voice')\n        request = read_json(run / 'inputs/request.json')\n        require(inputs.get('language_code') == request['target_language'],\n                'ElevenLabs Turbo language must match the target request')\n        characters = len(inputs['text'].encode('utf-16-le')) // 2\n        require(data['estimated_credits'] >= characters * .006,\n                'Reserve the documented ElevenLabs Turbo character price')\n        for key in ('stability', 'similarity_boost', 'style'):\n            if key in inputs:\n                require_number(inputs[key], 'ElevenLabs ' + key, minimum=0, maximum=1)\n        if 'speed' in inputs:\n            require_number(inputs['speed'], 'ElevenLabs speed', minimum=.7, maximum=1.2)\n        if 'timestamps' in inputs:\n            require(isinstance(inputs['timestamps'], bool), 'ElevenLabs timestamps must be boolean')\n    elif model == 'elevenlabs/text-to-dialogue-v3':\n        from .model_routing import require_remote_task\n        require_remote_task(model, run=run, authorization=data.get('model_authorization'))\n        require(set(inputs) <= {'dialogue', 'stability', 'language_code'}, 'Unsupported ElevenLabs V3 input field')\n        dialogue = inputs.get('dialogue')\n        require(isinstance(dialogue, list) and bool(dialogue) and all(\n            isinstance(turn, dict) and set(turn) == {'text', 'voice'}\n            and isinstance(turn['text'], str) and turn['text'].strip()\n            and isinstance(turn['voice'], str) and turn['voice'].strip() for turn in dialogue),\n            'ElevenLabs V3 needs exact dialogue text and explicit voices')\n        characters = sum(len(turn['text'].encode('utf-16-le')) // 2 for turn in dialogue)\n        require(characters <= 5000, 'ElevenLabs V3 dialogue exceeds 5000 characters')\n        require(data['estimated_credits'] >= characters * .014, 'Reserve the documented ElevenLabs V3 character price')\n        if 'stability' in inputs:\n            require_number(inputs['stability'], 'ElevenLabs stability', minimum=0, maximum=1)\n    elif model in GEMINI_TTS_MODELS:\n        modern = model == 'google/gemini-3-8-flash-lite-tts'\n        if model != 'google/gemini-2-5-pro-tts':\n            from .model_routing import require_remote_task\n            require_remote_task(model, run=run, authorization=data.get('model_authorization'))\n        allowed = ({'speakers', 'dialogue_turns', 'temperature', 'filler_words'} if modern\n                   else {'speakers', 'dialogue_turns', 'scene', 'temperature', 'sample_context'})\n        require(set(inputs) <= allowed,\n                'Unsupported Gemini TTS input field; use tts-packet instead of guessing provider parameters')\n        if modern:\n            require(1 <= len(inputs.get('speakers', [])) <= 2, 'Gemini 3.8 supports one or two speakers')\n            require(inputs.get('filler_words', False) is False, 'Exact-copy localization forbids generated filler words')\n            require_number(inputs.get('temperature', 1), 'Gemini temperature', minimum=0, maximum=2)\n            require(all(set(turn) <= {'speaker_id', 'text', 'style'}\n                        and isinstance(turn.get('text'), str) and 0 < len(turn['text']) <= 10000\n                        and ('style' not in turn or isinstance(turn['style'], str))\n                        for turn in inputs.get('dialogue_turns', [])), 'Invalid Gemini 3.8 dialogue turn')\n        require(bool(inputs.get('speakers')) and bool(inputs.get('dialogue_turns')), 'Gemini TTS needs speaker configuration and lines')\n        require(all(isinstance(s, dict) and set(s) <= {'speaker_id', 'voice_name', 'audio_profile', 'accent', 'style', 'pace'}\n                    and isinstance(s.get('voice_name'), str) and s['voice_name'].strip()\n                    for s in inputs['speakers']), 'Gemini TTS needs explicit voice_name and documented speaker fields')\n        # Optional delivery controls remain available. Their provider enums must be\n        # verified before submission; the local shape check does not invent enums.\n        require(all(isinstance(s[key], str) and s[key].strip() for s in inputs['speakers']\n                    for key in ('audio_profile', 'accent', 'style', 'pace') if key in s),\n                'Gemini speaker controls must be nonempty strings')\n        speakers = {speaker.get('speaker_id') for speaker in inputs['speakers']}\n        require(len(speakers) == len(inputs['speakers']), 'Duplicate Gemini TTS speaker')\n        import re\n        require(all(isinstance(speaker, str) and re.fullmatch(r'Speaker [1-9][0-9]*', speaker) for speaker in speakers), 'Gemini speaker_id must use Speaker N format')\n        require(all(turn.get('speaker_id') in speakers and turn.get('text') for turn in inputs['dialogue_turns']), 'Unbound Gemini TTS speaker or text')\n    else:\n        require(isinstance(inputs.get('text'), str) and bool(inputs['text'].strip()) and len(inputs['text']) <= 10000, 'TTS text missing or too long')\n        require(inputs.get('voice') and inputs.get('language_code') == 'zh', 'This TTS route needs an explicit voice and Chinese language')\n    if model in (*GEMINI_TTS_MODELS, 'elevenlabs/text-to-speech-multilingual-v2', 'elevenlabs/text-to-dialogue-v3', 'elevenlabs/text-to-speech-turbo-2-5'):\n        from .captions import normalized, validate_spoken_copy\n        inventory = read_json(run / 'analysis/inventory.json')\n        ids = data.get('speech_ids', [])\n        require(isinstance(ids, list) and bool(ids) and len(ids) == len(set(ids)), 'TTS needs ordered unique speech_ids from the final script')\n        speeches = {item['id']: item for item in inventory.get('speech_segments', [])}\n        require(all(key in speeches for key in ids), 'TTS speech_ids not found in final script')\n        actual_text = (''.join(turn['text'] for turn in inputs['dialogue_turns']) if model in GEMINI_TTS_MODELS\n                       else ''.join(turn['text'] for turn in inputs['dialogue']) if model == 'elevenlabs/text-to-dialogue-v3'\n                       else inputs['text'])\n        require(normalized(actual_text) == normalized(''.join(speeches[key]['target_text'] for key in ids)),\n                'TTS copy differs from final speech script')\n        validate_spoken_copy(inventory, [speeches[key] for key in ids])\n    for name, asset in data.get('assets', {}).items():\n        path = inside(run, asset['path'])\n        require(path.is_file() and file_hash(path) == asset['sha256'], 'Audio task asset missing or changed')\n        if video_model and name == 'video':\n            meta = media.probe(path)\n            require(abs(meta['duration'] - (data['source_interval'][1]-data['source_interval'][0])) <= .15, 'Video probe clip duration differs from interval')\n        elif video_model:\n            require(model == 'wan/2-7-videoedit' and name == 'image'\n                    and inputs.get('reference_image') == 'ASSET:image',\n                    'Video task has an unsupported or unbound reference asset')\n            _reference_image(path)\n        else:\n            require(audio.inspect(path)[0]['has_track'], 'Audio task asset has no audio')\n    if model == 'ai-music-api/separate-vocals':\n        require('audio' in data.get('assets', {}), 'Missing separation source audio')\n    if video_model and (data.get('model_authorization') or model == 'bytedance/seedance-2-mini'):\n        from .video_tests import check_packet\n        check_packet(run, data)\n    return data\n\n\ndef _authorized_rate_limit_retry(run, job):\n    \"\"\"An explicit 429 rejection has no accepted task; keep its old cost reservation.\"\"\"\n    request_path = run / 'inputs/request.json'\n    grant = read_json(request_path).get('provider_retry_authorization', {}) if request_path.exists() else {}\n    return (grant.get('allow_explicit_429') is True and bool(grant.get('authorization_ref'))\n            and bool(grant.get('source_quote')) and job.get('state') == 'failed'\n            and not job.get('task_id') and str(job.get('error', '')).startswith('KIE code 429:'))\n\n\n@guarded\ndef submit(run, relative, client=None, retry_failed=False):\n    from .workflow import execution_limits, reserved_credits\n    data = packet(run, relative)\n    digest = object_hash(data)\n    original = digest\n    retry_attempt = 0\n    if retry_failed:\n        # Follow the recorded chain instead of repeatedly returning a failed\n        # first retry. Active/ambiguous attempts are reused, never duplicated.\n        for retry_attempt in range(1, min(2, execution_limits(run)['max_revision_rounds']) + 1):\n            failed = read_json(run / 'jobs' / (original + '.json'))\n            require((failed.get('state') in ('fail', 'failed') and failed.get('task_id') and failed.get('credits_consumed') == 0)\n                    or _authorized_rate_limit_retry(run, failed),\n                    'Retry requires a known terminal zero-cost provider failure')\n            digest = object_hash({'packet': data, 'retry_of': original})\n            previous_retry = run / 'jobs' / (digest + '.json')\n            if not previous_retry.exists():\n                break\n            saved = read_json(previous_retry)\n            if saved.get('state') not in ('fail', 'failed') or (not saved.get('task_id') and not _authorized_rate_limit_retry(run, saved)):\n                break\n            original = digest\n        else:\n            require(False, 'Audio task retry limit reached; preserve all attempts')\n    path = run / 'jobs' / (digest + '.json')\n    client = client or KieClient()\n    with lock(run / 'jobs/.submit.lock'):\n        if path.exists():\n            saved = read_json(path)\n            if saved['state'] == 'failed' and not saved.get('task_id'):\n                from .budgets import resume_undispatched\n                resume_undispatched(run, digest)\n                return _resume_undispatched(run, data, saved, path, client)\n            return {'job': digest, 'state': saved['state'], 'task_id': saved.get('task_id'), 'reused': True}\n        from .model_routing import require_remote_task\n        require_remote_task(data['payload']['model'], run=run, authorization=data.get('model_authorization'))\n        if data['payload']['model'] in VIDEO_MODELS:\n            from .cost import check_new_video_task\n            check_new_video_task(data['payload']['model'], data['estimated_credits'],\n                                 run=run, authorization=data.get('model_authorization'))\n        limits = execution_limits(run)\n        jobs = [read_json(p) for p in (run / 'jobs').glob('*.json')]\n        require(len(jobs) < limits['max_paid_jobs_per_run'], 'Paid job budget reached')\n        require(sum(reserved_credits(job, limits['max_estimated_credits_per_run']) for job in jobs) + data['estimated_credits'] <= limits['max_estimated_credits_per_run'], 'Estimated credit budget reached')\n        from .batches import reserve\n        batch_budget = reserve(run, digest, data['estimated_credits'])\n        job = {'id': digest, 'kind': 'audio_task', 'plan_id': 'audio:' + digest[:16], 'segment': 'audio-model',\n               'packet': relative, 'packet_sha256': digest, 'source_sha256': data['source_sha256'],\n               'model': data['payload']['model'], 'purpose': data['purpose'], 'state': 'preparing',\n               'estimated_credits': data['estimated_credits'], 'created_at': utc_now(), 'credits_before': None,\n               'task_result_kind': 'video' if data['payload']['model'] in VIDEO_MODELS else 'audio',\n               'execution_limits': {key: limits[key] for key in ('max_paid_jobs_per_run', 'max_estimated_credits_per_run')}}\n        job['batch_budget'] = batch_budget\n        if data.get('model_authorization'):\n            job['model_authorization'] = data['model_authorization']\n        if retry_failed:\n            job['retry_of'] = original\n            job['retry_attempt'] = retry_attempt\n            job['retry_reason'] = ('Explicit user-authorized identical-packet retry after provider 429 rejection; '\n                                   'prior billing reservation retained, at most two rounds'\n                                   if _authorized_rate_limit_retry(run, failed) else\n                                   'Explicit identical-packet retry after known zero-cost terminal provider failure; at most two rounds')\n        write_json(path, job)\n        try:\n            job['credits_before'] = client.credits()\n            write_json(path, job)\n            uploaded = {}\n            for name, asset in data.get('assets', {}).items():\n                uploaded[name] = client.upload(inside(run, asset['path']))\n            payload = copy.deepcopy(data['payload'])\n            for key, value in payload['input'].items():\n                if isinstance(value, str) and value.startswith('ASSET:'):\n                    payload['input'][key] = uploaded[value.split(':', 1)[1]]\n                elif isinstance(value, list):\n                    payload['input'][key] = [uploaded[v.split(':', 1)[1]] if isinstance(v, str) and v.startswith('ASSET:') else v for v in value]\n            job['state'] = 'submitting'\n            write_json(path, job)\n            job['task_id'] = (client.create(payload, run=run, model_authorization=data['model_authorization'])\n                              if data.get('model_authorization') else client.create(payload))\n            job['state'] = 'submitted'\n        except ApiError as exc:\n            job['state'] = 'ambiguous' if exc.ambiguous and job['state'] == 'submitting' else 'failed'\n            job['error'] = str(exc)\n            write_json(path, job)\n            raise\n        except Exception:\n            job['state'] = 'ambiguous' if job['state'] == 'submitting' else 'failed'\n            job['error'] = 'Local audio task failure; inspect journal before retry'\n            write_json(path, job)\n            raise\n        write_json(path, job)\n    return {'job': digest, 'state': job['state'], 'task_id': job['task_id']}\n\n\ndef _resume_undispatched(run, data, job, path, client):\n    # The request ledger proves no charged POST was attempted. Keep its identity,\n    # budget reservation and failure history rather than minting another job.\n    require(not data.get('assets'), 'Asset-bearing failures require explicit upload recovery')\n    job.setdefault('recovery_history', []).append({'at': utc_now(), 'previous_error': job.get('error'),\n                                                  'basis': 'request ledger has no dispatch'})\n    try:\n        job['credits_before'] = client.credits()\n        job['state'] = 'submitting'\n        write_json(path, job)\n        job['task_id'] = (client.create(data['payload'], run=run, model_authorization=data['model_authorization'])\n                          if data.get('model_authorization') else client.create(data['payload']))\n        job['state'] = 'submitted'\n        job.pop('error', None)\n    except ApiError as exc:\n        job['state'] = 'ambiguous' if exc.ambiguous and job['state'] == 'submitting' else 'failed'\n        job['error'] = str(exc)\n        write_json(path, job)\n        raise\n    write_json(path, job)\n    return {'job': job['id'], 'state': job['state'], 'task_id': job['task_id'], 'resumed_before_dispatch': True}\n\n\n@guarded\ndef collect(run, job, urls):\n    \"\"\"Keep every returned stem, its original name, signal report and content hash.\"\"\"\n    records = []\n    for index, url in enumerate(urls):\n        name = unquote(Path(urlparse(url).path).name)\n        suffix = Path(name).suffix.lower()\n        require(suffix in ('.mp3', '.wav', '.m4a', '.flac', '.ogg', '.aac', '.json'), 'Unexpected audio result type')\n        destination = run / 'outputs/audio-models' / job['id'] / f'{index:02d}{suffix}'\n        if not destination.exists():\n            download(url, destination)\n        record = {'path': destination.relative_to(run).as_posix(), 'sha256': file_hash(destination), 'provider_name': name}\n        if suffix == '.json':\n            require(isinstance(read_json(destination), (dict, list)), 'Invalid TTS alignment JSON')\n        else:\n            report, _ = audio.inspect(destination)\n            require(report['has_track'] and report['audible_signal'], 'Audio model result is missing or silent')\n            record['signal'] = report\n        records.append(record)\n    require(any('signal' in record for record in records), 'No audio result returned')\n    manifest = run / 'outputs/audio-models' / job['id'] / 'manifest.json'\n    write_json(manifest, {'task_id': job['task_id'], 'source_sha256': job['source_sha256'], 'model': job['model'], 'results': records})\n    first = next(record for record in records if 'signal' in record)\n    job.update({'result': first['path'], 'result_sha256': first['sha256'], 'results': records,\n                'result_manifest': manifest.relative_to(run).as_posix(), 'result_manifest_sha256': file_hash(manifest)})\n","lines":319,"sha256":"b3c197d8707bf503c8617a37c1cd290d431e97006543e849a6b88af3164cf578"},{"path":"src/video_localizer/ocr_supplement.py","text":"\"\"\"Read-only historical GLM evidence. No network or inference path.\"\"\"\nfrom .common import WorkflowError, read_json, require\n\ndef context(run, source_sha256):\n    path = run / 'analysis/ocr-supplement.json'\n    historical = None\n    if path.exists():\n        data = read_json(path)\n        require(data.get('source_sha256') == source_sha256, 'Historical OCR supplement source mismatch')\n        historical = 'analysis/ocr-supplement.json'\n    return {'status': 'retired', 'provider': 'codex', 'historical_evidence': historical,\n            'next': 'codex-packet RUN --stage recognize', 'automatic_pass': False}\n\ndef supplement(*args, **kwargs):\n    raise WorkflowError('GLM/RapidOCR inference is retired. Use Codex to inspect actual images via codex-packet.')\n","lines":15,"sha256":"995bd71bd82145906f1503622a38664e3554832cfb5c0e016d88b278ef502238"},{"path":"src/video_localizer/production.py","text":"\"\"\"Reusable local production steps. AI decisions and observed reviews stay explicit.\"\"\"\nfrom pathlib import Path\n\nfrom .common import (ROOT, WorkflowError, file_hash, guarded, inside,\n                     object_hash, read_json, require, write_json)\nfrom . import batches, workflow\n\n\ndef _fingerprint(run, plan):\n    # Conservative invalidation: final copy, source/voice assets, layout inputs,\n    # model results, encoder version and renderer code must still match.\n    from . import media\n    from .library import _bound_assets, _asset_closure\n    source = workflow.source_path(run)\n    require(file_hash(source) == plan['source_sha256'], 'Production source changed')\n    inventory = read_json(run / 'analysis/inventory.json')\n    roots = [(source, plan['source_sha256'])]\n    workspace_files = {}\n    for value in (plan, inventory):\n        for path, digest in _bound_assets(value):\n            if path.startswith(('knowledge/','assets/','config/')):\n                asset = inside(run.parent.parent,path)\n                require(asset.is_file() and file_hash(asset) == digest, 'Bound workspace dependency changed')\n                workspace_files['workspace/'+path] = digest\n            else:\n                roots.append((inside(run,path),digest))\n    dependencies = _asset_closure(run, roots)\n    files = {**workspace_files, **{name: file_hash(path) for name, path in dependencies.items()}}\n    jobs = []\n    model_segments = {s['id'] for s in plan.get('segments', [])\n                      if s.get('route') not in ('local_overlay', 'reference_composite', 'prepared_video')}\n    reused_jobs = {s['reused_model_job'] for s in plan.get('segments', []) if s.get('reused_model_job')}\n    for path in sorted((run / 'jobs').glob('*.json')):\n        job = read_json(path)\n        for asset in job.get('results', []) + ([{'path': job['result'], 'sha256': job['result_sha256']}] if job.get('result') else []):\n            require(file_hash(inside(run, asset['path'])) == asset['sha256'], 'Model result changed')\n        # Audio perception and billing receipts do not change rendered media.\n        # Bound TTS/mix assets are already in the verified dependency closure.\n        if job.get('id') in reused_jobs or (job.get('plan_id') == plan.get('id')\n                                             and job.get('segment') in model_segments):\n            jobs.append({key: job.get(key) for key in ('id', 'plan_id', 'segment', 'state', 'task_id',\n                          'packet_sha256', 'result', 'result_sha256', 'results')})\n    from .render_cache import implementation_signature\n    code = implementation_signature()\n    from .typography import selected, environment_identity\n    if any(selected(i) for i in inventory.get('text_instances', [])):\n        code['typography_environment'] = environment_identity(run.parent.parent)\n    from .font_environment import fingerprint as font_fingerprint\n    fonts = font_fingerprint(run.parent.parent)\n    return object_hash({'plan': plan, 'inputs': files, 'jobs': jobs, 'code': code, 'fonts': fonts,\n                        'encoder': media.command(['ffmpeg', '-version']).stdout})\n\n\n@guarded\ndef advance(run, deliver=False, force_render=False):\n    from .cli import capture\n    if deliver and (run / 'review/finalization.json').exists():\n        from .finalization import finish\n        result = finish(run)\n        return {'run': run.name, 'state': result['state'], 'delivery': result}\n    if (run / 'plan.json').exists() and read_json(run / 'plan.json').get('mode') == 'fast':\n        from . import fast_delivery\n        result = fast_delivery.quality(run)\n        return {'run': run.name, 'quality': result,\n                'state': 'delivered' if deliver and result['decision'] == 'pass' else\n                         'reviewed' if result['decision'] == 'pass' else 'needs_review',\n                **({'delivery': fast_delivery.deliver(run)} if deliver and result['decision'] == 'pass' else {})}\n    if not (run / 'analysis/inventory.json').exists():\n        workflow.analyze(run)\n        return {'run': run.name, 'state': 'needs_inventory', 'next': 'Inspect source evidence and complete inventory'}\n    # Preserve an explicitly chosen experiment/route. A stale plan requires the\n    # operator to re-plan; silently rebuilding could select a different algorithm.\n    if not (run / 'plan.json').exists():\n        workflow.build_plan(run)\n    plan = workflow.current_plan(run)\n    batches.gate(run, plan)\n    for segment in plan['segments']:\n        if segment.get('prepared_video'):\n            from .prepared import verify_for_production\n            verify_for_production(run, segment['prepared_video'], plan['source_sha256'])\n    fingerprint = _fingerprint(run, plan)\n    cache = run / 'outputs/production-checkpoint.json'\n    saved = read_json(cache) if cache.exists() else {}\n    candidate_path = run / 'outputs/candidate.json'\n    candidate = read_json(candidate_path) if candidate_path.exists() else {}\n    reusable = (not force_render and saved.get('fingerprint') == fingerprint\n                and not candidate.get('typography_fallbacks')\n                and candidate.get('plan_id') == plan['id'] and candidate.get('sha256') == saved.get('video_sha256')\n                and inside(run, candidate.get('path', 'missing')).is_file()\n                and file_hash(inside(run, candidate['path'])) == candidate['sha256'])\n    from .quality_holds import require_clear\n    if reusable:\n        require_clear(plan['source_sha256'], candidate['sha256'], run.parent.parent)\n    else:\n        if force_render:\n            workflow.render(run, force_segments=True)\n        else:\n            workflow.render(run)\n        candidate = read_json(candidate_path)\n        write_json(cache, {'fingerprint': fingerprint, 'video_sha256': candidate['sha256']})\n    from .visual_audit import generate\n    visual_evidence = generate(run)\n    capture(run)  # Include new actual caption observations, never copy a prior pass.\n    quality = workflow.quality(run)\n    result = {'run': run.name, 'render_reused': reusable, 'quality': quality, 'visual_evidence': visual_evidence,\n              'state': 'reviewed' if quality['decision'] == 'pass' else 'needs_review'}\n    if deliver and quality['decision'] == 'pass':\n        result['delivery'] = workflow.deliver(run)\n        result['state'] = 'delivered'\n    return result\n\n\ndef advance_batch(batch_id, deliver=False, root=ROOT):\n    record = read_json(batches._path(batch_id, root))\n    results = []\n    for name in record['members']:\n        run = Path(root) / 'runs' / name\n        try:\n            # Serial by default: no concurrent encoders competing for disk/memory.\n            result = advance(run, deliver=deliver)\n        except (WorkflowError, OSError, KeyError, ValueError) as exc:\n            results.append({'run': name, 'state': 'blocked', 'reason': str(exc)})\n            break\n        results.append(result)\n        if result['state'] not in ('reviewed', 'delivered'):\n            break\n        if name == record['pilot'] and not record.get('pilot_release'):\n            break  # batch-approve is an explicit review checkpoint, never auto-signed.\n    complete = len(results) == len(record['members']) and all(\n        row['state'] in ('reviewed', 'delivered') for row in results)\n    return {'batch': batch_id, 'results': results, 'state': 'completed' if complete else 'needs_attention',\n            'next': 'All members passed current quality checks' if complete else\n                    'Complete missing evidence; batch-approve after reviewing the pilot, then batch-run again'}\n\n\n@guarded\ndef tts_packet(run, voice, estimate, speech_ids=None):\n    from . import model_tasks\n    from .model_routing import selected as selected_model\n    inventory = read_json(run / 'analysis/inventory.json')\n    lines = inventory.get('speech_segments', [])\n    ids = speech_ids or [line['id'] for line in lines]\n    selected = {line['id']: line for line in lines}\n    require(ids and all(key in selected for key in ids), 'Select existing final speech segments')\n    locale = read_json(run / 'inputs/request.json')['target_language']\n    data = {'source_sha256': file_hash(workflow.source_path(run)),\n            'purpose': 'Narration from finalized speech copy; alignment and actual listening/review remain required',\n            'estimated_credits': estimate, 'speech_ids': ids,\n            'payload': {'model': selected_model('tts'), 'input': {\n                'speakers': [{'speaker_id': 'Speaker 1', 'voice_name': voice}],\n                'scene': (f'Read only the exact supplied dialogue in {locale}, in the given order. '\n                          'Preserve names, numbers and claims. Do not translate, paraphrase, omit, repeat, '\n                          'or speak instructions or speaker labels. Use clear natural advertising speech '\n                          'and finish every word. Voice only: no music, sound effects or extra speech.'),\n                'dialogue_turns': [{'speaker_id': 'Speaker 1', 'text': '\\n\\n'.join(selected[key]['target_text'] for key in ids)}]}}}\n    relative = 'inputs/tts-' + object_hash(data)[:16] + '.json'\n    write_json(run / relative, data)\n    model_tasks.packet(run, relative)\n    return {'packet': relative, 'paid_submission': False, 'next': 'Inspect model-task packet; submit only if the selected voice/style and budget fit the task'}\n","lines":159,"sha256":"9fc0efbec198d8c77d337f29954b4cd46938128c9e56bfe3fe3f558ddca3368c"},{"path":"src/video_localizer/repair.py","text":"\"\"\"Source-bound local repair recipes, risk probes and a durable trial budget.\"\"\"\nimport os\nimport subprocess\nimport sys\nimport time\nfrom pathlib import Path\n\nfrom . import media\nfrom . import repair_frames, repair_masks\nfrom .common import (CODE_ROOT, ROOT, file_hash, guarded, inside, object_hash, read_json,\n                     require, utc_now, write_json)\n\n\ndef preflight(run, detect_cuts=False):\n    inv = read_json(run / 'analysis/inventory.json')\n    meta = read_json(run / 'analysis/media.json')\n    events = {0.: {'start'}, meta['duration']: {'end'}}\n    def event(t, reason):\n        t = max(0., min(float(t), meta['duration']))\n        events.setdefault(t, set()).add(reason)\n    for shot in inv.get('shots', []):\n        event(shot['start'], 'shot_or_pose_cut'); event(shot['end'], 'shot_or_pose_cut')\n    if detect_cuts:\n        source = inside(run, read_json(run/'run.json')['source'])\n        key = object_hash({'source':file_hash(source),'detector':file_hash(Path(media.__file__))})\n        cache = run.parent.parent/'state/repair-preflight'/f'{key}.json'\n        points = read_json(cache) if cache.exists() else media.scene_points(source,meta['duration'])\n        if not cache.exists(): write_json(cache,points)\n        for point in points: event(point,'candidate_visual_cut_not_title_boundary')\n    if 'moving_watermark' in inv.get('content_features',[]):\n        event(0,'moving_watermark_full_frame_edges'); event(meta['duration'],'moving_watermark_full_frame_edges')\n    for item in inv.get('text_instances', []):\n        for t in item.get('source_interval', [item['start'], item['end']]):\n            event(t, 'source_text_boundary:'+item['id'])\n        for pose in item.get('trajectory', []):\n            event(pose['time'], 'trajectory_extreme_or_occlusion:'+item['id'])\n        if 'watermark' in item.get('text_role', '') or 'watermark' in item.get('action', ''):\n            event(item['start'], 'watermark_edge_entry:'+item['id'])\n            event(item['end'], 'watermark_edge_exit:'+item['id'])\n    fps = float(meta.get('fps', 30))\n    return {'source_sha256': read_json(run/'run.json')['source_sha256'],\n            'windows': [{'start': max(0, t-2/fps), 'end': min(meta['duration'], t+3/fps),\n                         'event': t, 'reasons': sorted(reasons)} for t, reasons in sorted(events.items())],\n            'required_manual_checks': ['Verify actual product/pose cuts separately from title boundaries',\n                'Cover blurred glyph/outline entry independently from target caption timing',\n                'Inspect all four full-frame edges, rotation extremes and protected brands',\n                'Review continuous complex-motion intervals and final encoded video after probes'],\n            'automatic_pass': False}\n\n\ndef _load(run, relative):\n    recipe = read_json(inside(run, relative))\n    source = inside(run, read_json(run/'run.json')['source'])\n    require(file_hash(source) == recipe.get('source_sha256'), 'Repair recipe source changed')\n    require(recipe.get('operations') and recipe.get('shots'), 'Explicit operations and actual shot/pose boundaries required')\n    require(all(op.get('method') in ('temporal_frame', 'temporal_median', 'telea', 'lama',\n                                    'source_restore', 'horizontal_fill', 'exposure_patch', 'poisson_patch')\n                and op.get('reason') for op in recipe['operations']), 'Select an explained repair method')\n    for op in recipe['operations']:\n        shot = next((s for s in recipe['shots'] if s['id'] == op.get('shot')), None)\n        require(shot and shot['start'] <= op['start'] < op['end'] <= shot['end'], 'Repair crosses a shot/pose cut')\n        donors = [op['donor_time']] if op['method'] == 'temporal_frame' else op.get('donor_interval', [])\n        require(op['method'] != 'temporal_median' or len(donors) == 2 and donors[0] < donors[1], 'Median donor interval required')\n        require(all(shot['start'] <= t < shot['end'] for t in donors), 'Donor crosses a shot/pose cut')\n        if 'frame_interval' in op:\n            interval=op['frame_interval']\n            require(isinstance(interval,list) and len(interval)==2 and\n                    all(type(n) is int for n in interval) and 0<=interval[0]<interval[1],\n                    'Frame interval must be half-open nonnegative integers')\n    for name in ('base_video', 'proposal_video'):\n        if name in recipe:\n            asset = recipe[name]\n            require(file_hash(inside(run, asset['path'])) == asset['sha256'], 'Repair dependency changed: '+name)\n    require(not any(op['method'] in ('exposure_patch','poisson_patch') for op in recipe['operations']) or 'proposal_video' in recipe,\n            'Proposal patch requires a hash-bound proposal video')\n    for op in recipe['operations']:\n        if op['method']=='poisson_patch':\n            require(op.get('experimental') is True, 'Poisson patch remains an explicit experimental operation')\n    return recipe, source\n\n\ndef _active(op, n, t):\n    if 'frame_interval' in op:\n        return op['frame_interval'][0]<=n<op['frame_interval'][1]\n    return op['start']<=t<op['end']\n\n\ndef _geometry(op, t):\n    poses = op.get('trajectory', [])\n    if not poses:\n        return op\n    require(all(a['time'] < b['time'] for a, b in zip(poses, poses[1:])), 'Trajectory times must increase')\n    before = max((p for p in poses if p['time'] <= t), key=lambda p: p['time'], default=poses[0])\n    after = min((p for p in poses if p['time'] >= t), key=lambda p: p['time'], default=poses[-1])\n    f = 0 if before['time'] == after['time'] else (t-before['time'])/(after['time']-before['time'])\n    return {**op, 'bbox': [a+(b-a)*f for a,b in zip(before['bbox'],after['bbox'])],\n            'angle': before.get('angle',0)+(after.get('angle',0)-before.get('angle',0))*f}\n\n\ndef _mask(frame, op, t, cv2, np):\n    value = _geometry(op, t)\n    mask = np.zeros(frame.shape[:2], np.uint8)\n    if value['method'] in ('source_restore', 'horizontal_fill', 'exposure_patch'):\n        x,y,w,h = value['bbox']\n        require(all(type(v) is int for v in (x,y,w,h)) and x>=0 and y>=0 and w>0 and h>0\n                and x+w<=frame.shape[1] and y+h<=frame.shape[0], 'Invalid half-open repair rectangle')\n        mask[y:y+h,x:x+w] = 255\n        polygon = None\n    elif value.get('polygon'):\n        polygon = np.asarray(value['polygon'], np.int32)\n    else:\n        x,y,w,h = value['bbox']\n        require(w > 0 and h > 0, 'Positive mask geometry required')\n        polygon = cv2.boxPoints(((x+w/2,y+h/2),(w,h),value.get('angle',0))).astype(np.int32)\n    if polygon is not None:\n        cv2.fillPoly(mask, [polygon], 255)\n    if value.get('mask_selector'):\n        mask = repair_masks.select(frame, mask, value['mask_selector'], cv2, np)\n    for protection in value.get('protected_selectors', []):\n        region = np.zeros_like(mask)\n        x,y,w,h = protection['bbox']\n        require(all(type(v) is int for v in (x,y,w,h)) and x>=0 and y>=0 and w>0 and h>0\n                and x+w<=frame.shape[1] and y+h<=frame.shape[0], 'Invalid selector protection box')\n        region[y:y+h,x:x+w] = 255\n        mask[repair_masks.select(frame,region,protection['selector'],cv2,np)>0] = 0\n    # Protected source content is copied back exactly, including feathered model edges.\n    for x,y,w,h in value.get('protected_regions', []):\n        require(x >= 0 and y >= 0 and w > 0 and h > 0, 'Invalid protected region')\n        mask[round(y):round(y+h),round(x):round(x+w)] = 0\n    return mask\n\n\ndef _special(original, proposal, op, cv2, np):\n    \"\"\"Parameterized legacy operations; intervals/coordinates belong in recipes.\"\"\"\n    if op['method'] == 'source_restore':\n        return original\n    x,y,w,h = op['bbox']\n    result = original.copy()\n    if op['method'] == 'horizontal_fill':\n        a,b = op['left_columns']; c,d = op['right_columns']\n        require(0<=a<b<=original.shape[1] and 0<=c<d<=original.shape[1], 'Invalid clean margins')\n        left = original[y:y+h,a:b].mean(axis=1)\n        right = original[y:y+h,c:d].mean(axis=1)\n        weight = np.linspace(0,1,w)[None,:,None]\n        result[y:y+h,x:x+w] = np.rint(left[:,None,:]*(1-weight)+right[:,None,:]*weight).astype(np.uint8)\n        return result\n    edge, feather = op['edge'], op['feather']\n    require(0<=edge<edge+feather<=original.shape[0] and feather>0, 'Invalid exposure transition')\n    a,b = op['exposure_rows']\n    require(0<=a<b<=original.shape[0], 'Invalid exposure reference')\n    mask = np.ones(original.shape[:2], np.float32)\n    mask[edge:edge+feather] = np.linspace(1,0,feather)[:,None]\n    mask[edge+feather:] = 0\n    delta = np.median(original[a:b].astype(float)-proposal[a:b], axis=(0,1))\n    corrected = np.clip(proposal.astype(float)+delta,0,255)\n    if op.get('local_correction'):\n        value = op['local_correction']; height = value['height']; a,b = value['exclude_rows']\n        require(0<=a<b<=height<=original.shape[0] and value['sigma']>0, 'Invalid local exposure support')\n        valid = np.ones((height,original.shape[1]),np.float32); valid[a:b,:] = 0\n        difference = (original[:height].astype(np.float32)-proposal[:height].astype(np.float32))*valid[:,:,None]\n        support = cv2.GaussianBlur(valid,(0,0),value['sigma'])\n        correction = cv2.GaussianBlur(difference,(0,0),value['sigma'])/np.maximum(support[:,:,None],.001)\n        corrected[:height] = np.clip(proposal[:height].astype(float)+correction,0,255)\n    return np.rint(original*(1-mask[:,:,None])+corrected*mask[:,:,None]).astype(np.uint8)\n\n\ndef _engine():\n    from .runtime import vision_path\n    sys.path.insert(0, str(vision_path(CODE_ROOT)))\n    import cv2\n    import numpy as np\n    return {'repair':file_hash(Path(__file__)), 'frames':file_hash(Path(repair_frames.__file__)),\n            'masks':file_hash(Path(repair_masks.__file__)),\n            'media':file_hash(Path(media.__file__)), 'opencv':cv2.__version__, 'numpy':np.__version__,\n            'encoder':media.command(['ffmpeg','-version']).stdout}\n\n\n@guarded\ndef execute(run, relative, probe=False, extension_reason=None):\n    from .resources import heavy\n    from .timing import measure\n    recipe, source = _load(run, relative)\n    recipe_hash = file_hash(inside(run, relative))\n    model = CODE_ROOT/'.runtime/models/inpaint/lama_fp32.onnx'\n    uses_lama = any(op['method']=='lama' for op in recipe['operations'])\n    require(not uses_lama, 'New image repair belongs to Codex: use codex-packet --stage image. LaMa inference is retired.')\n    identity = object_hash({'recipe': recipe_hash, 'implementation': _engine(), 'probe': probe,\n                            'model':file_hash(model) if uses_lama else None,\n                            'encoder':media.command(['ffmpeg','-version']).stdout})[:24]\n    parent = run/'outputs/local-repair'\n    folder = parent/identity\n    candidates = [folder, *sorted(parent.glob(identity+'-rebuild-*'))]\n    for candidate in reversed(candidates):\n        record = candidate/'preparation.json'\n        if not record.exists(): continue\n        result = read_json(record)\n        if any(not inside(run,a['path']).is_file() for a in result['artifacts']):\n            continue\n        for a in result['artifacts']:\n            require(file_hash(inside(run,a['path'])) == a['sha256'], 'Repair checkpoint changed')\n        return {**result,'reused':True}\n    revision = 1\n    while folder.exists():\n        folder = parent/(identity+f'-rebuild-{revision:04}')\n        revision += 1\n    record = folder/'preparation.json'\n    ledger_path = run.parent.parent/'state/repair-trials'/f'{run.name}.json'\n    ledger = read_json(ledger_path) if ledger_path.exists() else {'attempts': [], 'extensions': []}\n    require(not any(a['state'] == 'running' for a in ledger['attempts']), 'Reconcile interrupted local repair before retry')\n    spent = sum(a.get('seconds',0) for a in ledger['attempts'])\n    limit = 4+len(ledger['extensions'])\n    if len(ledger['attempts']) >= limit or spent >= 600+300*len(ledger['extensions']):\n        require(extension_reason and len(extension_reason.strip()) >= 12, 'Local trial budget exhausted; inspect failures or explain a bounded extension')\n        ledger['extensions'].append({'reason': extension_reason, 'at': utc_now()})\n    attempt = {'recipe': relative, 'sha256': recipe_hash, 'probe': probe, 'state': 'running',\n               'output':record.relative_to(run).as_posix(),\n               'pid':os.getpid(), 'started_at': utc_now()}\n    ledger['attempts'].append(attempt); write_json(ledger_path,ledger)\n    started = time.perf_counter()\n    try:\n        with heavy(run,'visual.repair_recipe'), measure(run,'visual.repair_recipe'):\n            folder.mkdir(parents=True,exist_ok=True)\n            frozen=folder/'recipe.json'\n            frozen.write_bytes(inside(run,relative).read_bytes())\n            require(file_hash(frozen) == recipe_hash and read_json(frozen) == recipe,\n                    'Repair recipe changed before freezing')\n            deadline = started + max(0,600+300*len(ledger['extensions'])-spent)\n            result = _execute(run, recipe, source, frozen.relative_to(run).as_posix(), folder, probe, deadline)\n            require(file_hash(source) == recipe['source_sha256'], 'Repair source changed during execution')\n            for name in ('base_video', 'proposal_video'):\n                if name in recipe:\n                    require(file_hash(inside(run,recipe[name]['path'])) == recipe[name]['sha256'], 'Repair dependency changed during execution')\n        write_json(record,result)\n        attempt.update(state='completed', output=record.relative_to(run).as_posix())\n        return result\n    except BaseException:\n        attempt['state'] = 'failed'\n        raise\n    finally:\n        attempt['seconds'] = round(time.perf_counter()-started,6)\n        write_json(ledger_path,ledger)\n\n\ndef _execute(run, recipe, source, relative, folder, probe, deadline=None):\n    # Optional native/model packages are imported only for local repair execution.\n    from .runtime import vision_path\n    sys.path.insert(0, str(vision_path(CODE_ROOT)))\n    import cv2\n    import numpy as np\n    from PIL import Image\n    from .visual_audit import _timestamps\n    source_times = _timestamps(source)\n    base_path = inside(run,recipe['base_video']['path']) if recipe.get('base_video') else source\n    times = _timestamps(base_path) if base_path != source else source_times\n    meta=media.probe(source)\n    require(len(source_times)*meta['width']*meta['height']*3 <= 512*1024**2,\n            'Repair decoded memory budget exceeded; select a bounded source clip first')\n    fps = media.probe(base_path)['fps']\n    require(all(abs((b-a)-1/fps)<.002 for a,b in zip(times,times[1:])), 'Variable frame rate repair needs explicit normalization')\n    cap = cv2.VideoCapture(str(source)); frames = []\n    while True:\n        ok, frame = cap.read()\n        if not ok: break\n        frames.append(frame)\n    cap.release(); require(len(frames)==len(source_times), 'Decoded frame coverage mismatch')\n    require(len(times)>=len(frames) and len(times)-len(frames)<=recipe.get('hold_source_tail_frames',0),\n            'Base/source coverage differs without an explicit bounded tail hold')\n    require(all(abs(a-b)<.002 for a,b in zip(times,source_times)), 'Base/source frame clocks differ')\n    for op in recipe['operations']:\n        if 'frame_interval' in op:\n            a,b=op['frame_interval']\n            shot=next(s for s in recipe['shots'] if s['id']==op['shot'])\n            require(b<=len(times) and shot['start']<=times[a] and times[b-1]<shot['end'],\n                    'Frame interval crosses shot/pose cut or video coverage')\n    selected = set(range(len(times)))\n    if probe:\n        risks = preflight(run,detect_cuts=True)['windows']\n        boundaries = [op[k] for op in recipe['operations'] for k in ('start','end')]\n        boundaries += [p['time'] for op in recipe['operations'] for p in op.get('trajectory',[])]\n        boundaries += [times[n] for op in recipe['operations'] for n in op.get('frame_interval',[])\n                       if n<len(times)]\n        selected = {n for n,t in enumerate(times) if any(w['start']<=t<=w['end'] for w in risks)\n                    or any(abs(t-e)<=2/fps for e in boundaries)}\n    folder.mkdir(parents=True,exist_ok=True)\n    engine = _engine()\n    model = CODE_ROOT/'.runtime/models/inpaint/lama_fp32.onnx'\n    model_hash = file_hash(model) if any(o['method']=='lama' for o in recipe['operations']) else None\n    def frame_key(n):\n        active = []\n        for op in recipe['operations']:\n            if _active(op,n,times[n]):\n                value = {k:v for k,v in _geometry(op,times[n]).items()\n                         if k not in ('start','end','reason','trajectory','frame_interval')}\n                if op['method']=='lama': value['model_sha256'] = model_hash\n                if op['method'] in ('exposure_patch','poisson_patch'): value['proposal'] = recipe['proposal_video']['sha256']\n                active.append(value)\n        return object_hash({'source':recipe['source_sha256'], 'frame':n, 'pts':times[n],\n                            'base':recipe.get('base_video',{}).get('sha256'),\n                            'hold':recipe.get('hold_source_tail_frames',0),\n                            'engine':engine, 'operations':active})\n    keys = {n:frame_key(n) for n in selected}\n    previous = repair_frames.PreviousFrames(run,keys,cv2)\n    missing = set(selected)-set(previous.rows)\n    needed = {i for i,op in enumerate(recipe['operations'])\n              if any(_active(op,n,times[n]) for n in missing)}\n    donors = {}\n    for i,op in enumerate(recipe['operations']):\n        if i not in needed: continue\n        nearest = lambda t: min(range(len(source_times)),key=lambda n: abs(source_times[n]-t))\n        if op['method']=='temporal_frame': donors[i] = frames[nearest(op['donor_time'])]\n        elif op['method']=='temporal_median':\n            ns=[n for n,t in enumerate(source_times) if op['donor_interval'][0]<=t<op['donor_interval'][1]]\n            require(ns, 'Empty temporal donor interval')\n            ns=[ns[n] for n in np.linspace(0,len(ns)-1,min(19,len(ns))).astype(int)]\n            donors[i]=np.median(np.stack([frames[n] for n in ns]),axis=0).astype(np.uint8)\n        elif op['method']=='lama':\n            require(False, 'LaMa inference is retired; use Codex image editing')\n    artifacts=[]; trace=[]; index=[]; process=None\n    base_cap = cv2.VideoCapture(str(base_path)) if base_path != source else None\n    proposal_cap = cv2.VideoCapture(str(inside(run,recipe['proposal_video']['path']))) if recipe.get('proposal_video') else None\n    base_position = proposal_position = -1\n    if not probe:\n        h,w=frames[0].shape[:2]\n        process=subprocess.Popen(['ffmpeg','-v','error','-y','-f','rawvideo','-pix_fmt','bgr24','-s',f'{w}x{h}',\n            '-r',str(fps),'-i','pipe:0','-an','-c:v','ffv1',str(folder/'visual-master.mkv')],stdin=subprocess.PIPE,stderr=subprocess.PIPE)\n    try:\n        for n in sorted(selected):\n            require(deadline is None or time.perf_counter() < deadline,\n                    'Local repair time budget exhausted; partial output is not a checkpoint')\n            original=frames[min(n,len(frames)-1)]\n            baseline = original\n            if base_cap:\n                while base_position < n-1:\n                    require(base_cap.grab(), 'Missing base frame'); base_position += 1\n                ok,baseline = base_cap.read(); base_position += 1\n                require(ok and baseline.shape == original.shape, 'Base frame dimensions/coverage differ')\n            current=previous.get(n)\n            reused = current is not None\n            if not reused: current=baseline.copy()\n            changed=np.zeros(original.shape[:2],bool)\n            for i,op in enumerate(recipe['operations']):\n                if not _active(op,n,times[n]): continue\n                mask=_mask(original,op,times[n],cv2,np); active=mask>0\n                if not np.any(active): continue\n                changed|=active\n                if reused: continue\n                if op['method'] in ('source_restore','horizontal_fill','exposure_patch','poisson_patch'):\n                    proposal = None\n                    if op['method'] in ('exposure_patch','poisson_patch'):\n                        while proposal_position < n-1:\n                            require(proposal_cap.grab(), 'Missing proposal frame'); proposal_position += 1\n                        if proposal_position < n:\n                            ok,proposal_frame = proposal_cap.read(); proposal_position += 1\n                            require(ok, 'Missing proposal frame')\n                        proposal=cv2.resize(proposal_frame,(original.shape[1],original.shape[0]))\n                    if op['method']=='poisson_patch':\n                        x,y,w,h = cv2.boundingRect(mask)\n                        repaired=cv2.seamlessClone(proposal,current,mask.copy(),(x+w//2,y+h//2),cv2.NORMAL_CLONE)\n                    else:\n                        repaired=_special(original,proposal,op,cv2,np)\n                elif i in donors: repaired=donors[i]\n                elif op['method']=='lama': require(False, 'LaMa inference is retired')\n                else: repaired=cv2.inpaint(current,mask,3,cv2.INPAINT_TELEA)\n                current[active]=repaired[active];changed|=active\n            require(np.array_equal(current[~changed],baseline[~changed]), 'Repair changed undeclared pixels')\n            trace.append({'frame':n,'pts':times[n],'mask_bbox':list(cv2.boundingRect(changed.astype(np.uint8)))})\n            index.append({'frame':n,'key':keys[n],'pixels_sha256':repair_frames.pixel_hash(current)})\n            if probe:\n                path=folder/f'probe-{n:06}.png';Image.fromarray(cv2.cvtColor(current,cv2.COLOR_BGR2RGB)).save(path)\n                artifacts.append({'path':path.relative_to(run).as_posix(),'sha256':file_hash(path)})\n            else: process.stdin.write(current.tobytes())\n    finally:\n        if base_cap: base_cap.release()\n        if proposal_cap: proposal_cap.release()\n        if process:\n            process.stdin.close(); error=process.stderr.read().decode(errors='replace')\n            process.stderr.close()\n            require(process.wait()==0,'Repair encoding failed: '+error[-400:])\n        previous.close()\n    if process:\n        path=folder/'visual-master.mkv';artifacts.append({'path':path.relative_to(run).as_posix(),'sha256':file_hash(path)})\n    trace_path=folder/'changed-regions.json';write_json(trace_path,trace)\n    artifacts.append({'path':trace_path.relative_to(run).as_posix(),'sha256':file_hash(trace_path)})\n    index_path=folder/'frame-index.json';write_json(index_path,index)\n    frame_index={'path':index_path.relative_to(run).as_posix(),'sha256':file_hash(index_path)}\n    artifacts.append(frame_index)\n    return {'source_sha256':recipe['source_sha256'],'target_language':None,'contains_target_typography':False,\n            'approved_for_reuse':False,'probe_only':probe,'artifacts':artifacts,\n            'frame_index':frame_index,\n            'incremental':{'reused_frames':previous.hits,'computed_frames':len(selected)-previous.hits,\n                           'total_frames':len(selected),'extra_cached_media':0,\n                           'previous_output':previous.record['output'] if previous.hits else None},\n            **({'output':artifacts[0]} if not probe else {}),\n            'inputs':[{'path':read_json(run/'run.json')['source'],'sha256':recipe['source_sha256']},\n                      {'path':relative,'sha256':file_hash(inside(run,relative))}]\n                     + [recipe[k] for k in ('base_video','proposal_video') if k in recipe],\n            'method':'Source-bound local recipe; only declared mask pixels changed; all observations remain pending',\n            'automatic_pass':False}\n\n\ndef _alive(pid):\n    require(type(pid) is int and pid > 0, 'Unknown local repair owner; inspect before recovery')\n    if os.name == 'nt':\n        import csv\n        result = subprocess.run(['tasklist','/FI',f'PID eq {pid}','/FO','CSV','/NH'],\n                                capture_output=True,text=True,check=True)\n        return any(len(row)>1 and row[1]==str(pid) for row in csv.reader(result.stdout.splitlines()))\n    try:\n        os.kill(pid,0)\n        return True\n    except ProcessLookupError:\n        return False\n\n\n@guarded\ndef reconcile(run, reason):\n    \"\"\"Resolve a dead local process without clearing locks or retrying any model.\"\"\"\n    require(isinstance(reason,str) and len(reason.strip())>=12, 'Explain the interrupted local repair')\n    path=run.parent.parent/'state/repair-trials'/f'{run.name}.json'\n    ledger=read_json(path)\n    for attempt in ledger['attempts']:\n        if attempt['state']!='running': continue\n        require(not _alive(attempt.get('pid')), 'Local repair process is still running')\n        record=inside(run,attempt['output'])\n        completed=False\n        if record.exists():\n            saved=read_json(record)\n            completed=bool(saved.get('artifacts')) and all(file_hash(inside(run,a['path']))==a['sha256'] for a in saved['artifacts'])\n            require(completed,'Interrupted repair checkpoint changed')\n        attempt.update(state='completed' if completed else 'interrupted',recovery_reason=reason,recovered_at=utc_now())\n    write_json(path,ledger)\n    return {'attempts':ledger['attempts'],'paid_retry':False,'automatic_pass':False}\n","lines":432,"sha256":"bb9e9dab579d52b203dea7aa9a45138257ddddf1f0eeec2769fb197b891e7903"},{"path":"src/video_localizer/repair_frames.py","text":"\"\"\"Reuse exact decoded repair frames from completed lossless masters, not reviews.\"\"\"\nimport hashlib\n\nfrom .common import file_hash, inside, read_json, require\n\n\ndef pixel_hash(frame):\n    return hashlib.sha256(frame.tobytes()).hexdigest()\n\n\nclass PreviousFrames:\n    def __init__(self, run, keys, cv2):\n        self.run, self.keys, self.cv2 = run, keys, cv2\n        self.record, self.cap, self.position = None, None, -1\n        self.rows, self.hits = {}, 0\n        best = 0\n        for path in sorted((run/'outputs/local-repair').glob('*/preparation.json')):\n            saved = read_json(path)\n            index = saved.get('frame_index')\n            output = saved.get('output')\n            if saved.get('probe_only') or not index or not output:\n                continue\n            video = inside(run, output['path'])\n            # Explicitly pruned/expired media is a miss, never a restored approval.\n            if not video.is_file():\n                continue\n            index_path = inside(run, index['path'])\n            require(file_hash(index_path) == index['sha256'], 'Repair frame index changed')\n            rows = read_json(index_path)\n            matches = {r['frame']: r for r in rows if r['frame'] in keys and keys[r['frame']] == r['key']}\n            if len(matches) > best:\n                self.record, self.rows, best = saved, matches, len(matches)\n\n    def get(self, n):\n        row = self.rows.get(n)\n        if row is None:\n            return None\n        if self.cap is None:\n            asset = self.record['output']\n            path = inside(self.run, asset['path'])\n            require(file_hash(path) == asset['sha256'], 'Previous repair master changed')\n            self.cap = self.cv2.VideoCapture(str(path))\n        require(n > self.position, 'Repair frames must be read in order')\n        while self.position < n - 1:\n            require(self.cap.grab(), 'Previous repair frame missing')\n            self.position += 1\n        ok, frame = self.cap.read()\n        self.position += 1\n        require(ok and pixel_hash(frame) == row['pixels_sha256'], 'Previous repair pixels changed')\n        self.hits += 1\n        return frame\n\n    def close(self):\n        if self.cap is not None:\n            self.cap.release()\n        if self.record and self.hits:\n            asset = self.record['output']\n            require(file_hash(inside(self.run, asset['path'])) == asset['sha256'],\n                    'Previous repair master changed during reuse')\n","lines":59,"sha256":"1520b3fb903892f413d26187a4ebc641e58dbd38f8b5dc9c62146601d585efe8"},{"path":"src/video_localizer/repair_masks.py","text":"\"\"\"Explicit source-pixel selectors; thresholds belong to reviewed task recipes.\"\"\"\nfrom .common import require\n\n\ndef select(frame, region, spec, cv2, np):\n    require(set(spec) <= {'hsv_ranges', 'open_kernel', 'components', 'fill_holes', 'dilate'},\n            'Unknown mask selector setting')\n    ranges = spec.get('hsv_ranges')\n    require(isinstance(ranges, list) and ranges, 'Explicit HSV ranges required')\n    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)\n    mask = np.zeros(region.shape, np.uint8)\n    for bounds in ranges:\n        require(isinstance(bounds, list) and len(bounds) == 2 and all(len(v) == 3 for v in bounds),\n                'HSV range needs lower and upper triples')\n        require(all(type(v) is int and 0 <= v <= limit for row in bounds for v, limit in zip(row, (179,255,255)))\n                and all(a <= b for a,b in zip(*bounds)), 'Invalid HSV range')\n        mask |= cv2.inRange(hsv, np.array(bounds[0],np.uint8), np.array(bounds[1],np.uint8))\n    mask &= region\n    if 'open_kernel' in spec:\n        kernel = spec['open_kernel']\n        require(len(kernel)==2 and all(type(v) is int and 1<=v<=31 for v in kernel), 'Invalid opening kernel')\n        mask = cv2.morphologyEx(mask, cv2.MORPH_OPEN, np.ones((kernel[1],kernel[0]),np.uint8))\n    if 'components' in spec:\n        limits = spec['components']\n        columns = {'area':cv2.CC_STAT_AREA, 'width':cv2.CC_STAT_WIDTH, 'height':cv2.CC_STAT_HEIGHT}\n        require(limits and set(limits)<=set(columns), 'Unknown component filter')\n        for interval in limits.values():\n            require(len(interval)==2 and all(type(v) is int and v>=0 for v in interval)\n                    and interval[0]<=interval[1], 'Invalid component bounds')\n        count, labels, stats, _ = cv2.connectedComponentsWithStats(mask, 8)\n        keep = [i for i in range(1,count) if all(a<=stats[i,columns[key]]<=b for key,(a,b) in limits.items())]\n        mask = np.isin(labels, keep).astype(np.uint8)*255\n    require(type(spec.get('fill_holes',False)) is bool, 'Invalid hole filling flag')\n    if spec.get('fill_holes'):\n        contours,_ = cv2.findContours(mask,cv2.RETR_EXTERNAL,cv2.CHAIN_APPROX_SIMPLE)\n        cv2.drawContours(mask,contours,-1,255,cv2.FILLED)\n    radius = spec.get('dilate',0)\n    require(type(radius) is int and 0<=radius<=64, 'Invalid mask dilation')\n    if radius:\n        mask = cv2.dilate(mask,cv2.getStructuringElement(cv2.MORPH_ELLIPSE,(radius*2+1,radius*2+1)))\n    return mask & region\n","lines":41,"sha256":"ff04895971dc434b962b0c8480fdc4988ac5d573999de2032a3d2c2727cb2440"},{"path":"src/video_localizer/retention.py","text":"\"\"\"Preserve observations before an explicit, fail-closed run deletion.\"\"\"\nfrom __future__ import annotations\n\nimport re\nimport shutil\nimport math\nfrom contextlib import ExitStack\nfrom pathlib import Path\n\nfrom . import bundles, learning, library, source_state\nfrom .common import ROOT, file_hash, guarded, inside, object_hash, read_json, require, run_operation, utc_now, write_json\nfrom .evidence import EVIDENCE_SUFFIXES\n\nTERMINAL = {\"success\", \"succeeded\", \"fail\", \"failed\", \"cancelled\", \"canceled\"}\n\n\ndef files(run):\n    run = Path(run).resolve()\n    result = {}\n    for path in sorted(run.rglob(\"*\")):\n        require(not path.is_symlink() and not getattr(path, \"is_junction\", lambda: False)(), \"Linked run content cannot be deleted\")\n        require(path.resolve().is_relative_to(run), \"Run content escapes its directory\")\n        if path.is_file():\n            result[path.relative_to(run).as_posix()] = file_hash(path)\n    return result\n\n\ndef blockers(run):\n    problems = []\n    for path in Path(run).rglob(\"*.lock\"):\n        problems.append(\"Unresolved operation lock: \" + path.relative_to(run).as_posix())\n    for path in (Path(run) / \"jobs\").glob(\"*.json\"):\n        job = read_json(path)\n        if job.get(\"state\") not in TERMINAL:\n            problems.append(\"Unsettled model task: \" + path.name)\n        if job.get(\"billing_status\") in {\"unknown\", \"pending\", \"unsettled\"} or job.get(\"billing\") == \"unknown\":\n            problems.append(\"Unsettled billing: \" + path.name)\n        actual = job.get('credits_consumed')\n        settled = type(actual) in (int,float) and math.isfinite(actual) and actual>=0\n        if (job.get(\"task_id\") or 'estimated_credits' in job or job.get('batch_budget')\n                or job.get('submitted_at')) and not settled:\n            problems.append(\"Missing settled task cost: \" + path.name)\n    for path in (Path(run).parent.parent/'state/budgets').glob('*.json'):\n        if path.name == 'index.json': continue\n        for reservation in read_json(path).get('reservations',{}).values():\n            if reservation.get('run') != Path(run).name: continue\n            actual = reservation.get('actual_credits')\n            if (type(actual) not in (int,float) or not math.isfinite(actual) or actual<0\n                    or reservation.get('state') not in TERMINAL | {'response_received','response_invalid'}):\n                problems.append('Unsettled request reservation: '+path.name+':'+str(reservation.get('job')))\n    costs = Path(run) / \"outputs/actual-costs.json\"\n    if costs.exists():\n        data = read_json(costs)\n        if data.get(\"unknown_jobs\") or data.get(\"unknown_billing_items\"):\n            problems.append(\"Unsettled entries in outputs/actual-costs.json\")\n    repairs = Path(run).parent.parent / 'state/repair-trials' / (Path(run).name + '.json')\n    if repairs.exists() and any(a.get('state') == 'running' for a in read_json(repairs).get('attempts', [])):\n        problems.append('Unreconciled local repair attempt')\n    return problems\n\n\ndef _run(root, run):\n    root, run = Path(root).resolve(), Path(run).resolve()\n    require(run.parent == (root / \"runs\").resolve() and bool(re.fullmatch(r\"[A-Za-z0-9][A-Za-z0-9_-]{0,79}\", run.name)),\n            \"Deletion target must be one named run inside this workspace\")\n    require((run / \"run.json\").is_file(), \"Unknown run\")\n    return root, run\n\n\n@guarded\ndef preserve(run, root=None):\n    root, run = _run(root or ROOT, run)\n    require(not blockers(run), \"Resolve model tasks, billing and operation locks before preserving for deletion\")\n    learning.audit(root)\n    # Publishing neutral observations first makes the preservation fingerprint stable.\n    snapshot = source_state.save(run, root) if (run / \"analysis/media.json\").exists() else None\n    record = read_json(run / \"run.json\")\n    request = read_json(run / \"inputs/request.json\")\n    scope = {\"workflow\": \"video-localization\", \"source_sha256\": record[\"source_sha256\"],\n             \"target_language\": request[\"target_language\"]}\n    video = None\n    candidate = run / \"outputs/candidate.json\"\n    if candidate.exists():\n        data = read_json(candidate)\n        require(file_hash(inside(run, data[\"path\"])) == data[\"sha256\"], \"Candidate changed before preservation\")\n        video = data[\"sha256\"]\n    delivery = run / \"outputs/delivery.json\"\n    if delivery.exists():\n        data = read_json(delivery)\n        require(file_hash(inside(run, data[\"video\"])) == data[\"sha256\"], \"Delivered video changed before preservation\")\n        video = data[\"sha256\"]\n    package = library.export(run, root, video) if video else None\n    if package:\n        package = {**package, \"manifest_sha256\": file_hash(root / package[\"package\"] / \"manifest.json\")}\n    content = files(run)\n    identity = object_hash(content)\n    case_id = \"retained-\" + run.name[:60] + \"-\" + identity[:24]\n    from .learning_evidence import select\n    observations = select(run, video, history=True)\n    case = learning.capture_case(case_id, \"Run observations preserved before deletion; conclusions still require review.\",\n        scope, root, run, video, records=observations)\n    candidate_record = {\"id\": case_id, \"status\": \"candidate\", \"scope\": scope,\n        \"hypothesis\": \"Preserved source observations, decisions and failure records await distillation.\",\n        \"case\": case.relative_to(root).as_posix(), \"evidence\": {\"run\": run.name, \"video_sha256\": video},\n        \"company_preference\": False, \"promotion\": \"No rule or user acceptance is inferred by deleting a run.\"}\n    candidate_path = root / \"knowledge/local/candidates\" / (case_id + \".json\")\n    if not candidate_path.exists():\n        write_json(candidate_path, candidate_record)\n    inbox = learning.enqueue(candidate_record, root)\n    # A no-analysis run still needs its original bytes for future analysis.\n    recovery = root / \"state/run-recovery\" / run.name / identity\n    source = inside(run, record[\"source\"])\n    require(file_hash(source) == record[\"source_sha256\"], \"Original video changed\")\n    bundles.create(recovery, \"run-recovery\", identity,\n                   {record[\"source\"]: source, \"run.json\": run / \"run.json\", \"inputs/request.json\": run / \"inputs/request.json\"},\n                   {\"source_sha256\": record[\"source_sha256\"], \"origin_run_id\": run.name})\n    receipt = {\"schema_version\": 1, \"run\": run.name, \"fingerprint\": identity, \"files\": content,\n        \"case\": candidate_record[\"case\"], \"case_manifest_sha256\": file_hash(case / \"manifest.json\"),\n        \"inbox\": inbox, \"candidate\": candidate_path.relative_to(root).as_posix(),\n        \"candidate_sha256\": file_hash(candidate_path), \"inbox_sha256\": file_hash(root / inbox),\n        \"source_snapshot\": snapshot, \"package\": package,\n        \"recovery\": recovery.relative_to(root).as_posix(), \"recovery_manifest_sha256\": file_hash(recovery / \"manifest.json\"),\n        \"preserved_at\": utc_now(), \"status\": \"preserved\"}\n    write_json(root / \"state/run-retention\" / (run.name + \".json\"), receipt)\n    return {\"run\": run.name, \"fingerprint\": identity, \"case\": receipt[\"case\"], \"source_snapshot\": snapshot,\n            \"package\": package, \"status\": \"preserved\", \"knowledge_status\": \"candidate_not_activated\"}\n\n\ndef inspect(run, root=None):\n    root, run = _run(root or ROOT, run)\n    problems = blockers(run)\n    if list((root/'state/resources').glob('*.lock')):\n        problems.append('Heavy work is active; retry cleanup when idle')\n    _, external_paths = _live_references(root, exclude_run=run)\n    if any(path.is_relative_to(run) for path in external_paths):\n        problems.append('Another run still references this run\\'s files')\n    learning.audit(root)\n    content = files(run)\n    fingerprint = object_hash(content)\n    receipt_path = root / \"state/run-retention\" / (run.name + \".json\")\n    receipt = read_json(receipt_path) if receipt_path.exists() else None\n    if not receipt or receipt[\"fingerprint\"] != fingerprint:\n        problems.append(\"Run is not preserved at its current contents; run run-preserve first\")\n    else:\n        case = inside(root, receipt[\"case\"])\n        require(file_hash(case / \"manifest.json\") == receipt[\"case_manifest_sha256\"], \"Preserved knowledge case changed\")\n        bundles.verify(case)\n        for key in (\"candidate\", \"inbox\"):\n            require(file_hash(inside(root, receipt[key])) == receipt[key + \"_sha256\"], \"Preserved learning queue changed\")\n        recovery = inside(root, receipt[\"recovery\"])\n        require(file_hash(recovery / \"manifest.json\") == receipt[\"recovery_manifest_sha256\"], \"Recovery manifest changed\")\n        bundles.verify(recovery)\n        if receipt[\"source_snapshot\"]:\n            source_state.verify(receipt[\"source_snapshot\"], root, read_json(run / \"run.json\")[\"source_sha256\"])\n        if receipt[\"package\"]:\n            package = inside(root, receipt[\"package\"][\"package\"])\n            require(file_hash(package / \"manifest.json\") == receipt[\"package\"][\"manifest_sha256\"], \"Preserved delivery manifest changed\")\n            bundles.verify(package)\n    return {\"run\": run.name, \"fingerprint\": fingerprint, \"decision\": \"blocked\" if problems else \"ready\",\n            \"blockers\": problems, \"files\": len(content), \"dry_run\": True}\n\n\n@guarded\ndef delete(run, root=None, execute=False, expected=None):\n    root, run = _run(root or ROOT, run)\n    preview = inspect(run, root)\n    if not execute:\n        return preview\n    require(preview[\"decision\"] == \"ready\", \"; \".join(preview[\"blockers\"]))\n    require(expected == preview[\"fingerprint\"], \"Deletion requires the current preview fingerprint via --expect\")\n    receipt_path = root / \"state/run-retention\" / (run.name + \".json\")\n    receipt = read_json(receipt_path)\n    receipt.update(status=\"deleting\", deletion_started_at=utc_now())\n    write_json(receipt_path, receipt)\n    # Recheck the exact absolute target immediately before recursive deletion.\n    require(run.resolve().parent == (root / \"runs\").resolve() and object_hash(files(run)) == expected,\n            \"Run changed during deletion preparation\")\n    shutil.rmtree(run)\n    receipt.update(status=\"deleted\", deleted_at=utc_now())\n    write_json(receipt_path, receipt)\n    return {\"run\": run.name, \"status\": \"deleted\", \"knowledge_case\": receipt[\"case\"],\n            \"preserved_source\": receipt[\"recovery\"], \"dry_run\": False}\n\n\n@guarded\ndef prune(run, root=None, execute=False, expected=None):\n    \"\"\"Evict superseded generated pictures after the normal preservation gates.\n\n    Current source, candidate, released preparations, all JSON observations and\n    recipes remain. A pruned old audit is explicitly incomplete, never approved.\n    \"\"\"\n    root, run = _run(root or ROOT, run)\n    preview = inspect(run, root)\n    require(preview['decision'] == 'ready', '; '.join(preview['blockers']))\n    candidate = read_json(run/'outputs/candidate.json') if (run/'outputs/candidate.json').exists() else {}\n    inventory = read_json(run/'analysis/inventory.json') if (run/'analysis/inventory.json').exists() else {}\n    protected = {candidate.get('sha256')}\n    for shot in inventory.get('shots',[]):\n        for name in ('prepared_video','surface_typography'):\n            if shot.get(name): protected.add(shot[name]['sha256'])\n    targets = {}\n    manifests = list((run/'inputs/visual-audit').glob('*/text-visual-audit.json'))\n    manifests += list((run/'review').glob('*/visual-audit/*/text-visual-audit.json'))\n    from .learning_evidence import select\n    essential = set(select(run, history=True))\n    for manifest in manifests:\n        data = read_json(manifest)\n        if data['binding']['video_sha256'] in protected: continue\n        for path in manifest.parent.rglob('*'):\n            if path.is_file() and path not in essential and path.suffix.lower() in {'.png','.jpg','.webp'}:\n                relative = path.relative_to(run).as_posix()\n                targets[relative] = {'sha256': file_hash(path), 'bytes': path.stat().st_size}\n    fingerprint = object_hash({'preserved_run': preview['fingerprint'], 'pictures': targets})\n    result = {'run':run.name, 'fingerprint':fingerprint, 'files':len(targets),\n              'logical_bytes':sum(p['bytes'] for p in targets.values()), 'dry_run':not execute,\n              'protected_video_hashes':sorted(p for p in protected if p),\n              'scope':'Superseded generated comparison pictures only; current work, source, scripts, ledgers and all observation text remain.'}\n    if not execute: return result\n    require(expected == fingerprint, 'Pruning requires the current preview fingerprint via --expect')\n    receipt = read_json(root/'state/run-retention'/f'{run.name}.json')\n    # inspect verified this independent case, source snapshot and selected package.\n    # The case contains explicit failures and representative historical pictures.\n    out = root/'state/run-pruning'/run.name/(fingerprint+'.json')\n    record = {**result, 'state':'deleting', 'pictures':targets, 'case':receipt['case'],\n              'recovery':receipt['recovery'], 'package':receipt['package'], 'started_at':utc_now()}\n    write_json(out,record)\n    for relative, asset in targets.items():\n        path = inside(run,relative)\n        require(path.resolve().is_relative_to(run) and not path.is_symlink()\n                and file_hash(path) == asset['sha256'], 'Prune target changed')\n        path.unlink()\n    record.update(state='completed', completed_at=utc_now())\n    write_json(out,record)\n    return {**result, 'receipt':out.relative_to(root).as_posix(), 'state':'completed'}\n\n\ndef _live_references(root, exclude_run=None):\n    \"\"\"Conservative closure of active manifests; historical versions are not roots.\"\"\"\n    hashes, paths, seen, values = set(), set(), set(), set()\n    def visit(value, run, bound=False):\n        if isinstance(value, dict):\n            for key,item in value.items():\n                visit(item, run, key in {'path','record','source','keyframe','video','audio','file','asset'})\n        elif isinstance(value, list):\n            for item in value: visit(item, run, bound)\n        elif isinstance(value, str):\n            if re.fullmatch(r'[a-f0-9]{64}', value): hashes.add(value)\n            if '\\n' not in value and len(value)<512 and value
