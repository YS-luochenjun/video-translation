y.get(\"has_speech\") is None:\n            lines.append(\"The controlling agent cannot verify the speech yet. Analyze the supplied audio yourself and translate all intelligible dialogue and narration; uncertainty is not permission to discard it.\")\n    else:\n        lines.append(\"Explicitly authorized silent delivery; no audio is required in this candidate.\")\n    for item in speeches:\n        if item[\"start\"] < end and item[\"end\"] > start:\n            lines.append(f\"Speech ({item.get('speech_role', 'dialogue_or_narration')}) {item['id']} at {max(item['start'], start)-start:.2f}-\"\n                         f\"{min(item['end'], end)-start:.2f}s: {item['source_text']!r} -> {item['target_text']!r}.\")\n    return lines\n\n\ndef extract_track(source, output, start, duration):\n    source_info, _ = inspect(source)\n    require(source_info[\"has_track\"], \"Required model/source audio stream is missing; do not substitute silence or foreign dialogue\")\n    available = source_info[\"duration\"] - start\n    require(available >= duration - 0.3, \"Selected audio does not cover its segment\")\n    Path(output).parent.mkdir(parents=True, exist_ok=True)\n    media.ffmpeg([\"-ss\", start, \"-i\", source, \"-t\", duration, \"-vn\", \"-map\", \"0:a:0\",\n                  \"-af\", f\"apad=whole_dur={duration}\", \"-ac\", \"2\", \"-ar\", \"48000\", \"-c:a\", \"pcm_s16le\", output])\n    measured, _ = inspect(output)\n    require(abs(measured[\"duration\"] - duration) < 0.005, \"Selected audio does not cover its segment\")\n    write_json(Path(output).with_suffix(\".json\"), {\"source_sha256\": file_hash(source), \"start\": start,\n               \"source_audio_duration\": source_info[\"duration\"], \"requested_duration\": duration,\n               \"tail_padding_seconds\": round(max(0, duration - available), 4),\n               \"method\": \"Pad only a sub-0.3s encoder/model tail to retain segment boundaries; no tempo change or replacement content\",\n               \"limitation\": \"Padding does not recover missing music/effects; output review must assess any audible seam\"})\n    return Path(output)\n\n\ndef concatenate(tracks, output):\n    listing = Path(output).parent / \"audio-concat.txt\"\n    for path in tracks:\n        require(\"'\" not in str(path) and \"\\n\" not in str(path), \"Unsupported audio concat path\")\n    listing.write_text(\"\\n\".join(f\"file '{Path(path).resolve().as_posix()}'\" for path in tracks), encoding=\"utf-8\")\n    media.ffmpeg([\"-f\", \"concat\", \"-safe\", \"0\", \"-i\", listing, \"-c:a\", \"pcm_s16le\", output])\n    return Path(output)\n","lines":217,"sha256":"776334b6098a3808a15a5673eae63bec00bf0068bc4f8b4895f76c0f5fcf7baf"}],"commands":[{"name":"doctor","impact":"read","description":"检查本地工具和配置；--online 只查询 KIE 鉴权／余额，不生成视频。","help":"usage: va.py doctor [-h] [--online]\n\noptions:\n  -h, --help  show this help message and exit\n  --online\n"},{"name":"check","impact":"write","description":"运行项目测试；可能生成本地测试产物，不代表真实广告验收。","help":"usage: va.py check [-h]\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"kie-authorization","impact":"read","description":"读取当前拥有者授权，隐藏凭据。","help":"usage: va.py kie-authorization [-h]\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"resources","impact":"read","description":"查看本地重任务占用和剩余空间，不清理、不解锁。","help":"usage: va.py resources [-h]\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"asr","impact":"write","description":"识别真实音频并保存转写／字词时间和缓存；--download 可下载本地模型，不是验收。","help":"usage: va.py asr [-h] [--audio AUDIO] [--model {small}] [--download]\n                 [--no-vad] [--language LANGUAGE]\n                 run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help           show this help message and exit\n  --audio AUDIO\n  --model {small}\n  --download\n  --no-vad\n  --language LANGUAGE  Optional recognition hint, not independent language\n                       detection\n"},{"name":"audio-mix"                     Run-relative source/request-bound human grant for an\n                        alternative analysis model\n  --retry-upload        Retry a journaled transport failure before model\n                        submission; preserves prior attempt and budget\n  --transcribe-only     Transcribe actual candidate audio alone; does not\n                        claim comparative music/FX review\n  --voice-review        Compare actual character voice distinction and\n                        consistency; requires --candidate\n  --execute             Upload audio and run one journaled KIE Gemini audio\n                        analysis\n  --candidate           Compare source with captured candidate; transcribe\n                        actual output and review retained music/effects\n"},{"name":"plan","impact":"write","description":"核验清单与资产，冻结逐镜头路线、提示词、知识、质量及输入哈希。","help":"usage: va.py plan [-h] [--experiment {local_overlay,model_edit}] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help            show this help message and exit\n  --experiment {local_overlay,model_edit}\n"},{"name":"packet","impact":"write","description":"准备并展示真实视频模型附件和 payload，不创建付费任务。","help":"usage: va.py packet [-h] run segment\n\npositional arguments:\n  run\n  segment\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"submit","impact":"paid","description":"预览或 --execute 上传并创建付费视频任务；同指纹复用，失败重试有严格条件。","help":"usage: va.py submit [-h] [--execute] [--retry-failed] run segment\n\npositional arguments:\n  run\n  segment\n\noptions:\n  -h, --help      show this help message and exit\n  --execute       Actually upload and create a paid KIE job\n  --retry-failed  One explicit retry of a terminal zero-cost provider failure\n"},{"name":"poll","impact":"write","description":"查询原任务状态，成功后下载并登记媒体／费用；最多单次等 45 秒，不新建模型任务。","help":"usage: va.py poll [-h] [--wait 0..45] run job\n\npositional arguments:\n  run\n  job\n\noptions:\n  -h, --help    show this help message and exit\n  --wait 0..45\n"},{"name":"render","impact":"write","description":"按当前计划合成实际候选，明确选择音轨并记录输入输出。","help":"usage: va.py render [-h] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"capture","impact":"write","description":"为实际候选提取画面、音轨、边界和报告，冻结证据哈希。","help":"usage: va.py capture [-h] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"quality","impact":"write","description":"检查绑定、覆盖、声音、字幕、视觉与评分，写 pass／revise；机器不替代语义审查。","help":"usage: va.py quality [-h] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"deliver","impact":"write","description":"重新质量检查，通过后生成正式独立包、候选案例和 inbox。","help":"usage: va.py deliver [-h] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"reflect","impact":"write","description":"将本次结果／失败形成候选与独立案例，可重复收尾，不自动启用。","help":"usage: va.py reflect [-h] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"context","impact":"read","description":"检索适用政策、方法、同源参考及源解析／交付库线索。","help":"usage: va.py context [-h] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"status","impact":"read","description":"按当前文件推导 run 状态，作为导航而非最终验收。","help":"usage: va.py status [-h] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"knowledge","impact":"read","description":"按目标语言检索知识；具体任务优先用 context 结合内容特征。","help":"usage: va.py knowledge [-h] [--target TARGET]\n\noptions:\n  -h, --help       show this help message and exit\n  --target TARGET\n"},{"name":"demo","impact":"write","description":"生成已知合成测试广告；测试执行链路，不代表真实素材验收。","help":"usage: va.py demo [-h] [--id ID] [--route {local_overlay,model_edit}]\n                  [--seconds SECONDS]\n\noptions:\n  -h, --help            show this help message and exit\n  --id ID\n  --route {local_overlay,model_edit}\n  --seconds SECONDS     Synthetic fixture length, 1-180 seconds\n"},{"name":"blind","impact":"write","description":"freeze 冻结中性 A／B 包；verify 验证；评分齐全后 reveal 揭示来源。","help":"usage: va.py blind [-h] {freeze,verify,reveal} run [candidates ...]\n\npositional arguments:\n  {freeze,verify,reveal}\n  run\n  candidates\n\noptions:\n  -h, --help            show this help message and exit\n"},{"name":"local-tts","impact":"write","description":"只复用已存在的本地配音；新声音使用 Gemini TTS。","help":"usage: va.py local-tts [-h] run spec\n\npositional arguments:\n  run\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"close-failure","impact":"write","description":"保存成片前真实失败观察和独立证据，不虚构成片或改预算。","help":"usage: va.py close-failure [-h] run spec\n\npositional arguments:\n  run\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"run-prune-versions","impact":"delete","description":"先保全、预览并核验独立错误证据，再删除明确指定且未被引用的旧视频；未知费用阻止清理。","help":"usage: va.py run-prune-versions [-h] [--execute] [--expect EXPECT] run spec\n\npositional arguments:\n  run\n  spec\n\noptions:\n  -h, --help       show this help message and exit\n  --execute\n  --expect EXPECT\n"},{"name":"model-routing","impact":"read","description":"查看 Codex 与五项专用模型职责及当前政策。","help":"usage: va.py model-routing [-h]\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"codex-packet","impact":"local","description":"生成绑定源片、实际图片、规则和知识的 Codex 工作包。","help":"usage: va.py codex-packet [-h] [--stage {recognize,image}] [--spec SPEC] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help            show this help message and exit\n  --stage {recognize,image}\n  --spec SPEC           Run-relative JSON with optional images and\n                        instructions\n"},{"name":"codex-result","impact":"local","description":"登记真实 Codex 图片观察或产物；只绑定证据，不自动审核通过。","help":"usage: va.py codex-result [-h] run packet report\n\npositional arguments:\n  run\n  packet\n  report\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"knowledge-queue","impact":"read","description":"查看原始候选、提纯版本和使用反馈的待审队列，包含采纳依据及下一步。","help":"usage: va.py knowledge-queue [-h] [--include-closed]\n\noptions:\n  -h, --help        show this help message and exit\n  --include-closed\n"},{"name":"knowledge-review","impact":"local","description":"记录有来源的采纳审查及目标版本；保留原文、剩余内容和修订链。","help":"usage: va.py knowledge-review [-h] spec\n\npositional arguments:\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"knowledge-use","impact":"local","description":"把实际采用或未采用、效果和反证绑定到计划、视频与独立证据。","help":"usage: va.py knowledge-use [-h] run spec\n\npositional arguments:\n  run\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"candidate-archive","impact":"local","description":"预览或按指纹归档完全处理的候选；从候选目录移除，原文留在 history。","help":"usage: va.py candidate-archive [-h] [--execute] [--expect EXPECT] path\n\npositional arguments:\n  path\n\noptions:\n  -h, --help       show this help message and exit\n  --execute\n  --expect EXPECT\n"},{"name":"fast-register","impact":"local","description":"绑定原生时轴配方与成片，生成快速基本审核模板，不自动通过。","help":"usage: va.py fast-register [-h] run recipe\n\npositional arguments:\n  run\n  recipe\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"compose-best","impact":"local","description":"从已有底片和透明译文字层生成完整最佳候选，不要求严格质量通过，不调用模型。","help":"usage: va.py compose-best [-h] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"finalize","impact":"local","description":"有界返工后输出完整翻译视频和瑕疵说明；已输出不等于质量通过。","help":"usage: va.py finalize [-h] run [spec]\n\npositional arguments:\n  run\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"maintain","impact":"local","description":"Inspect task-scoped cleanup; close preserves evidence and deletes a settled delivered run using the current preview fingerprint.","help":"usage: va.py maintain [-h] [--close] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help  show this help message and exit\n  --close\n"},{"name":"scratch-register","impact":"local","description":"Register one rebuildable work/runs/RUN cache file with hash and rebuild reason.","help":"usage: va.py scratch-register [-h] --reason REASON run path\n\npositional arguments:\n  run\n  path\n\noptions:\n  -h, --help       show this help message and exit\n  --reason REASON\n"},{"name":"budget-amend","impact":"local","description":"主控按真实用户授权修订总额及新增targets；保留历史费用和未知占位。","help":"usage: va.py budget-amend [-h] id spec\n\npositional arguments:\n  id\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"fireplay","impact":"write","description":"按完整需求编号准备宿主读取工具，或登记真实需求快照和解析决定。","help":"usage: va.py fireplay [-h] [--snapshot SNAPSHOT] [--decision DECISION] code\n\npositional arguments:\n  code\n\noptions:\n  -h, --help           show this help message and exit\n  --snapshot SNAPSHOT\n  --decision DECISION\n"},{"name":"fireplay-source","impact":"write","description":"从精确来源查询回执解析原片，可下载、探测并绑定真实哈希；不提交模型。","help":"usage: va.py fireplay-source [-h] [--video VIDEO] [--receipt RECEIPT]\n                             [--download]\n                             code\n\npositional arguments:\n  code\n\noptions:\n  -h, --help         show this help message and exit\n  --video VIDEO\n  --receipt RECEIPT\n  --download\n"},{"name":"fireplay-chat","impact":"write","description":"按当前用户配置创建/复用每需求一个聊天；带KIE持久同意和固定提交话术，未知创建不重发。","help":"usage: va.py fireplay-chat [-h] [--video VIDEO] [--receipt RECEIPT]\n                           [--execute]\n                           code\n\npositional arguments:\n  code\n\noptions:\n  -h, --help         show this help message and exit\n  --video VIDEO\n  --receipt RECEIPT\n  --execute          Journal dispatch BEFORE the host connector call; does not\n                     itself call Fireplay/Codex\n"},{"name":"fireplay-start","impact":"write","description":"绑定本需求真实请求、原账本、语言批次与KIE同意；续作不重开额度，P1不等待P0。","help":"usage: va.py fireplay-start [-h] [--video VIDEO] code spec\n\npositional arguments:\n  code\n  spec\n\noptions:\n  -h, --help     show this help message and exit\n  --video VIDEO\n"},{"name":"fireplay-return","impact":"write","description":"核验正式交付包并建立回传outbox；partial:true可先交就绪语种，保留pending及旧绑定记录，不调用外部服务。","help":"usage: va.py fireplay-return [-h] code spec\n\npositional arguments:\n  code\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"fireplay-dispatch","impact":"write","description":"预览下一回传步骤；--execute先记录unknown并准备参数，宿主再执行一次。","help":"usage: va.py fireplay-dispatch [-h] [--video VIDEO] [--execute] code\n\npositional arguments:\n  code\n\noptions:\n  -h, --help     show this help message and exit\n  --video VIDEO\n  --execute      Journal dispatch BEFORE the host connector call; does not\n                 itself call Fireplay/Codex\n"},{"name":"fireplay-retry-upload","impact":"write","description":"有真实上传超时证据与用户授权时，预览或有界登记一次新文件上传尝试；保留旧unknown，已有资源或入库结果不重传，命令不调用外部连接器。","help":"usage: va.py fireplay-retry-upload [-h] [--video VIDEO] [--execute]\n                                   code locale spec\n\npositional arguments:\n  code\n  locale\n  spec\n\noptions:\n  -h, --help     show this help message and exit\n  --video VIDEO\n  --execute      Journal dispatch BEFORE the host connector call; does not\n                 itself call Fireplay/Codex\n"},{"name":"fireplay-receipt","impact":"write","description":"登记上传/入库真实回执；绑定须有平台读回证明，不自动更改需求状态。","help":"usage: va.py fireplay-receipt [-h] [--video VIDEO] code operation spec\n\npositional arguments:\n  code\n  operation\n  spec\n\noptions:\n  -h, --help     show this help message and exit\n  --video VIDEO\n"},{"name":"fireplay-status","impact":"read","description":"查看需求、各原视频、全部目标语种、聊天、批次与回传状态。","help":"usage: va.py fireplay-status [-h] code\n\npositional arguments:\n  code\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"fireplay-completion-check","impact":"write","description":"用当前平台delivery读回逐项核对全部原片/目标语种、已审视频哈希和绑定素材ID，保存整项完整性回执；部分批次或done标签不能放行，不执行外部写入。","help":"usage: va.py fireplay-completion-check [-h] code spec\n\npositional arguments:\n  code\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"font-bind","impact":"write","description":"核验真实字体字面和缺字；提取TTC正确字重到本run并返回绑定哈希，不自动审核。","help":"usage: va.py font-bind [-h] --family FAMILY [--bold] [--text TEXT] run\n\npositional arguments:\n  run\n\noptions:\n  -h, --help       show this help message and exit\n  --family FAMILY\n  --bold\n  --text TEXT\n"},{"name":"ledger","impact":"write","description":"需求台账的同步、预览、状态查询、占用/心跳/释放、阶段、就绪、阻塞/恢复、ETA、链接和备份；具体边界按子动作与实际回执。","help":"usage: va.py ledger [-h] [--spec SPEC] [--id ID]\n                    {sync,preview,status,detail,register,claim,heartbeat,release,stage,ready,block,resume,eta,link,backup}\n\npositional arguments:\n  {sync,preview,status,detail,register,claim,heartbeat,release,stage,ready,block,resume,eta,link,backup}\n\noptions:\n  -h, --help            show this help message and exit\n  --spec SPEC           Workspace-relative JSON input; use a stable\n                        operation_id for retries\n  --id ID               Exact ledger requirement ID\n"},{"name":"fireplay-pull","impact":"write","description":"按真实用户指定编号或范围准备读取队列，完整分页后P0排序；P1并行继续，逐需求独立聊天与账本，不启动后台或付费任务。","help":"usage: va.py fireplay-pull [-h] spec\n\npositional arguments:\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"fireplay-monitor","impact":"write","description":"status查询；scan登记真实完整需求分页；assess登记Agent基于实际brief的翻译判断；signal为授权后续动作登记unknown/回执。连接器读取、聊天消息及制作由宿主按实际授权执行，命令本身不代发。","help":"usage: va.py fireplay-monitor [-h] [--spec SPEC] [--code CODE]\n                              {status,scan,assess,signal}\n\npositional arguments:\n  {status,scan,assess,signal}\n\noptions:\n  -h, --help            show this help message and exit\n  --spec SPEC\n  --code CODE\n"},{"name":"fireplay-publication-review","impact":"write","description":"对完整正式outputs成品记录真实缺陷严重度；普通小瑕疵可发布，严重/过多问题阻断，保留内部质量。","help":"usage: va.py fireplay-publication-review [-h] code spec\n\npositional arguments:\n  code\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"fireplay-youtube-route","impact":"write","description":"仅在明确选择账号的任务中登记真实选择；当前platform_managed默认由Fireplay路由，不是固定回传的必经步骤。","help":"usage: va.py fireplay-youtube-route [-h] [--video VIDEO] code spec\n\npositional arguments:\n  code\n  spec\n\noptions:\n  -h, --help     show this help message and exit\n  --video VIDEO\n"},{"name":"fireplay-youtube-handoff","impact":"write","description":"核验精确素材、资源、上传任务或链接及交付哈希；不重新入库。","help":"usage: va.py fireplay-youtube-handoff [-h] code spec\n\npositional arguments:\n  code\n  spec\n\noptions:\n  -h, --help  show this help message and exit\n"},{"name":"fireplay-close","impact":"write","description":"仅在全部原片/目标语种的当前完整性读回通过后登记本地结案；保留原提交历史，不修改外部状态或追踪YouTube。","help":"usage: va.py fireplay-close [-h] code\n\npositional arguments:\n  code\n\noptions:\n  -h, --help  show this help message and exit\n"}],"scripts":[["bin/ocr.py","兼容入口：生成 Codex 识字工作包，不运行 OCR 模型。"],["bin/asr.py","旧 ASR 兼容入口，与 va asr 共用实现。"],["bin/separate_local_audio.py","本地人声／伴奏分离，保留来源与检查点。"],["bin/mix_localized_narration.py","独立配音混音的兼容入口，与 audio-mix 共用。"],["bin/build_repair_master.py","本地传统修复对照工具，部分历史规则仍是素材专用。"],["bin/repair_video_text.py","既有局部去字修复工具，不等于调用视频模型。"],["bin/setup.ps1","准备项目工具、模型依赖和字体；实际范围查看脚本。"],["bin/project-hooks.ps1","安装／查询／卸载 Windows 项目知识整理触发器。"],["bin/mcp_server.py","项目 stdio MCP 桥，共用执行器，不自动连接宿主。"]],"branch":"main"}</script>
<script>
'use strict';
const DATA=JSON.parse(document.querySelector('#embedded-data').textContent), chapters=DATA.chapters, sources=DATA.sources, commandList=DATA.commands;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=Object.fromEntries(chapters.map(c=>[c.id,c]));
const totalNodes=chapters.reduce((n,c)=>n+c.nodes.length,0),totalBranches=chapters.reduce((n,c)=>n+c.nodes.reduce((a,v)=>a+v.branches.length,0),0);
const titleOf=id=>byId[id]?.title||({overview:'全流程总览',commands:'全部命令',sources:'来源与验证',all:'完整阅读'}[id]||id);
let current='overview',filter='all',searchTimer;
function nav(){let out='<div class="navgroup">总览</div><a href="#overview" data-page="overview"><span class="num">↗</span>全流程总览</a>';chapters.forEach((c,i)=>{if(i===1)out+='<div class="navgroup">从收件到交付</div>';if(c.id==='feedback')out+='<div class="navgroup">反馈、维护与异常</div>';out+=`<a href="#${c.id}" data-page="${c.id}"><span class="num">${i?String(i).padStart(2,'0'):'·'}</span>${esc(c.title.replace(/^\d+ /,''))}</a>`});out+='<div class="navgroup">查阅</div><a href="#commands" data-page="commands"><span class="num">⌘</span>全部命令与作用</a><a href="#sources" data-page="sources"><span class="num">≡</span>依据原文与验证范围</a><a href="#all" data-page="all"><span class="num">↓</span>完整连续阅读</a>';$('#nav').innerHTML=out}
const side=(id,title,text,pos)=>`<div class="sidestep ${pos}">${id?`<a href="#${id}"><strong>${esc(title)}</strong>${esc(text)}</a>`:''}</div>`;
function overview(){const rows=[
['intake','01','收件：原片 + 目标语言','检查工具、确认要求、建立制作现场',['start','谁负责什么','你定要求，AI 判断，程序执行'],['deploy','工具或素材不齐','安装／补件／恢复现有任务']],
['budget','02','整次请求共用预算','原视频实际时长 × 3 credits；所有语言、模型及返工共用',['batch','多种语言','先选代表语言，各语言独立 run'],['recovery','授权、余额或账单有问题','暂停该调用，先补授权或对账']],
['analysis','03–04','看懂原片，记录所有实例','源帧、音轨、OCR、镜头与覆盖证据',['context','有精确同源记录','核验源解析；不继承新语言审核'],['ocr','看不清／没识别全','补原尺寸边界帧，可选 GLM']],
['audio','05–06','声音判断 + 共同译稿','音乐音效保留；人声翻译；字幕跟实际声音',['captions','有人声和字幕','定稿 → 配音／混音 → 实际对齐'],['audio','没有人声／没有音轨','原音保留／保持源片无声']],
['context','07–08','查方法，再按镜头选路线','平坦覆盖、局部修复、模型编辑或重建',['routes','8 条画面路线','画面路线与声音策略分别选择'],['model','模型路线','预览实际请求 → 账本预留 → 提交']],
['neutral','09–10','无字底片与目标字层','实际检查原字、背景、前景、运动和遮挡',['repair','复杂去字／移动水印','预检查 → 配方探针 → 完整修复'],['repair','残字、糊化或运动损伤','记录具体帧，回修复；不放行']],
['plan','11–13','计划冻结 → 真实编码','绑定所有输入，选择音轨，保存候选',['render','可恢复检查点','未变部分复用；不复用合格结论'],['reuse','输入没变，能否少做一次？','核对范围和指纹，只复用计算结果']],
['review','14–15','逐实例视听检查 → quality','硬性缺陷、证据、字幕同步和评分一起查',['blind','要比较不同路线','同条件候选 → 遮蔽评分 → 揭示'],['quality','未通过：有限返工','单次改一个主要变量，最多两轮']],
['batch','16','代表语言通过 → 逐语言扩展','每种语言重做译稿、声音、排版和审核',['neutral','共享底片已审','同源同区间才可绑定复用'],['review','某种语言失败或待审','批次停在该处，补完再继续']],
['delivery','17','正式交付 + 独立归档','final.mp4、依赖包、案例、inbox、目录',['learning','结果进入候选经验','有来源审查后才启用为方法'],['feedback','用户提出质量异议','绑定实际哈希，阻断旧版本复用']],
['storage','18','保全错误依据，再清理旧现场','必要案例、账本与安装资产独立保留',['learning','还没有合格成片','记录实际失败，不伪造候选或通过'],['reuse','下次是否还要重做','资产保留且输入匹配才可复用']]
];return `<div class="kicker">项目全景 · 中文解释 · 可追溯来源</div><h1>一条广告，怎样变成<br>经检查的多语言视频？</h1><p class="lede">从收到视频，到选路、制作、逐项检查，再到交付、复用和清理。每一步的条件、去向和失败处理都展开在这里。</p><div class="notice"><strong>本轮更新：临时目录、复用与清理</strong><p>work 是临时工作区，模型和依赖已迁入 .runtime；相同输入可复用计算结果，换语言与变更后的质量结论必须重新建立。</p><p><a href="#reuse">哪些复用、哪些重做 →</a>　<a href="#storage/work-lifecycle">work 怎么清空 →</a>　<a href="#learning/preproduction-failure">没有成片如何结案 →</a></p></div><div class="stats"><div class="stat"><b>${chapters.length-1}</b>流程章节</div><div class="stat"><b>${totalNodes}</b>解释节点</div><div class="stat"><b>${totalBranches}</b>条件与去向</div><div class="stat"><b>${commandList.length}</b>CLI 入口</div></div><div class="sectionhead"><h2>完整主线与关键分叉</h2><div class="legend"><span><i class="dot"></i>制作主线</span><span><i class="dot blue"></i>关联分支</span><span><i class="dot amber"></i>条件与回退</span></div></div><div class="overview">${rows.map(([id,num,t,s,l,r])=>`<div class="maprow">${side(...l,'left')}<div class="mainstep"><a href="#${id}"><span class="stepnum">${num}</span><div><strong>${esc(t)}</strong><small>${esc(s)}</small></div></a></div>${side(...r,'right')}</div>`).join('')}</div><div class="loopband"><div><h3><a href="#recovery">制作循环 ↗</a></h3><p>判断 → 执行 → 看实际结果 → 通过或有限返工。证据不足就保留待审。</p></div><div><h3><a href="#learning">学习循环 ↗</a></h3><p>结果 → 候选 → 审查启用 → 下次检索。自动复盘不自动修改正式规则。</p></div><div><h3><a href="#storage">文件生命周期 ↗</a></h3><p>任务现场 → 独立保全 → 精确预览 → 授权清理。知识与交付各自保存。</p></div></div><div class="sectionhead"><h2>三个必须分开的判断</h2></div><div class="rolegrid"><div><strong>能执行</strong><p>工具存在、接口连通、媒体可解码，只证明技术步骤能运行。</p></div><div><strong>当前版本合格</strong><p>实际画面、声音、字幕、证据和质量检查通过，并注明谁审的。</p></div><div><strong>用户或公司认可</strong><p>有真实反馈、明确范围和对应版本。不能从自审或模型成功推导。</p></div></div><div class="notice">当前工程门槛：无硬性缺陷，必要证据齐全，综合分至少 85。单次请求共用费用账本；每 run 默认最多两笔新任务、两轮制作返工。本地修复探针另有次数和耗时限制。</div><div class="chapterbar"><button data-go="start">从职责分工开始</button><button data-go="all">完整连续阅读</button><button data-go="commands">查全部命令</button><button data-go="sources">查依据原文</button></div>`}
function sourceButtons(paths){return paths.map(p=>`<button class="sourcebtn" data-source="${esc(p)}">${esc(p)}</button>`).join('')}
function nodeMarkup(n,i,c){return `<section class="flowitem" id="node-${n.id}"><span class="flowindex">${i+1}</span><details class="node" open><summary><div><span class="owner">${esc(n.owner)}</span><h3>${esc(n.title)}</h3></div></summary><div class="nodebody">${n.body.map(p=>`<p>${esc(p)}</p>`).join('')}${n.commands.length?`<div class="commands">${n.commands.map(t=>`<code>${esc(t)}</code>`).join('')}</div>`:''}${n.files.length?`<div class="paths">落点：${n.files.map(p=>`<code>${esc(p)}</code>`).join(' ')}</div>`:''}</div></details><div class="decision"><div class="decisionlabel"><span class="diamond"></span>条件 → 接下来做什么</div><div class="branches">${n.branches.map(([label,body,to])=>`<a class="branch" href="#${to}"><strong>${esc(label)}</strong><span>${esc(body)}</span><span class="destination">${to===c.id?'继续本节判断':'进入 '+esc(titleOf(to))} →</span></a>`).join('')}</div></div></section>`}
function chapterMarkup(c,all=false){const idx=chapters.indexOf(c);return `<article class="${all?'allchapter':''}" id="chapter-${c.id}"><div class="kicker">${idx?'制作与维护 / '+String(idx).padStart(2,'0'):'职责与概念'} · ${c.nodes.length} 个判断节点</div><h${all?'2':'1'}>${esc(c.title)}</h${all?'2':'1'}><p class="lede">${esc(c.summary)}</p><div class="chapterbar"><button data-expand="true">展开本节</button><button data-expand="false">只看判断与分叉</button><button data-go="overview">返回总览</button></div><div class="flow">${c.nodes.map((n,i)=>nodeMarkup(n,i,c)).join('')}</div><div class="sourcesline"><h3>本节依据 · 随页保存的原文快照</h3>${sourceButtons(c.sources)}</div><div class="chapterend"><a href="#${idx?chapters[idx-1].id:'overview'}">← ${idx?esc(chapters[idx-1].title):'全流程总览'}</a>${idx<chapters.length-1?`<a href="#${chapters[idx+1].id}">${esc(chapters[idx+1].title)} →</a>`:'<a href="#commands">全部命令与作用 →</a>'}</div></article>`}
function commands(){const rows=commandList.filter(c=>filter==='all'||c.impact===filter);return `<div class="kicker">执行入口 · 只读命令说明</div><h1>全部命令与作用</h1><p class="lede">命令名称与参数原文取自当前 CLI 的 --help。RUN、SPEC、ID、PATH 等是占位符；页面不执行命令。</p><div class="notice">使用前缀 <code>bin/va.ps1</code>。下表“本地写入”可能生成证据、索引、候选或归档；“可付费”须显式执行及账本授权；“可删除”须用户授权、当前预览和指纹。查询远端也会发生网络访问，不能理解成完全离线。</div><div class="filterrow">${[['all','全部'],['read','查询／检查'],['write','本地生成／更新'],['paid','可付费外发'],['delete','可删除']].map(([v,t])=>`<button data-filter="${v}" aria-pressed="${filter===v}">${t}</button>`).join('')}</div><table class="catalog"><thead><tr><th>命令 / 参数原文</th><th>人话解释</th><th>影响</th></tr></thead><tbody>${rows.map(c=>`<tr><td><button class="sourcebtn" data-command="${esc(c.name)}">${esc(c.name)}</button></td><td>${esc(c.description)}</td><td><span class="impact ${c.impact}">${({read:'查询／检查',write:'本地写入',paid:'可付费',delete:'可删除'})[c.impact]}</span></td></tr>`).join('')}</tbody></table><h2>直接脚本入口</h2><table class="catalog"><tbody>${DATA.scripts.map(([p,d])=>`<tr><td><code>${esc(p)}</code></td><td>${esc(d)}</td></tr>`).join('')}</tbody></table><div class="sourcesline">${sourceButtons(['src/video_localizer/cli.py','bin/mcp_server.py','docs/tools-and-locations.md'])}</div>`}
function sourcePage(){return `<div class="kicker">来源清单 · 2026-10-22</div><h1>依据原文与验证范围</h1><p class="lede">这份图解释的是读取时的工作区版本。正文说明按项目合同维护；随页来源与命令帮助可用 bin/sync_flow_reference.py 从源码刷新。</p><div class="snapshot"><div><h3>本次实际做过</h3><p>读取工作流、技能、质量／音频／知识规范、配置和关键实现；运行 doctor、kie-authorization；重新读取 CLI --help，补齐 local-tts、voice-install、close-failure 和版本清理入口；刷新来源正文与哈希，并检查页面数据、导航、搜索和脚本。</p></div><div><h3>本次没有验证的事情</h3><p>这次只更新流程文档，未重新运行视频回归、未提交付费模型、未制作新广告。浏览器工具限制读取 file: 页面，因此不声称已完成浏览器截图或视觉验收。上轮清理的测试结果与本页更新分开报告。</p></div></div><div class="notice">当前运行环境请执行 doctor 核对；付费授权以本机 kie-authorization 为准。源码副本不继承他人授权；来源附件不包含 .env 或本机私有配置。</div><div class="sectionhead"><h2>${sources.length} 份来源快照</h2><small>原文包含历史段落时，以日期、索引状态与当前实现判断</small></div>${sources.map(s=>`<div class="sourceitem"><button data-source="${esc(s.path)}">${esc(s.path)}</button><small>${s.lines} 行 · SHA256 ${esc(s.sha256)}</small></div>`).join('')}<div class="sourcesline"><h3>读图口径</h3><p>示例不是当前任务状态；文档路径相对项目根目录。落点若写 analysis/、inputs/、jobs/ 或 review/，通常指当前 runs/&lt;RUN&gt;/ 内；根目录 outputs/、media/、state/、knowledge/ 另有标明。src 与配置原文可以在此直接打开，避免只凭概括理解。</p></div>`}
function highlight(s,q){const v=String(s),idx=v.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return esc(v);return esc(v.slice(0,idx))+'<mark>'+esc(v.slice(idx,idx+q.length))+'</mark>'+esc(v.slice(idx+q.length))}
function search(q){current='search';const matches=[];chapters.forEach(c=>c.nodes.forEach(n=>{const text=[n.title,n.owner,...n.body,...n.commands,...n.files,...n.branches.flat()].join(' ');if(text.toLowerCase().includes(q.toLowerCase())){const body=n.body.find(t=>t.toLowerCase().includes(q.toLowerCase()))||n.branches.map(b=>b[1]).find(t=>t.toLowerCase().includes(q.toLowerCase()))||n.commands.find(t=>t.toLowerCase().includes(q.toLowerCase()))||n.body[0];matches.push({title:n.title,section:c.title,text:body,href:'#'+c.id+'/'+n.id})}}));commandList.forEach(c=>{if((c.name+' '+c.description).toLowerCase().includes(q.toLowerCase()))matches.push({title:c.name,section:'命令入口',text:c.description,command:c.name})});$('#main').className='';$('#main').innerHTML=`<div class="kicker">全局检索</div><h1>找到 ${matches.length} 个相关位置</h1><p class="lede">“${esc(q)}”</p><div class="results">${matches.length?matches.map(m=>`<article class="result"><small>${esc(m.section)}</small><h3>${m.command?`<button class="sourcebtn" data-command="${esc(m.command)}">${highlight(m.title,q)}</button>`:`<a href="${m.href}">${highlight(m.title,q)}</a>`}</h3><p>${highlight(m.text,q)}</p></article>`).join(''):'<p class="empty">没有匹配项。可以换用“预算”“字幕”“底片”“失败”“清理”，或直接搜索命令名。</p>'}</div>`;activeNav()}
function activeNav(){document.querySelectorAll('#nav a').forEach(a=>{const selected=a.dataset.page===current;a.classList.toggle('active',selected);if(selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function fullCommands(){const previous=filter;filter='all';try{return commands()}finally{filter=previous}}
function render(){const [id,nodeId]=location.hash.slice(1).split('/');current=id||'overview';if(!byId[current]&&!['overview','all','commands','sources'].includes(current))current='overview';$('#search').value='';$('#clearsearch').hidden=true;$('#main').className=current==='all'?'readall':'';$('#main').innerHTML=(current==='overview'?overview():current==='all'?overview()+chapters.map(c=>chapterMarkup(c,true)).join('')+fullCommands()+sourcePage():current==='commands'?commands():current==='sources'?sourcePage():chapterMarkup(byId[current]))+'<footer>广告视频本地化 · 项目流程快照 · 2026-10-22 · 离线可读，无外部请求</footer>';activeNav();document.body.classList.remove('menuopen');$('#menutoggle').setAttribute('aria-expanded','false');if(nodeId){const target=document.getElementById('node-'+nodeId);if(target){requestAnimationFrame(()=>{target.scrollIntoView({block:'start'});target.classList.add('jumpflash')})}}else window.scrollTo({top:0,behavior:'instant'});document.title=(current==='overview'?'全流程地图':titleOf(current))+' · 广告视频本地化'}
function openSource(path){const s=sources.find(s=>s.path===path);if(!s)return;$('#sourceTitle').textContent=s.path;$('#sourceMeta').textContent=s.lines+' 行 · SHA256 '+s.sha256+' · 读取时原文快照';$('#sourceText').textContent=s.text.split('\n').map((line,i)=>String(i+1).padStart(4,' ')+'  '+line).join('\n');$('#sourceDialog').showModal()}
function openCommand(name){const c=commandList.find(c=>c.name===name);if(!c)return;$('#sourceTitle').textContent='bin/va.ps1 '+name+' --help';$('#sourceMeta').textContent=c.description+' · 参数来自当前 CLI 实际帮助输出；命令并未执行';$('#sourceText').textContent=c.help;$('#sourceDialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-source],[data-command],[data-expand],[data-filter]');if(!b)return;if(b.dataset.go){if(location.hash==='#'+b.dataset.go)render();else location.hash=b.dataset.go}else if(b.dataset.source)openSource(b.dataset.source);else if(b.dataset.command)openCommand(b.dataset.command);else if(b.dataset.expand){b.closest('article').querySelectorAll('details').forEach(d=>d.open=b.dataset.expand==='true')}else if(b.dataset.filter){filter=b.dataset.filter;$('#main').innerHTML=commands()}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&a.hash===location.hash){e.preventDefault();render()}});
$('#search').addEventListener('input',()=>{clearTimeout(searchTimer);const q=$('#search').value.trim();$('#clearsearch').hidden=!q;searchTimer=setTimeout(()=>q?search(q):render(),120)});
$('#clearsearch').onclick=()=>{clearTimeout(searchTimer);render();$('#search').focus()};$('#closeDialog').onclick=()=>$('#sourceDialog').close();$('#sourceDialog').onclick=e=>{if(e.target===$('#sourceDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};
$('#menutoggle').onclick=()=>{const open=document.body.classList.toggle('menuopen');$('#menutoggle').setAttribute('aria-expanded',String(open))};$('#backtop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
let printState=null;window.addEventListener('beforeprint',()=>{if(printState)return;printState={html:$('#main').innerHTML,classes:$('#main').className};$('#main').className='readall';$('#main').innerHTML=overview()+chapters.map(c=>chapterMarkup(c,true)).join('')+fullCommands()+sourcePage();document.querySelectorAll('details').forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>{if(printState){$('#main').innerHTML=printState.html;$('#main').className=printState.classes;printState=null}});$('#print').onclick=()=>window.print();window.addEventListener('hashchange',render);nav();render();
</script>
</body>
</html>
